r the desired number of repetitions."]},{"name":"Smith Machine Reverse Decline Close Grip Bench Press","gif":"QyO6Uma.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"smith machine","bodyParts":["chest"],"instructions":["Adjust the smith machine to a decline position.","Lie down on the bench with your feet secured under the foot pads.","Grasp the barbell with a close grip, slightly narrower than shoulder-width apart.","Unrack the barbell and lower it slowly towards your chest, keeping your elbows tucked in.","Pause for a moment at the bottom, then push the barbell back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Narrow Row","gif":"JGKowMS.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","rear deltoids"],"equipment":"smith machine","bodyParts":["back"],"instructions":["Adjust the seat height and position yourself on the machine with your feet flat on the floor.","Grasp the handles with an overhand grip, slightly narrower than shoulder-width apart.","Keep your back straight and your chest up as you pull the handles towards your body, squeezing your shoulder blades together.","Pause for a moment at the peak of the movement, then slowly release the handles back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith One Arm Row","gif":"Q4DSJPC.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"smith machine","bodyParts":["back"],"instructions":["Adjust the height of the smith machine bar to waist level.","Stand facing the smith machine with your feet shoulder-width apart.","Bend your knees slightly and hinge forward at the hips, keeping your back straight.","Grasp the bar with one hand using an overhand grip, with your palm facing down.","Keep your elbow close to your body and pull the bar towards your waist, squeezing your shoulder blades together.","Pause for a moment at the top of the movement, then slowly lower the bar back to the starting position.","Repeat for the desired number of repetitions, then switch to the other arm."]},{"name":"Smith One Leg Floor Calf Raise","gif":"9GXrTE6.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"smith machine","bodyParts":["lower legs"],"instructions":["Position yourself on the floor under the smith machine bar, facing away from the machine.","Place the balls of your feet on a raised surface, such as a weight plate or block.","Position the smith machine bar across your lower legs, just above your ankles.","Hold onto the bar with your hands for stability.","Raise your heels off the ground by extending your ankles, lifting your body up.","Pause at the top of the movement, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Rear Delt Row","gif":"nFUwqG6.gif","primaryMuscles":["delts"],"secondaryMuscles":["trapezius","rhomboids","biceps"],"equipment":"smith machine","bodyParts":["shoulders"],"instructions":["Adjust the seat height and position yourself on the machine with your chest against the pad and your feet flat on the ground.","Grasp the handles with an overhand grip, slightly wider than shoulder-width apart.","Keep your back straight and your core engaged as you pull the handles towards your chest, squeezing your shoulder blades together.","Pause for a moment at the top of the movement, then slowly release the handles back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Reverse Calf Raises","gif":"ywaNfuh.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings"],"equipment":"smith machine","bodyParts":["lower legs"],"instructions":["Adjust the smith machine bar to a height just below your shoulders.","Stand facing the bar with your feet hip-width apart and toes pointing forward.","Place the balls of your feet on the edge of a step or platform, with your heels hanging off.","Hold onto the bar for support, keeping your back straight and core engaged.","Raise your heels as high as possible, lifting your body weight onto the balls of your feet.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Reverse Grip Bent Over Row","gif":"aaxA3cm.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"smith machine","bodyParts":["back"],"instructions":["Set up the smith machine with the bar at hip height.","Stand facing the bar with your feet shoulder-width apart.","Bend your knees slightly and hinge forward at the hips, keeping your back straight.","Grasp the bar with an underhand grip, hands shoulder-width apart.","Pull the bar towards your lower chest, squeezing your shoulder blades together.","Pause for a moment at the top, then slowly lower the bar back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Reverse-Grip Press","gif":"zK8Fu1W.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"smith machine","bodyParts":["chest"],"instructions":["Adjust the height of the smith machine bar to chest level.","Stand facing the bar with your feet shoulder-width apart.","Grasp the bar with an overhand grip, hands slightly wider than shoulder-width apart.","Step back and position yourself with a slight bend in your knees.","Keep your chest up and core engaged throughout the exercise.","Lower the bar towards your chest, keeping your elbows tucked in.","Pause for a moment at the bottom, then push the bar back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Seated One Leg Calf Raise","gif":"0S75mYG.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings"],"equipment":"smith machine","bodyParts":["lower legs"],"instructions":["Sit on the machine with your back against the pad and your feet on the footrest.","Place one leg on the footrest and keep the other leg off the footrest.","Using your calf muscles, raise your heel as high as possible.","Pause for a moment at the top, then slowly lower your heel back down to the starting position.","Repeat for the desired number of repetitions, then switch legs and repeat."]},{"name":"Smith Seated Shoulder Press","gif":"xUwnBMT.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"smith machine","bodyParts":["shoulders"],"instructions":["Adjust the seat height so that the handles are at shoulder level.","Sit on the machine with your back against the pad and your feet flat on the floor.","Grasp the handles with an overhand grip and lift them off the supports, extending your arms fully.","Lower the handles down to shoulder level, keeping your elbows slightly bent.","Press the handles up overhead until your arms are fully extended.","Pause for a moment at the top, then slowly lower the handles back down to shoulder level.","Repeat for the desired number of repetitions."]},{"name":"Smith Seated Wrist Curl","gif":"B6dAO1t.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","brachialis"],"equipment":"smith machine","bodyParts":["lower arms"],"instructions":["Sit on a bench in front of a Smith machine with your feet flat on the ground.","Grasp the barbell with an underhand grip, hands shoulder-width apart.","Rest your forearms on your thighs, allowing your wrists to hang off.","Slowly curl your wrists upward, bringing the barbell towards your forearms.","Pause for a moment at the top, then slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Shoulder Press","gif":"903mzG8.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"smith machine","bodyParts":["shoulders"],"instructions":["Adjust the seat height and position yourself on the smith machine with your feet shoulder-width apart.","Grasp the bar with an overhand grip, slightly wider than shoulder-width apart.","Lift the bar off the rack and position it at shoulder level, with your elbows bent and palms facing forward.","Press the bar upward until your arms are fully extended overhead.","Pause for a moment at the top, then slowly lower the bar back down to shoulder level.","Repeat for the desired number of repetitions."]},{"name":"Smith Shrug","gif":"OUQ0ZyW.gif","primaryMuscles":["traps"],"secondaryMuscles":["shoulders"],"equipment":"smith machine","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and your knees slightly bent.","Grasp the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Keep your arms straight and your shoulders relaxed.","Lift your shoulders up towards your ears, squeezing your traps at the top.","Hold for a moment, then slowly lower your shoulders back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Single Leg Split Squat","gif":"wWFspEi.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings"],"equipment":"smith machine","bodyParts":["upper legs"],"instructions":["Stand in front of the smith machine with your feet shoulder-width apart.","Place one foot behind you on a bench or step, with your toes pointing forward.","Hold onto the smith machine bar for stability.","Bend your front knee and lower your body down into a lunge position, keeping your back straight.","Pause for a moment at the bottom, then push through your front heel to return to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"Smith Sprint Lunge","gif":"HsjbB1z.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"smith machine","bodyParts":["upper legs"],"instructions":["Set up the smith machine with the barbell at hip height.","Stand facing away from the machine with your feet shoulder-width apart.","Step back with your right foot and place it on the barbell, resting the top of your foot on the bar.","Bend your left knee and lower your body into a lunge position, keeping your back straight.","Push through your left heel to return to the starting position.","Repeat on the other side, stepping back with your left foot.","Continue alternating sides for the desired number of repetitions."]},{"name":"Smith Squat","gif":"jFtipLl.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"smith machine","bodyParts":["upper legs"],"instructions":["Set up the smith machine with the barbell at an appropriate height for your squat.","Stand with your feet shoulder-width apart, toes slightly turned out.","Position yourself under the barbell, resting it on your upper traps and shoulders.","Grip the barbell with a wide grip, slightly wider than shoulder-width apart.","Engage your core and unrack the barbell, stepping back to clear the rack.","Keeping your chest up and back straight, initiate the squat by bending at the hips and knees.","Lower your body until your thighs are parallel to the ground or slightly below.","Pause for a moment at the bottom, then drive through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Standing Back Wrist Curl","gif":"hfmQ0Tz.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","triceps"],"equipment":"smith machine","bodyParts":["lower arms"],"instructions":["Stand facing the smith machine with your feet shoulder-width apart.","Grasp the barbell with an overhand grip, hands shoulder-width apart.","Keep your back straight and your elbows close to your body.","Slowly curl your wrists upwards, bringing the barbell towards your body.","Pause for a moment at the top, then slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Standing Behind Head Military Press","gif":"ht8xDrP.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"smith machine","bodyParts":["shoulders"],"instructions":["Adjust the seat height of the smith machine so that the bar is at shoulder level.","Stand with your feet shoulder-width apart and your knees slightly bent.","Grasp the bar with an overhand grip, slightly wider than shoulder-width apart.","Lift the bar off the rack and step back, maintaining a stable stance.","Position the bar behind your head, resting on your upper traps.","Keep your core engaged and your chest lifted throughout the exercise.","Press the bar overhead by extending your arms, fully straightening them.","Pause briefly at the top of the movement, then slowly lower the bar back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Standing Leg Calf Raise","gif":"6MaEjVA.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"smith machine","bodyParts":["lower legs"],"instructions":["Adjust the smith machine bar to a height that allows you to stand with your feet flat on the ground and your shoulders under the bar.","Position yourself under the bar with your feet shoulder-width apart and your toes pointing forward.","Place your hands on the bar for stability.","Engage your calves and slowly raise your heels off the ground, lifting your body up onto your toes.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Standing Military Press","gif":"jjUPrze.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"smith machine","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and your knees slightly bent.","Grasp the barbell with an overhand grip, slightly wider than shoulder-width apart.","Lift the barbell off the rack and bring it down to shoulder level, with your palms facing forward.","Press the barbell upward until your arms are fully extended overhead.","Pause for a moment at the top, then slowly lower the barbell back down to shoulder level.","Repeat for the desired number of repetitions."]},{"name":"Smith Sumo Squat","gif":"dzz6BiV.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"smith machine","bodyParts":["upper legs"],"instructions":["Set up the smith machine with the barbell at hip height.","Stand with your feet wider than shoulder-width apart, toes pointing outwards.","Position yourself under the barbell, resting it on your upper back and shoulders.","Engage your core and keep your chest up as you lower your body down into a squat position, pushing your hips back and bending your knees.","Lower yourself until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Toe Raise","gif":"Y4QlY8z.gif","primaryMuscles":["calves"],"secondaryMuscles":["ankles","shins"],"equipment":"smith machine","bodyParts":["lower legs"],"instructions":["Adjust the smith machine bar to a height that allows you to comfortably stand with your feet flat on the ground.","Position yourself under the bar with your shoulders directly below it and your feet shoulder-width apart.","Place the balls of your feet on a raised platform or weight plates, with your heels hanging off the edge.","Grasp the bar with an overhand grip, slightly wider than shoulder-width apart.","Engage your core and keep your back straight throughout the exercise.","Slowly raise your heels as high as possible, lifting your body weight onto the balls of your feet.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Upright Row","gif":"1DN3iz4.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","biceps"],"equipment":"smith machine","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, facing the smith machine.","Grasp the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Keep your back straight and your core engaged.","Pull the barbell up towards your chin, leading with your elbows.","Pause for a moment at the top, then slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Smith Wide Grip Bench Press","gif":"zoOvPcx.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"smith machine","bodyParts":["chest"],"instructions":["Adjust the bench to a comfortable position on the smith machine.","Lie down on the bench with your feet flat on the ground.","Grasp the barbell with a wide grip, slightly wider than shoulder-width apart.","Unrack the barbell and lower it slowly towards your chest, keeping your elbows out to the sides.","Pause for a moment when the barbell touches your chest.","Push the barbell back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Smith Wide Grip Decline Bench Press","gif":"wi2H9QX.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"smith machine","bodyParts":["chest"],"instructions":["Adjust the decline bench to the desired angle.","Lie down on the bench with your feet secured under the foot pads.","Grasp the barbell with a wide grip, slightly wider than shoulder-width apart.","Unrack the barbell and lower it slowly towards your chest, keeping your elbows pointed outwards.","Pause for a moment when the barbell touches your chest.","Push the barbell back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Snatch Pull","gif":"dG5Smob.gif","primaryMuscles":["quads"],"secondaryMuscles":["hamstrings","glutes","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and the barbell on the ground in front of you.","Bend your knees and hinge at the hips to lower into a squat position, gripping the barbell with an overhand grip.","Keep your back straight and chest up as you drive through your heels to lift the barbell off the ground, extending your hips and knees.","As the barbell reaches hip level, explosively pull it upwards, shrugging your shoulders and pulling your elbows high and to the sides.","As the barbell reaches its highest point, quickly drop underneath it, pulling yourself into a deep squat position.","Catch the barbell overhead with your arms fully extended and your knees bent.","Stand up by extending your hips and knees, keeping the barbell overhead.","Lower the barbell back down to the starting position by reversing the movement.","Repeat for the desired number of repetitions."]},{"name":"Spell Caster","gif":"p9cCe2r.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","lower back"],"equipment":"dumbbell","bodyParts":["waist"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in one hand.","Bend your knees slightly and hinge forward at the waist, keeping your back straight.","Extend your arm with the dumbbell towards the opposite foot, rotating your torso as you do so.","Return to the starting position and repeat on the other side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Sphinx","gif":"DIVyqrU.gif","primaryMuscles":["spine"],"secondaryMuscles":["glutes","hamstrings"],"equipment":"body weight","bodyParts":["back"],"instructions":["Lie face down on the ground with your forearms flat on the floor, elbows directly under your shoulders.","Engage your core and lift your chest off the ground, keeping your forearms and toes on the floor.","Hold this position for a few seconds, making sure to keep your neck in a neutral position.","Slowly lower your chest back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Spider Crawl Push Up","gif":"P9GFBME.gif","primaryMuscles":["glutes"],"secondaryMuscles":["core","chest","shoulders"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Start in a push-up position with your hands slightly wider than shoulder-width apart and your feet together.","Bring your right knee towards your right elbow, keeping it off the ground.","As you bring your right knee back, simultaneously lower your body towards the ground by bending your elbows.","Push back up to the starting position and repeat with your left knee towards your left elbow.","Continue alternating sides for the desired number of repetitions."]},{"name":"Spine Stretch","gif":"JbC2iaV.gif","primaryMuscles":["spine"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"body weight","bodyParts":["back"],"instructions":["Sit on the ground with your legs extended in front of you.","Place your hands on the ground behind you, fingers pointing towards your body.","Engage your core and slowly lean back, keeping your back straight.","Continue leaning back until you feel a stretch in your spine.","Hold the stretch for a few seconds, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Spine Twist","gif":"2jl9K55.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","lower back"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Sit on the ground with your legs extended in front of you.","Bend your knees and place your feet flat on the ground, hip-width apart.","Place your hands behind your head with your elbows pointing outwards.","Engage your abs and slowly twist your torso to the right, bringing your right elbow towards your left knee.","Pause for a moment at the end of the twist, then slowly return to the starting position.","Repeat the twist to the left side, bringing your left elbow towards your right knee.","Continue alternating sides for the desired number of repetitions."]},{"name":"Split Squats","gif":"9E25EOx.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart.","Take a step forward with one foot and place it about two feet in front of the other foot.","Lower your body by bending your knees and hips, keeping your back straight.","Continue lowering until your front thigh is parallel to the ground, and your back knee is hovering just above the ground.","Pause for a moment, then push through your front heel to return to the starting position.","Repeat for the desired number of repetitions, then switch legs and repeat."]},{"name":"Squat Jerk","gif":"IMRsOCn.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Start with the barbell resting on your shoulders, with your feet shoulder-width apart.","Lower your body into a squat position, keeping your chest up and your knees tracking over your toes.","As you reach the bottom of the squat, explosively drive through your legs and push the barbell overhead.","As the barbell reaches its peak, quickly drop into a split position, with one foot forward and one foot back.","Catch the barbell overhead with your arms fully extended and your back knee slightly touching the ground.","Stand up from the split position, bringing your feet back together.","Lower the barbell back to your shoulders and repeat for the desired number of repetitions."]},{"name":"Squat On Bosu Ball","gif":"T2fA5Ir.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"bosu ball","bodyParts":["upper legs"],"instructions":["Place the bosu ball on the ground with the flat side up.","Stand with your feet shoulder-width apart and position yourself on top of the bosu ball.","Lower your body down by bending your knees and hips, as if sitting back into a chair.","Keep your chest up and your weight on your heels.","Lower yourself until your thighs are parallel to the ground.","Pause for a moment, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Squat To Overhead Reach","gif":"QChZi3x.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","core"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and toes slightly turned out.","Lower your body down into a squat position by bending your knees and pushing your hips back.","As you come up from the squat, extend your arms overhead, reaching towards the ceiling.","Return to the starting position by lowering your arms and bending your knees to squat down again.","Repeat for the desired number of repetitions."]},{"name":"Squat To Overhead Reach With Twist","gif":"5BZHW9s.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","core"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and toes slightly turned out.","Lower your body into a squat position by bending your knees and pushing your hips back.","As you come up from the squat, raise your arms overhead and twist your torso to one side.","Return to the starting position and repeat the squat, this time twisting your torso to the opposite side.","Continue alternating sides with each squat repetition."]},{"name":"Stability Ball Crunch (Full Range Hands Behind Head)","gif":"Gn5FwYT.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"stability ball","bodyParts":["waist"],"instructions":["Sit on the stability ball with your feet flat on the ground and your knees bent at a 90-degree angle.","Place your hands behind your head with your elbows pointing outwards.","Engaging your abs, slowly curl your upper body forward, bringing your chest towards your knees.","Pause for a moment at the top, then slowly lower your upper body back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Stalder Press","gif":"zd4P4B2.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders","core"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Start by standing with your feet shoulder-width apart and your arms extended overhead.","Bend your knees slightly and engage your core.","Lower your body down into a squat position while keeping your arms extended overhead.","As you squat down, press your arms down towards the ground, engaging your triceps.","Pause for a moment at the bottom of the squat, then push through your heels to stand back up while simultaneously raising your arms back overhead.","Repeat for the desired number of repetitions."]},{"name":"Standing Archer","gif":"JF8AkMX.gif","primaryMuscles":["upper back"],"secondaryMuscles":["shoulders","biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and your knees slightly bent.","Extend your arms straight out in front of you at shoulder height, parallel to the ground.","Rotate your torso to the right, keeping your arms extended and your back straight.","As you rotate, extend your right arm forward and your left arm back, mimicking the motion of drawing a bowstring.","Hold the position for a moment, then return to the starting position.","Repeat the motion, this time rotating your torso to the left and extending your left arm forward and your right arm back.","Continue alternating sides for the desired number of repetitions."]},{"name":"Standing Behind Neck Press","gif":"xDh0lJr.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"barbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and hold the barbell behind your neck with an overhand grip.","Keep your back straight and core engaged.","Press the barbell overhead by extending your arms, fully extending your elbows.","Pause for a moment at the top, then slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Standing Calf Raise (On A Staircase)","gif":"6HmFgmx.gif","primaryMuscles":["calves"],"secondaryMuscles":["ankles","feet"],"equipment":"body weight","bodyParts":["lower legs"],"instructions":["Stand on the edge of a step or a sturdy platform with your heels hanging off and your toes on the step.","Hold onto a railing or wall for balance if needed.","Slowly raise your heels as high as possible, lifting your body weight onto the balls of your feet.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Standing Calves","gif":"XIHEoCG.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"body weight","bodyParts":["lower legs"],"instructions":["Stand with your feet shoulder-width apart, toes pointing forward.","Raise your heels off the ground as high as possible, standing on your toes.","Hold the position for a moment, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Standing Calves Calf Stretch","gif":"qOKcgVP.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"body weight","bodyParts":["lower legs"],"instructions":["Stand facing a wall or sturdy object, about an arm's length away.","Place your hands on the wall or object at shoulder height.","Step back with one foot, keeping your heel flat on the ground.","Bend your front knee slightly and lean forward, keeping your back leg straight.","You should feel a stretch in your calf muscle.","Hold the stretch for 20-30 seconds.","Repeat on the other leg."]},{"name":"Standing Hamstring And Calf Stretch With Strap","gif":"xTjr103.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["calves"],"equipment":"rope","bodyParts":["upper legs"],"instructions":["Stand upright with your feet shoulder-width apart.","Hold the strap with both hands and place it around the ball of your foot.","Keep your leg straight and slowly lean forward from your hips, keeping your back straight.","Feel the stretch in your hamstring and calf muscles.","Hold the stretch for 20-30 seconds.","Release the stretch and repeat with the other leg.","Repeat for the desired number of repetitions."]},{"name":"Standing Lateral Stretch","gif":"1jXLYEw.gif","primaryMuscles":["lats"],"secondaryMuscles":["shoulders","obliques"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and your knees slightly bent.","Extend your arms straight out to the sides, parallel to the ground.","Slowly lean your upper body to one side, feeling a stretch in your side and lats.","Hold the stretch for 15-30 seconds.","Return to the starting position and repeat on the other side.","Repeat for the desired number of repetitions."]},{"name":"Standing Pelvic Tilt","gif":"cuKYxhu.gif","primaryMuscles":["spine"],"secondaryMuscles":["abdominals"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and your knees slightly bent.","Place your hands on your hips or let them hang by your sides.","Engage your core muscles and tilt your pelvis forward, pushing your lower back towards the wall behind you.","Hold the position for a few seconds, then release and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Standing Single Leg Curl","gif":"C5jncD2.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet hip-width apart and your hands on your hips.","Shift your weight onto your left leg and lift your right foot off the ground, bending your knee.","Slowly curl your right heel towards your glutes, squeezing your hamstring.","Pause for a moment at the top, then slowly lower your right foot back down to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"Standing Wheel Rollerout","gif":"KtRomty.gif","primaryMuscles":["abs"],"secondaryMuscles":["lower back","shoulders"],"equipment":"wheel roller","bodyParts":["waist"],"instructions":["Start by standing tall with your feet shoulder-width apart and the wheel roller in front of you.","Bend at your waist and slowly roll the wheel forward, keeping your back straight and your core engaged.","Continue rolling forward until you feel a stretch in your abs and your body is extended as far as possible.","Pause for a moment, then slowly roll the wheel back towards your body, returning to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Star Jump (Male)","gif":"HtfCpfi.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Stand with your feet shoulder-width apart and your arms by your sides.","Bend your knees slightly and jump up explosively.","As you jump, spread your legs and extend your arms out to the sides, forming a star shape with your body.","Land softly on the balls of your feet with your knees slightly bent.","Repeat for the desired number of repetitions."]},{"name":"Stationary Bike Run","gif":"H1PESYI.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"stationary bike","bodyParts":["cardio"],"instructions":["Adjust the seat height and position to ensure proper alignment.","Place your feet on the pedals and secure them with the straps if available.","Start pedaling at a comfortable pace.","Maintain a steady rhythm and increase the resistance as desired.","Engage your core muscles to maintain stability and proper posture.","Continue pedaling for the desired duration of your workout.","Gradually decrease the resistance and slow down before coming to a complete stop.","Stretch your legs and cool down after the workout."]},{"name":"Stationary Bike Walk","gif":"a8VDgLw.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"leverage machine","bodyParts":["cardio"],"instructions":["Adjust the seat height and position on the stationary bike to ensure proper alignment.","Place your feet on the pedals and secure them with the straps if available.","Start pedaling at a comfortable pace, keeping your back straight and core engaged.","Maintain a steady rhythm and increase the resistance level if desired.","Continue pedaling for the desired duration of your cardio workout.","Cool down by gradually reducing your pace and resistance level.","Stretch your leg muscles after the workout to prevent tightness and promote recovery."]},{"name":"Straddle Maltese","gif":"HfqciZF.gif","primaryMuscles":["abs"],"secondaryMuscles":["shoulders","chest"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Start by hanging from a pair of rings with your arms fully extended and your body in a straight line.","Spread your legs wide apart, forming a straddle position.","Engage your core and slowly lower your body until your arms are parallel to the ground.","Hold this position for a few seconds, then push yourself back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Straddle Planche","gif":"BL3GHeY.gif","primaryMuscles":["abs"],"secondaryMuscles":["shoulders","triceps","chest"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Start in a push-up position with your hands shoulder-width apart and your feet spread wide apart.","Engage your core and slowly shift your weight forward, bringing your shoulders over your hands.","Bend your elbows and lower your body towards the ground, keeping your elbows close to your sides.","Pause for a moment at the bottom, then push through your hands to straighten your arms and lift your body back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Straight Leg Outer Hip Abductor","gif":"mQ1tBXn.gif","primaryMuscles":["abductors"],"secondaryMuscles":["glutes","hamstrings"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Lie on your side with your legs straight and stacked on top of each other.","Place your bottom arm under your head for support.","Engage your core and lift your top leg as high as possible without rotating your hips or leaning backward.","Pause for a moment at the top, then slowly lower your leg back down to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Superman Push-Up","gif":"4GqRrAk.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["core","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands slightly wider than shoulder-width apart and your feet together.","Engage your core and lower your body towards the ground, keeping your elbows close to your sides.","As you lower your body, simultaneously lift your right arm and left leg off the ground, extending them straight out.","Pause for a moment at the top, then lower your arm and leg back down while pushing yourself back up to the starting position.","Repeat the movement, this time lifting your left arm and right leg.","Continue alternating sides for the desired number of repetitions."]},{"name":"Suspended Abdominal Fallout","gif":"X3TCNEU.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Attach a suspension trainer to a high anchor point and adjust the straps to waist height.","Stand facing away from the anchor point and hold the handles with your arms extended in front of you.","Lean forward at the waist, keeping your body straight and your core engaged.","Lower your body as far as you can while maintaining control and tension in your abs.","Pause for a moment at the bottom, then slowly raise your body back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Suspended Push-Up","gif":"IaGQCrC.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders","core"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Find a suspension trainer and adjust it to an appropriate height.","Stand facing away from the anchor point and hold the handles with an overhand grip.","Walk your feet forward, leaning your body forward until your weight is supported by the suspension trainer.","Keep your body straight from head to heels, engage your core, and lower your chest towards the handles.","Push through your chest and arms to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Suspended Reverse Crunch","gif":"R1WYG5D.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Hang from a pull-up bar with your arms fully extended and your palms facing away from you.","Engage your core and lift your knees up towards your chest, curling your pelvis towards your ribcage.","Pause for a moment at the top, then slowly lower your knees back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Suspended Row","gif":"4OaumBr.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","shoulders"],"equipment":"body weight","bodyParts":["back"],"instructions":["Set up a suspension trainer at an appropriate height.","Stand facing the anchor point with your feet shoulder-width apart.","Hold the handles with an overhand grip, palms facing each other.","Lean back, keeping your body straight and your heels on the ground.","Pull your chest towards the handles, squeezing your shoulder blades together.","Pause for a moment at the top, then slowly lower yourself back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Suspended Split Squat","gif":"QpXqiq8.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand facing away from a suspension trainer with your feet shoulder-width apart.","Extend one leg forward and place the top of your foot in the foot cradle of the suspension trainer.","Bend your standing leg and lower your body down into a lunge position, keeping your chest up and your knee in line with your toes.","Push through your heel to return to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"Swimmer Kicks V. 2 (Male)","gif":"SP3hUez.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Lie face down on a mat with your arms extended overhead.","Engage your core and lift your chest and legs off the ground simultaneously.","Kick your legs up and down in a fluttering motion, as if you were swimming.","Continue kicking for the desired number of repetitions.","Lower your chest and legs back down to the starting position."]},{"name":"Swing 360","gif":"tnaj0mT.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["shoulders","core"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Stand with your feet shoulder-width apart and knees slightly bent.","Hold your arms straight out in front of you, parallel to the ground.","Engage your core and swing your arms in a circular motion, rotating your torso as you do so.","Continue the circular motion, swinging your arms and rotating your torso for the desired number of repetitions.","Remember to breathe throughout the exercise."]},{"name":"Three Bench Dip","gif":"DQ0cqkT.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Sit on a bench with your hands gripping the edge, fingers pointing forward.","Slide your butt off the bench, supporting your weight with your hands.","Bend your elbows and lower your body until your upper arms are parallel to the ground.","Push yourself back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Tire Flip","gif":"oZjMu1t.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps","core"],"equipment":"tire","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, facing the tire.","Bend your knees and hinge at the hips, lowering into a squat position.","Reach down and grab the bottom edge of the tire with both hands, fingers facing towards you.","Engage your glutes and leg muscles, and explosively drive through your legs to lift the tire off the ground.","As the tire flips over, use your upper body strength to guide it and maintain control.","Once the tire is fully flipped, quickly step back and reset your stance.","Repeat for the desired number of repetitions."]},{"name":"Trap Bar Deadlift","gif":"jQGwmxN.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps","lower back"],"equipment":"trap bar","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and the trap bar on the ground in front of you.","Bend at the hips and knees to lower yourself down and grip the handles of the trap bar with an overhand grip.","Keep your back straight and chest up as you begin to lift the trap bar off the ground by extending your hips and knees.","As you lift, focus on driving through your heels and squeezing your glutes at the top of the movement.","Lower the trap bar back down to the ground by bending at the hips and knees, keeping your back straight throughout the movement.","Repeat for the desired number of repetitions."]},{"name":"Triceps Dip","gif":"X6C6i5Y.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Sit on the edge of a bench or chair with your hands gripping the edge, fingers pointing forward.","Slide your butt off the bench, supporting your weight with your hands.","Bend your elbows and lower your body towards the ground, keeping your back close to the bench.","Pause for a moment at the bottom, then push yourself back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Triceps Dip (Bench Leg)","gif":"VuoerH0.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Sit on the edge of a bench with your hands gripping the edge, fingers pointing forward.","Walk your feet forward, sliding your butt off the bench, and straighten your arms.","Bend your elbows and lower your body towards the ground, keeping your back close to the bench.","Push through your palms to straighten your arms and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Triceps Dip (Between Benches)","gif":"Wgbn9qo.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Sit on a bench with your hands gripping the edge of the bench, fingers pointing forward.","Slide your butt off the bench, supporting your weight with your hands.","Bend your elbows and lower your body towards the ground, keeping your back close to the bench.","Pause for a moment at the bottom, then push yourself back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Triceps Dips Floor","gif":"7aVz15j.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Sit on the edge of a chair or bench with your hands next to your hips, fingers pointing forward.","Slide your butt off the front of the chair with your legs extended in front of you.","Straighten your arms, keeping a little bend in your elbows to keep tension on your triceps and off your elbow joints.","Slowly bend your elbows to lower your body toward the floor until your elbows are at about a 90-degree angle.","Once you reach the bottom of the movement, press down into the chair to straighten your elbows, returning to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Triceps Press","gif":"fSrPP6B.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and your knees slightly bent.","Extend your arms straight out in front of you, parallel to the ground.","Bend your elbows and lower your body towards the ground, keeping your upper arms close to your sides.","Pause for a moment at the bottom, then push yourself back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Triceps Stretch","gif":"uOV3Itw.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Stand or sit upright with your back straight.","Extend one arm overhead, bending it at the elbow.","Place your opposite hand on the bent elbow and gently pull it towards your head.","Hold the stretch for 15-30 seconds, feeling a gentle stretch in your triceps.","Release the stretch and repeat on the other arm."]},{"name":"Tuck C starting position and repeat the twist to the left side.","Continue alternating twists for the desired number of repetitions."]},{"name":"Twisted Leg Raise","gif":"C0eCeEt.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your legs extended and your arms by your sides.","Place your hands under your glutes for support.","Engage your abs and lift both legs off the ground, keeping them straight.","As you lift your legs, twist your hips to one side, bringing your legs towards your opposite shoulder.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat the movement, this time twisting your hips to the other side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Twisted Leg Raise (Female)","gif":"yT9tk17.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your legs extended and your arms by your sides.","Bend your knees and lift your legs off the ground, bringing them towards your chest.","As you lift your legs, twist your hips to one side, bringing your knees towards your opposite shoulder.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat the movement, this time twisting your hips to the other side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Two Toe Touch (Male)","gif":"p195zsJ.gif","primaryMuscles":["spine"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and your arms extended out to the sides.","Bend forward at the waist, keeping your back straight and your knees slightly bent.","Reach down towards your toes with both hands, keeping your legs straight.","Pause for a moment at the bottom, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Upper Back Stretch","gif":"GSDioYu.gif","primaryMuscles":["upper back"],"secondaryMuscles":["shoulders"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand up straight with your feet shoulder-width apart.","Extend your arms straight in front of you, parallel to the ground.","Interlace your fingers and rotate your palms away from your body.","Slowly raise your arms overhead, keeping them straight and parallel to each other.","As you raise your arms, squeeze your shoulder blades together.","Hold the stretch for 15-30 seconds, then release and repeat."]},{"name":"Upward Facing Dog","gif":"01qpYSe.gif","primaryMuscles":["spine"],"secondaryMuscles":["shoulders","chest"],"equipment":"body weight","bodyParts":["back"],"instructions":["Lie face down on the floor with your legs extended behind you.","Place your hands on the floor next to your lower ribs, fingers pointing forward.","Press your hands firmly into the floor and straighten your arms, lifting your torso and thighs off the ground.","Roll your shoulders back and down, opening your chest and lifting your gaze towards the ceiling.","Hold this position for a few breaths, then slowly lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Vertical Leg Raise (On Parallel Bars)","gif":"ZNgOYQU.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Hang from the parallel bars with your arms fully extended and your body straight.","Engage your core and lift your legs up in front of you, keeping them straight.","Continue lifting until your legs are parallel to the ground or slightly higher.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"V-Sit On Floor","gif":"ZuXu4Eq.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Sit on the floor with your legs extended in front of you.","Lean back slightly and lift your legs off the ground, keeping them straight.","Simultaneously, lift your upper body off the ground and reach your arms towards your legs.","Hold this position for a few seconds, then slowly lower your upper body and legs back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Walk Elliptical Cross Trainer","gif":"rjtuP6X.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","glutes","calves"],"equipment":"elliptical machine","bodyParts":["cardio"],"instructions":["Adjust the resistance level and incline of the elliptical machine to your desired settings.","Step onto the pedals of the machine and grip the handles lightly.","Begin by pushing down with your feet and pulling the handles towards your body.","Continue this motion, alternating between pushing and pulling, to simulate a walking or running motion.","Maintain a steady pace and keep your core engaged throughout the exercise.","Continue for the desired duration of your cardio workout.","Gradually decrease the intensity and speed of the machine before stepping off."]},{"name":"Walking High Knees Lunge","gif":"J9zIWig.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","glutes","calves"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Stand with your feet hip-width apart.","Lift your right knee up towards your chest as high as you can while balancing on your left leg.","Step forward with your right foot and lower your body into a lunge position, bending both knees to a 90-degree angle.","Push off with your right foot and bring your left knee up towards your chest.","Step forward with your left foot and lower your body into a lunge position.","Continue alternating legs and lunging forward, keeping your core engaged and maintaining a steady pace.","Repeat for the desired number of repetitions."]},{"name":"Walking Lunge","gif":"IZVHb27.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart.","Take a step forward with your right leg, lowering your body into a lunge position.","Keep your torso upright and your front knee aligned with your ankle.","Push off with your right foot and bring your left foot forward, stepping into a lunge position with your left leg.","Continue alternating legs and walking forward, maintaining a controlled and steady pace.","Repeat for the desired number of repetitions."]},{"name":"Walking On Incline Treadmill","gif":"rjiM4L3.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"leverage machine","bodyParts":["cardio"],"instructions":["Adjust the incline level on the treadmill to your desired intensity.","Stand on the treadmill with your feet shoulder-width apart.","Start walking at a comfortable pace, ensuring that you maintain proper form.","Engage your core muscles and keep your back straight throughout the exercise.","Continue walking on the incline treadmill for the desired duration of your cardio workout.","Gradually decrease the incline and speed of the treadmill to cool down before stopping."]},{"name":"Walking On Stepmill","gif":"j9Q5crt.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","glutes","calves"],"equipment":"stepmill machine","bodyParts":["cardio"],"instructions":["Adjust the stepmill machine to a comfortable level.","Step onto the machine and place your hands on the handrails for support.","Start walking by placing one foot on a step and then the other, alternating between legs.","Maintain an upright posture and engage your core muscles.","Continue walking for the desired duration or distance.","Gradually increase the intensity or speed as you become more comfortable with the exercise.","Remember to cool down and stretch after completing the exercise."]},{"name":"Weighted Bench Dip","gif":"MU9HnE7.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"weighted","bodyParts":["upper arms"],"instructions":["Sit on a bench with your hands gripping the edge, fingers pointing forward.","Slide your butt off the bench, supporting your weight with your hands.","Lower your body by bending your elbows until your upper arms are parallel to the floor.","Push yourself back up to the starting position by straightening your arms.","Repeat for the desired number of repetitions."]},{"name":"Weighted Close Grip Chin-Up On Dip Cage","gif":"Gk1r408.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"weighted","bodyParts":["back"],"instructions":["Stand in front of the dip cage and grab the parallel bars with an underhand grip, hands shoulder-width apart.","Hang from the bars with your arms fully extended, feet off the ground, and body straight.","Engage your back muscles and pull your body up towards the bars, keeping your elbows close to your sides.","Continue pulling until your chin is above the bars, then pause for a moment.","Slowly lower your body back down to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Weighted Cossack Squats (Male)","gif":"GWoKnIm.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"weighted","bodyParts":["upper legs"],"instructions":["Stand with your feet wider than shoulder-width apart and toes pointing slightly outward.","Hold a weight in front of your chest with both hands.","Shift your weight to one side and lower your body by bending the knee of the side you shifted towards, while keeping the other leg straight.","Go as low as you can while maintaining balance and keeping your chest up.","Push through the heel of the bent leg to return to the starting position.","Repeat on the other side, alternating between legs."]},{"name":"Weighted Crunch","gif":"s8nrDXF.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"weighted","bodyParts":["waist"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Hold a weight plate or dumbbell on your chest.","Engage your abs and lift your upper body off the ground, curling forward until your shoulder blades are off the ground.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Decline Sit-Up","gif":"EZeDVzO.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors","lower back"],"equipment":"weighted","bodyParts":["waist"],"instructions":["Lie flat on a decline bench with your feet secured under the foot pads.","Place your hands behind your head or across your chest.","Engage your abs and slowly lift your upper body off the bench, curling forward until your torso is perpendicular to the ground.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Donkey Calf Raise","gif":"LmaFNZS.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"weighted","bodyParts":["lower legs"],"instructions":["Stand on a raised platform with your toes on the edge and your heels hanging off.","Hold onto a stable object for support.","Raise your heels as high as possible by extending your ankles.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Drop Push Up","gif":"PSlvNMs.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"weighted","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands slightly wider than shoulder-width apart and your feet together.","Lower your chest towards the ground, keeping your elbows close to your body.","Once your chest is just above the ground, explosively push yourself up, lifting your hands off the ground.","As you push up, quickly move your hands out to the sides and slightly forward, allowing your body to drop down towards the ground.","Catch yourself with your hands in the wider position and immediately lower your chest towards the ground again.","Repeat the push-up motion, dropping down and catching yourself with your hands in the narrower position.","Continue alternating between the wider and narrower hand positions for the desired number of repetitions."]},{"name":"Weighted Front Plank","gif":"VBAWRPG.gif","primaryMuscles":["abs"],"secondaryMuscles":["shoulders","lower back"],"equipment":"weighted","bodyParts":["waist"],"instructions":["Start by lying face down on the floor.","Place your forearms on the ground, with your elbows directly under your shoulders.","Extend your legs straight out behind you, with your toes on the ground.","Engage your core and lift your body off the ground, balancing on your forearms and toes.","Keep your body in a straight line from your head to your heels.","Hold this position for the desired amount of time.","Lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Front Raise","gif":"e4aFmFY.gif","primaryMuscles":["delts"],"secondaryMuscles":["biceps","forearms"],"equipment":"weighted","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing your thighs.","Keeping your arms straight, exhale and lift the dumbbells in front of you until they are at shoulder level.","Pa :"Weighted Lunge With Swing","gif":"5WiFcYk.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"weighted","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a weight in each hand.","Take a step forward with your right foot, lowering your body into a lunge position.","As you lunge forward, swing the weights forward and upward, keeping your arms straight.","Push off with your right foot and return to the starting position, swinging the weights back down.","Repeat with your left foot and continue alternating legs for the desired number of repetitions."]},{"name":"Weighted Muscle Up","gif":"JsOV1SU.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","triceps","shoulders","chest"],"equipment":"weighted","bodyParts":["back"],"instructions":["Start by hanging from a pull-up bar with your palms facing away from you and your hands slightly wider than shoulder-width apart.","Engage your core and pull your body up towards the bar, leading with your chest.","As you reach the top of the movement, transition your grip so that your palms are facing towards you.","Continue pulling yourself up until your chest reaches the bar, then pause for a moment.","Slowly lower yourself back down to the starting position, maintaining control throughout the movement.","Repeat for the desired number of repetitions."]},{"name":"Weighted Muscle Up (On Bar)","gif":"MCkqdKE.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","triceps","shoulders","forearms"],"equipment":"weighted","bodyParts":["back"],"instructions":["Start by hanging from a pull-up bar with your palms facing away from you and your hands slightly wider than shoulder-width apart.","Engage your core and pull your shoulder blades down and back.","Bend your elbows and pull your chest towards the bar, keeping your body straight.","Once your chest reaches the bar, push down with your hands and drive your elbows back, lifting your body above the bar.","Pause at the top of the movement, then slowly lower yourself back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted One Hand Pull Up","gif":"fXfqg1E.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"weighted","bodyParts":["back"],"instructions":["Grab the pull-up bar with an overhand grip, slightly wider than shoulder-width apart.","Hang from the bar with your arm fully extended and your body straight.","Engage your core and pull your body up towards the bar by bending your elbow and squeezing your back muscles.","Continue pulling until your chin is above the bar.","Lower your body back down to the starting position with control.","Repeat for the desired number of repetitions."]},{"name":"Weighted Overhead Crunch (On Stability Ball)","gif":"xmM75XG.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","lower back"],"equipment":"weighted","bodyParts":["waist"],"instructions":["Sit on a stability ball with your feet flat on the ground and your knees bent at a 90-degree angle.","Hold a weight plate or dumbbell with both hands and extend your arms overhead.","Engage your abs and slowly curl your torso forward, bringing your chest towards your knees.","Pause for a moment at the top, then slowly lower your torso back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Pull-Up","gif":"HMzLjXx.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"weighted","bodyParts":["back"],"instructions":["Grab the pull-up bar with an overhand grip, slightly wider than shoulder-width apart.","Hang from the bar with your arms fully extended and your body straight.","Engage your back muscles and pull your body up towards the bar, keeping your elbows close to your body.","Continue pulling until your chin is above the bar.","Pause for a moment at the top, then slowly lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Round Arm","gif":"VLYXo8S.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"weighted","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand.","Bend your knees slightly and hinge forward at the hips, keeping your back straight.","Raise your arms out to the sides, keeping a slight bend in your elbows.","Continue lifting your arms until they are parallel to the ground.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Russian Twist","gif":"fZFZ704.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","lower back"],"equipment":"weighted","bodyParts":["waist"],"instructions":["Sit on the ground with your knees bent and your feet flat on the floor.","Hold a weight or medicine ball with both hands in front of your chest.","Lean back slightly, keeping your back straight and your core engaged.","Slowly twist your torso to the right, bringing the weight or medicine ball towards the floor on your right side.","Pause for a moment, then twist your torso to the left, bringing the weight or medicine ball towards the floor on your left side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Weighted Russian Twist (Legs Up)","gif":"WU9BLIs.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","hip flexors"],"equipment":"weighted","bodyParts":["waist"],"instructions":["Sit on the ground with your knees bent and feet lifted off the ground, keeping your legs together.","Hold the weight with both hands in front of your chest, keeping your elbows slightly bent.","Lean back slightly to engage your core muscles.","Twist your torso to the right, bringing the weight towards the ground on your right side.","Pause for a moment, then twist your torso to the left, bringing the weight towards the ground on your left side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Weighted Russian Twist V. 2","gif":"YIUAtYf.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","lower back"],"equipment":"weighted","bodyParts":["waist"],"instructions":["Sit on the ground with your knees bent and feet flat on the floor.","Hold the weight with both hands in front of your chest.","Lean back slightly to engage your core muscles.","Twist your torso to the right, bringing the weight towards the right side of your body.","Pause for a moment, then twist your torso to the left, bringing the weight towards the left side of your body.","Continue alternating sides for the desired number of repetitions."]},{"name":"Weighted Seated Bicep Curl (On Stability Ball)","gif":"b4b6afT.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"medicine ball","bodyParts":["upper arms"],"instructions":["Sit on a stability ball with your feet flat on the ground and your back straight.","Hold a medicine ball with an underhand grip, palms facing up, and let your arms hang down by your sides.","Keeping your upper arms stationary, exhale and curl the medicine ball up towards your shoulders.","Pause for a moment at the top, squeezing your biceps.","Inhale and slowly lower the medicine ball back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Seated Twist (On Stability Ball)","gif":"s34Y4LR.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","lower back"],"equipment":"weighted","bodyParts":["waist"],"instructions":["Sit on a stability ball with your feet flat on the ground and your knees bent at a 90-degree angle.","Hold a weight plate or dumbbell with both hands close to your chest.","Engage your core and slowly rotate your torso to one side, keeping your hips stable.","Pause for a moment at the end of the rotation, then slowly return to the star
