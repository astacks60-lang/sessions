"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your legs extended and your arms by your sides.","Place your hands under your glutes for support.","Engage your core and lift your legs off the ground, raising them towards the ceiling.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Machine Inner Chest Press","gif":"wDN97Ca.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"leverage machine","bodyParts":["chest"],"instructions":["Adjust the seat height and position yourself on the machine with your back flat against the pad.","Grasp the handles with an overhand grip and position your elbows at a 90-degree angle.","Push the handles forward until your arms are fully extended, exhaling during the movement.","Pause for a moment at the end of the movement, then slowly return to the starting position, inhaling as you do so.","Repeat for the desired number of repetitions."]},{"name":"March Sit (Wall)","gif":"sVQCCeG.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your back against a wall and your feet hip-width apart.","Slowly slide your back down the wall until your knees are bent at a 90-degree angle.","Lift your right foot off the ground and bring your knee towards your chest.","Lower your right foot back down and lift your left foot off the ground, bringing your knee towards your chest.","Continue alternating between lifting your right and left foot for the desired number of repetitions."]},{"name":"Medicine Ball Catch And Overhead Throw","gif":"PsVS1QP.gif","primaryMuscles":["lats"],"secondaryMuscles":["shoulders","core"],"equipment":"medicine ball","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart, holding a medicine ball in both hands at chest level.","Bend your knees slightly and engage your core.","Lower your body into a squat position, keeping your back straight and chest up.","Explosively extend your hips and legs, while simultaneously throwing the medicine ball overhead.","Release the ball at the top of the movement and catch it on the way down.","Lower your body back into the squat position and repeat for the desired number of repetitions."]},{"name":"Medicine Ball Chest Pass","gif":"aDoFKrE.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"medicine ball","bodyParts":["chest"],"instructions":["Stand with your feet shoulder-width apart, holding the medicine ball at chest level.","Extend your arms forward, pushing the medicine ball away from your chest with force.","As you release the ball, follow through with your arms and torso, transferring your weight from your back foot to your front foot.","Catch the ball as it rebounds off the wall or partner, and immediately repeat the movement.","Continue for the desired number of repetitions."]},{"name":"Medicine Ball Chest Push From 3 Point Stance","gif":"dCJnuVq.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"medicine ball","bodyParts":["chest"],"instructions":["Start in a 3 point stance with one hand on the medicine ball and the other hand on the ground.","Extend your legs and position your body in a straight line.","Lower your chest towards the ground while keeping your back straight.","Push the medicine ball away from your body, extending your arm fully.","Return to the starting position and repeat for the desired number of repetitions."]},{"name":"Medicine Ball Chest Push Multiple Response","gif":"7aolH9D.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"medicine ball","bodyParts":["chest"],"instructions":["Stand with your feet shoulder-width apart, holding a medicine ball at chest level.","Extend your arms forward, pushing the medicine ball away from your chest.","Pause for a moment, then slowly bring the medicine ball back to your chest.","Repeat for the desired number of repetitions."]},{"name":"Medicine Ball Chest Push Single Response","gif":"jeHtrlO.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"medicine ball","bodyParts":["chest"],"instructions":["Stand with your feet shoulder-width apart, holding the medicine ball at chest level.","Extend your arms forward, pushing the medicine ball away from your chest.","Pause for a moment, then slowly bring the medicine ball back to your chest.","Repeat for the desired number of repetitions."]},{"name":"Medicine Ball Chest Push With Run Release","gif":"pX9Elbe.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders","core"],"equipment":"medicine ball","bodyParts":["chest"],"instructions":["Stand with your feet shoulder-width apart, holding a medicine ball at chest level.","Step forward with your right foot and simultaneously push the medicine ball forward, extending your arms fully.","As you push the ball forward, release it and let it roll forward.","Quickly run forward and catch the ball before it hits the ground.","Once you catch the ball, bring it back to your chest and repeat the movement with your left foot forward.","Continue alternating legs and repeating the exercise for the desired number of repetitions."]},{"name":"Medicine Ball Close Grip Push Up","gif":"8K7m2SS.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"medicine ball","bodyParts":["upper arms"],"instructions":["Start in a high plank position with your hands on the medicine ball, shoulder-width apart.","Lower your body towards the ground by bending your elbows, keeping them close to your sides.","Push back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Medicine Ball Overhead Slam","gif":"oHg8eop.gif","primaryMuscles":["upper back"],"secondaryMuscles":["shoulders","core"],"equipment":"medicine ball","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart, holding a medicine ball with both hands above your head.","Engage your core and keep your back straight.","Bend your knees slightly and forcefully slam the medicine ball down to the ground in front of you.","As you slam the ball down, use your entire body to generate power, including your shoulders and core.","Catch the ball on the bounce and repeat for the desired number of repetitions."]},{"name":"Medicine Ball Supine Chest Throw","gif":"Al3tP0D.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"medicine ball","bodyParts":["upper arms"],"instructions":["Lie flat on your back on a bench with your knees bent and feet flat on the ground.","Hold the medicine ball with both hands, extending your arms straight up above your chest.","Lower the medicine ball towards your chest, keeping your elbows close to your body.","Explosively push the medicine ball upwards, extending your arms fully and throwing the ball as high as possible.","Catch the medicine ball and repeat for the desired number of repetitions."]},{"name":"Mixed Grip Chin-Up","gif":"T8UpLkb.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Grab the pull-up bar with an underhand grip (palms facing towards you) and your hands slightly wider than shoulder-width apart.","Hang from the bar with your arms fully extended and your feet off the ground.","Engage your back muscles and pull your body up towards the bar, leading with your chest.","Continue pulling until your chin is above the bar.","Pause for a moment at the top, then slowly lower your body back down to the starting position with control.","Repeat for the desired number of repetitions."]},{"name":"Modified Hindu Push-Up (Male)","gif":"epOSYUZ.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders","core"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a push-up position with your hands slightly wider than shoulder-width apart and your feet hip-width apart.","Lower your body towards the ground, bending your elbows and keeping your core engaged.","As you lower your body, shift your weight back and lift your hips up towards the ceiling, creating an inverted V shape with your body.","Continue to lower your body until your chest is just above the ground, then reverse the movement, pushing your hips back down and extending your arms to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Modified Push Up To Lower Arms","gif":"arvaszz.gif","primaryMuscles":["forearms"],"secondaryMuscles":["triceps","chest","shoulders"],"equipment":"body weight","bodyParts":["lower arms"],"instructions":["Start in a push-up position with your hands directly under your shoulders and your body in a straight line.","Lower your body down towards the ground by bending your elbows, keeping them close to your sides.","Once your elbows are at a 90-degree angle, lower your forearms to the ground, keeping your elbows directly under your shoulders.","Pause for a moment, then push through your palms to lift your forearms back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Monster Walk","gif":"O95afRA.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Place a resistance band around your ankles.","Stand with your feet shoulder-width apart and slightly bend your knees.","Take a step to the side with your right foot, maintaining tension on the resistance band.","Follow with your left foot, stepping to the side to return to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Mountain Climber","gif":"RJgzwny.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["core","shoulders","triceps"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Start in a high plank position with your hands directly under your shoulders and your body in a straight line.","Engage your core and bring your right knee towards your chest, then quickly switch and bring your left knee towards your chest.","Continue alternating legs in a running motion, keeping your hips low and your core engaged.","Maintain a steady pace and breathe evenly throughout the exercise.","Repeat for the desired number of repetitions."]},{"name":"Muscle Up","gif":"yJUHKTn.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","triceps","shoulders","chest"],"equipment":"body weight","bodyParts":["back"],"instructions":["Start by hanging from a pull-up bar with your palms facing away from you and your arms fully extended.","Engage your core and pull your body up towards the bar, leading with your chest.","As you reach the top of the movement, transition your grip so that your palms are facing towards you.","Continue pulling yourself up until your chest is above the bar and your arms are fully flexed.","Reverse the movement by slowly lowering yourself back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Muscle-Up (On Vertical Bar)","gif":"Af0EW2I.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","triceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Start by hanging from a vertical bar with your palms facing away from you and your arms fully extended.","Engage your core and pull your body up towards the bar, leading with your chest.","As you pull yourself up, lean back slightly and bring your elbows towards your sides.","Continue pulling until your chest reaches the bar and your elbows are fully bent.","Pause for a moment at the top, then slowly lower yourself back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Narrow Push-Up On Exercise Ball","gif":"4cWjYEN.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"stability ball","bodyParts":["upper arms"],"instructions":["Place the stability ball on the ground and position yourself in a push-up position with your hands on the ball, slightly narrower than shoulder-width apart.","Engage your core and keep your body in a straight line from head to toe.","Lower your chest towards the ball by bending your elbows, keeping them close to your body.","Pause for a moment at the bottom, then push yourself back up to the starting position by straightening your arms.","Repeat for the desired number of repetitions."]},{"name":"Neck Side Stretch","gif":"x2chWLO.gif","primaryMuscles":["levator scapulae"],"secondaryMuscles":["trapezius","sternocleidomastoid"],"equipment":"body weight","bodyParts":["neck"],"instructions":["Stand or sit up straight with your shoulders relaxed.","Tilt your head to one side, bringing your ear towards your shoulder.","Hold the stretch for 15-30 seconds.","Repeat on the other side.","Perform 2-4 sets on each side."]},{"name":"Negative Crunch","gif":"szIn2UK.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Place your hands behind your head with your elbows pointing outwards.","Engaging your abs, slowly lift your upper body off the ground, curling forward until your torso is at a 45-degree angle.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Oblique Crunch V. 2","gif":"cJgSTmh.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie on your back with your knees bent and feet flat on the ground.","Place your hands behind your head or cross them over your chest.","Engage your abs and lift your shoulder blades off the ground, rotating your torso to one side.","Pause for a moment, then lower your shoulder blades back down to the starting position.","Repeat on the other side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Oblique Crunches Floor","gif":"QUDd8WS.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie on your back with your knees bent and feet flat on the floor.","Place your hands behind your head or cross them over your chest.","Engage your abs and lift your shoulder blades off the floor, rotating your torso to one side.","Pause for a moment, then lower your shoulder blades back down to the floor.","Repeat on the other side, alternating sides with each repetition."]},{"name":"Olympic Barbell Hammer Curl","gif":"o1ntciW.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"olympic barbell","bodyParts":["upper arms"],"instructions":["Stand up straight with your feet shoulder-width apart and hold an Olympic barbell with an overhand grip.","Let the barbell hang at arm's length in front of your thighs, with your palms facing your body.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the barbell until your biceps are fully contracted and the barbell is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the barbell back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Olympic Barbell Triceps Extension","gif":"wu5LXwz.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"olympic barbell","bodyParts":["upper arms"],"instructions":["Start by standing with your feet shoulder-width apart and holding the barbell with an overhand grip.","Raise the barbell above your head, fully extending your arms.","Keeping your upper arms close to your head, slowly lower the barbell behind your head by bending your elbows.","Pause for a moment, then extend your arms back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"One Arm Against Wall","gif":"ZZTGMKh.gif","primaryMuscles":["lats"],"secondaryMuscles":["shoulders","triceps"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand facing a wall with your feet shoulder-width apart.","Extend one arm straight out in front of you and place your palm against the wall.","Engage your core and lean your body forward, keeping your arm straight and your back flat.","Slowly push against the wall with your palm, activating your lat muscles.","Hold the position for a few seconds, then release and repeat with the other arm."]},{"name":"One Arm Chin-Up","gif":"HjdqmZa.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand facing a pull-up bar with your feet shoulder-width apart.","Reach up and grab the bar with an underhand grip, with one hand gripping the bar and the other hand holding your wrist for support.","Hang from the bar with your arm fully extended, keeping your body straight and your core engaged.","Pull yourself up towards the bar by bending your elbow and squeezing your back muscles.","Continue pulling until your chin is above the bar, then slowly lower yourself back down to the starting position.","Repeat for the desired number of repetitions, then switch arms and repeat."]},{"name":"One Arm Dip","gif":"FAoIFMw.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Stand facing away from a bench or chair, with your feet shoulder-width apart.","Place one hand t, toes pointing forward.","Place your hands on a stable surface for support, such as a wall or a bar.","Lift one leg off the ground, keeping your knee slightly bent.","Raise your heel as high as possible, using your calf muscles.","Pause for a moment at the top, then slowly lower your heel back down.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"One Leg Floor Calf Raise","gif":"0jp9Rlz.gif","primaryMuscles":["calves"],"secondaryMuscles":["ankles","feet"],"equipment":"body weight","bodyParts":["lower legs"],"instructions":["Stand with your feet hip-width apart and place your hands on a wall or sturdy object for balance.","Lift one foot off the ground and balance on the other foot.","Slowly raise your heel off the ground, lifting your body up onto the ball of your foot.","Pause for a moment at the top, then slowly lower your heel back down to the starting position.","Repeat for the desired number of repetitions, then switch legs and repeat."]},{"name":"One Leg Squat","gif":"C31LMnP.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart.","Extend one leg forward, keeping it off the ground.","Bend your standing leg and lower your body down as if sitting back into a chair.","Keep your chest up and your back straight.","Push through your heel to return to the starting position.","Repeat with the other leg."]},{"name":"Otis Up","gif":"UVL20oz.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors","lower back"],"equipment":"weighted","bodyParts":["waist"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Place your hands behind your head with your elbows pointing outwards.","Engaging your abs, slowly lift your upper body off the ground, curling forward until your torso is at a 45-degree angle.","Pause for a moment at the top, then slowly lower your scles":["glutes"],"secondaryMuscles":["hamstrings","core"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Lie on your back with your knees bent and feet flat on the ground.","Place your arms by your sides with your palms facing down.","Engage your glutes and core muscles.","Tilt your pelvis upward, lifting your hips off the ground.","Hold the bridge position for a few seconds.","Slowly lower your hips back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Peroneals Stretch","gif":"XhfS1DZ.gif","primaryMuscles":["calves"],"secondaryMuscles":["ankles","feet"],"equipment":"rope","bodyParts":["lower legs"],"instructions":["Sit on the ground with your legs extended in front of you.","Loop the rope around the ball of your foot and hold the ends of the rope with your hands.","Gently pull the rope towards you, flexing your foot and stretching your calf muscles.","Hold the stretch for 15-30 seconds.","Release the tension on the rope and repeat the stretch on the other leg.","Repeat for the desired number of repetitions."]},{"name":"Pike-To-Cobra Push-Up","gif":"XPUDTt7.gif","primaryMuscles":["glutes"],"secondaryMuscles":["core","shoulders","triceps"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Start in a push-up position with your hands slightly wider than shoulder-width apart and your feet together.","Engage your core and lift your hips up towards the ceiling, forming an inverted V shape with your body.","Lower your upper body towards the ground by bending your elbows, keeping them close to your body.","As you lower down, shift your weight forward and transition into a cobra pose by straightening your arms and lifting your chest up.","Reverse the movement by bending your elbows and lowering your chest back down towards the ground.","Push through your hands to return to the inverted V position.","Continue the movement by lowering your hips back down towards the ground, returning to the he rope and relax your foot.","Repeat the stretch on the other leg."]},{"name":"Potty Squat","gif":"75Bgtjy.gif","primaryMuscles":["abs"],"secondaryMuscles":["quadriceps","glutes"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Stand with your feet shoulder-width apart, toes pointing slightly outward.","Lower your body down by bending your knees and pushing your hips back as if you were sitting on a chair.","Keep your chest up and your back straight throughout the movement.","Lower yourself until your thighs are parallel to the ground or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Potty Squat With Support","gif":"b63ZzGe.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, toes pointing slightly outward.","Hold onto a stable support, such as a chair or wall, for balance.","Lower your body down into a squat position by bending your knees and pushing your hips back.","Keep your chest up and your back straight throughout the movement.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Power Clean","gif":"SiWCcTN.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","quadriceps","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Start with the barbell on the ground in front of you, with your feet shoulder-width apart.","Bend down and grip the barbell with an overhand grip, slightly wider than shoulder-width apart.","Keep your back straight and chest up as you lift the barbell off the ground, extending your hips and knees.","As the barbell reaches your mid-thigh, explosively pull it upwards, shrugging your shoulder als"],"secondaryMuscles":["triceps","shoulders","core"],"equipment":"bosu ball","bodyParts":["chest"],"instructions":["Place the bosu ball on the ground with the flat side facing up.","Position yourself in a push-up position with your hands on the outer edges of the bosu ball.","Engage your core and lower your body down towards the bosu ball by bending your elbows.","Push yourself back up to the starting position by extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Push-Up","gif":"I4hDWkc.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","deltoids","core"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands slightly wider than shoulder-width apart and your feet together.","Engage your core and lower your body towards the ground by bending your elbows, keeping your body in a straight line.","Pause for a moment when your chest is just above the ground, then push yourself back up to the starting position by straightening your arms.","Repeat for the desired number of repetitions."]},{"name":"Push-Up (Bosu Ball)","gif":"2kr2lWy.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders","core"],"equipment":"bosu ball","bodyParts":["chest"],"instructions":["Place the bosu ball on the ground with the flat side facing up.","Position yourself in a push-up position with your hands on the outer edges of the bosu ball.","Engage your core and lower your body down towards the bosu ball by bending your elbows.","Push yourself back up to the starting position by extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Push-Up (On Stability Ball)","gif":"Y4BRNQF.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders","core"],"equipment":"stability ball","bodyParts":["chest"],"instructions":["Place the stability ball on the ground and position yourself facing down with your hands on the ball, shoulder-width apart.", st"],"instructions":["Start in a plank position with your forearms on the roller and your body in a straight line.","Engage your core and slowly roll the roller forward, extending your body as far as you can while maintaining control.","Pause for a moment at the furthest point, then slowly roll the roller back towards your starting position.","Repeat for the desired number of repetitions."]},{"name":"Roller Hip Lat Stretch","gif":"0L2KwtI.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps"],"equipment":"roller","bodyParts":["upper legs"],"instructions":["Start by kneeling on the ground with the roller positioned under your hips.","Place your hands on the roller for support.","Slowly roll the roller forward, extending your hips and stretching your glutes.","Hold the stretch for a few seconds, then roll back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Roller Hip Stretch","gif":"oMypNrz.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps"],"equipment":"roller","bodyParts":["upper legs"],"instructions":["Start by sitting on the ground with your legs extended in front of you.","Place the roller under your glutes, just above your knees.","Lean back and place your hands on the ground behind you for support.","Engage your glutes and slowly roll the roller forward, bending your knees and bringing them towards your chest.","Pause for a moment at the end of the movement, feeling a stretch in your glutes.","Slowly roll the roller back to the starting position, extending your legs.","Repeat for the desired number of repetitions."]},{"name":"Roller Reverse Crunch","gif":"SKXQAx3.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"roller","bodyParts":["waist"],"instructions":["Lie flat on your back with your arms extended straight above your head and your legs straight out in front of you.","Place the roller between your feet and grip it with your toes.","Engagi eling a stretch in your lats.","Hold the stretch for a few seconds, then slowly roll the roller back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Rope Climb","gif":"yaAxcQr.gif","primaryMuscles":["upper back"],"secondaryMuscles":["forearms","biceps","shoulders"],"equipment":"rope","bodyParts":["back"],"instructions":["Stand facing the rope with your feet shoulder-width apart.","Grab the rope with both hands, palms facing towards you.","Bend your knees slightly and engage your core.","Begin pulling yourself up the rope by alternating hand-over-hand movements.","Use your legs to assist in the upward movement.","Continue climbing until you reach the desired height or the top of the rope.","To descend, reverse the hand-over-hand movement while controlling your descent.","Repeat for the desired number of repetitions."]},{"name":"Run","gif":"oLrKqDH.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Start by standing upright with your feet hip-width apart.","Engage your core and keep your upper body relaxed.","Begin jogging in place, lifting your knees up towards your chest and landing softly on the balls of your feet.","Maintain a steady pace and continue jogging for the desired duration or distance.","Remember to breathe deeply and maintain good posture throughout the exercise."]},{"name":"Run (Equipment)","gif":"y5p0H8a.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Start by standing upright with your feet hip-width apart.","Engage your core and keep your upper body relaxed.","Begin jogging in place, lifting your knees up towards your chest and landing softly on the balls of your feet.","Maintain a steady pace and continue jogging for the desired duration or distance.","Remember to breathe deeply and maintain good posture throughout the exercise."]},{"name":"Runners Stretch","gif":"0mB6wHO.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["calves","quadriceps"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet hip-width apart.","Take a step forward with your right foot, keeping your left foot planted.","Bend your right knee and lower your body down, keeping your left leg straight.","Place your hands on your right thigh for support.","Hold the stretch for 20-30 seconds, then switch sides and repeat."]},{"name":"Russian Twist","gif":"XVDdcoj.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Sit on the ground with your knees bent and feet flat on the floor.","Lean back slightly while keeping your back straight and your core engaged.","Hold your hands together in front of your chest or hold a weight if desired.","Lift your feet off the ground, balancing on your sit bones.","Twist your torso to the right, bringing your hands or weight towards the right side of your body.","Pause for a moment, then twist your torso to the left, bringing your hands or weight towards the left side of your body.","Continue alternating sides for the desired number of repetitions."]},{"name":"Scapula Dips","gif":"7xeukSt.gif","primaryMuscles":["traps"],"secondaryMuscles":["rhomboids","deltoids"],"equipment":"body weight","bodyParts":["back"],"instructions":["Start by standing with your feet shoulder-width apart and your arms extended in front of you.","Bend your knees slightly and hinge forward at the hips, keeping your back straight.","Lower your body by bending your elbows and retracting your shoulder blades, as if you are trying to squeeze a pencil between them.","Pause for a moment at the bottom, then push through your hands to extend your elbows and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Scapula ith your feet flat on the ground.","Extend one leg straight out in front of you, keeping your heel on the ground.","Lean forward slightly, feeling a stretch in your calf muscle.","Hold the stretch for 20-30 seconds.","Switch legs and repeat the stretch."]},{"name":"Seated Glute Stretch","gif":"DeDThfG.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Sit on the ground with your legs extended in front of you.","Bend your right knee and cross your right ankle over your left thigh.","Place your right hand on the ground behind you for support.","With your left hand, gently press down on your right knee to deepen the stretch.","Hold the stretch for 30 seconds to 1 minute.","Switch sides and repeat."]},{"name":"Seated Leg Raise","gif":"Hgs6Nl1.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Sit on a flat bench with your back straight and your feet flat on the ground.","Place your hands on the sides of the bench for support.","Keeping your legs straight, slowly raise them up in front of you until they are parallel to the ground.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Seated Lower Back Stretch","gif":"QFmz6ch.gif","primaryMuscles":["lats"],"secondaryMuscles":["glutes","hamstrings"],"equipment":"body weight","bodyParts":["back"],"instructions":["Sit on the edge of a chair with your feet flat on the ground.","Place your hands on your thighs or on the sides of the chair for support.","Slowly lean forward from your hips, keeping your back straight.","Feel the stretch in your lower back and hold for 20-30 seconds.","Slowly return to the starting position and repeat for the desired number of repetitions."]},{"name":"Seated Piriformis Stretch","gif":"QY39eBr.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Sit on the ground with your legs extended in front of you.","Bend your right knee and place your right foot on the outside of your left knee.","Place your left elbow on the outside of your right knee and gently twist your torso to the right.","Hold the stretch for 20-30 seconds, then switch sides and repeat."]},{"name":"Seated Side Crunch (Wall)","gif":"Y9hNPcN.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Sit on the floor with your back against a wall and your legs extended in front of you.","Bend your knees and place your feet flat on the floor, hip-width apart.","Place your hands behind your head with your elbows pointing outwards.","Engage your abs and lean to one side, bringing your elbow towards your hip.","Pause for a moment, then return to the starting position.","Repeat on the other side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Seated Wide Angle Pose Sequence","gif":"HIgYKAB.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["quadriceps","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Sit on the ground with your legs extended in a wide angle.","Flex your feet and engage your quadriceps.","Place your hands on the ground behind you for support.","Keeping your back straight, lean forward from your hips.","Continue leaning forward until you feel a stretch in your hamstrings.","Hold this position for a few breaths.","Slowly release the stretch and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Self Assisted Inverse Leg Curl","gif":"GwYwElT.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Lie flat on your back on a mat or bench with your legs extended.","Place your hands by your sides or under your glutes for support.","Bend your knees and lift your feet off the ground, bringing your thighs towards your chest.","Pause for a moment at the top, then slowly lower your legs back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Self Assisted Inverse Leg Curl (On Floor)","gif":"ZSY3MsL.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Lie flat on your back with your legs extended and your arms by your sides.","Bend your knees and place your feet flat on the ground, hip-width apart.","Lift your hips off the ground, engaging your glutes and hamstrings.","Slowly curl your legs towards your glutes, keeping your hips lifted.","Pause for a moment at the top, then slowly extend your legs back to the starting position.","Lower your hips back down to the ground.","Repeat for the desired number of repetitions."]},{"name":"Semi Squat Jump (Male)","gif":"6FMU51h.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Stand with your feet shoulder-width apart.","Bend your knees and lower your body into a squat position.","Jump explosively, extending your hips and knees while swinging your arms for momentum.","Land softly on the balls of your feet and immediately go into the next repetition.","Repeat for the desired number of repetitions."]},{"name":"Short Stride Run","gif":"CcWEoWV.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Find an open space or a treadmill to perform the exercise.","Stand tall with your feet hip-width apart.","Start jogging in place, lifting your knees high and pumping your arms.","After a few seconds, start taking short strides forward, maintaining a quick pace.","Continue running with short strides for the desired duration or distance."]},{"name":"Shoulder Grip Pull-Up","gif":"YtgD7Xq.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Grab the pull-up bar with a shoulder-width grip, palms facing away from you.","Hang freely with your arms fully extended.","Engage your back muscles and pull your body up towards the bar until your chin is above the bar.","Pause for a moment at the top, then slowly lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Shoulder Tap","gif":"yRpV5TC.gif","primaryMuscles":["abs"],"secondaryMuscles":["shoulders","triceps"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Start in a high plank position with your hands directly under your shoulders and your body in a straight line.","Engage your core and lift your right hand off the ground, reaching across to tap your left shoulder.","Place your right hand back on the ground and repeat with your left hand tapping your right shoulder.","Continue alternating shoulder taps while keeping your hips and torso stable.","Repeat for the desired number of repetitions."]},{"name":"Shoulder Tap Push-Up","gif":"qEse6fe.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","core"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands slightly wider than shoulder-width apart and your body in a straight line from head to heels.","Lower your body towards the ground by bending your elbows, keeping them close to your sides.","As you push back up, lift your right hand off the ground and tap your left shoulder.","Return your right hand to the ground and repeat the push-up, this time lifting your left hand and tapping your right shoulder.","Continue alternating shoulder taps with each push-up repetition.","Maintain a stable core and avoid excessive hip rotation throughout the exercise.","Repeat for the desired number of repetitions."]},{"name":"Side Bridge Hip Abduction","gif":"WL4EmxJ.gif","primaryMuscles":["abductors"],"secondaryMuscles":["glutes","obliques"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Lie on your side with your legs extended and stacked on top of each other.","Prop yourself up on your forearm, keeping your elbow directly below your shoulder.","Engage your core and lift your hips off the ground, creating a straight line from your head to your feet.","While keeping your core engaged, lift your top leg as high as possible without rotating your hips.","Pause for a moment at the top, then lower your leg back down.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Side Bridge V. 2","gif":"RKjH6Lt.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","glutes"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie on your side with your legs extended and stacked on top of each other.","Place your forearm on the ground directly below your shoulder, with your elbow bent at a 90-degree angle.","Engage your core and lift your hips off the ground, creating a straight line from your head to your feet.","Hold this position for the desired amount of time.","Lower your hips back down to the starting position.","Repeat on the other side."]},{"name":"Side Hip (On Parallel Bars)","gif":"jTkSc6o.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Stand between two parallel bars with your feet shoulder-width apart.","Place your hands on the bars and lift your body off the ground, supporting your weight on your arms.","Engage your abs and slowly lift your legs to the side, keeping them straight.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Side Hip Abduction","gif":"7WaDzyL.gif","primaryMuscles":["abductors"],"secondaryMuscles":["glutes","quadriceps"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and your hands on your hips.","Shift your weight to one leg and lift the opposite leg out to the side, keeping it straight.","Pause for a moment at the top, then slowly lower your leg back down to the starting position.","Repeat on the other side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Side Lying Floor Stretch","gif":"jDOKRM5.gif","primaryMuscles":["lats"],"secondaryMuscles":["obliques","glutes"],"equipment":"body weight","bodyParts":["back"],"instructions":["Lie on your side with your legs straight and your bottom arm extended straight overhead.","Bend your top knee and place your foot on the ground in front of your bottom leg.","Reach your top arm over your head and grab onto something stable, like a wall or a piece of furniture.","Slowly lift your bottom leg off the ground, keeping it straight, until you feel a stretch in your side.","Hold the stretch for 20-30 seconds, then slowly lower your leg back down.","Repeat on the other side."]},{"name":"Side Lying Hip Adduction (Male)","gif":"c8f5cSY.gif","primaryMuscles":["adductors"],"secondaryMuscles":["glutes","hamstrings"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Lie on your side with your legs straight and stacked on top of each other.","Place your bottom arm under your head for support.","Engage your adductors and lift your top leg as high as possible without rotating your hips or leaning backward.","Pause for a moment at the top, then slowly lower your leg back down to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Side Plank Hip Adduction","gif":"VO2qeJg.gif","primaryMuscles":["adductors"],"secondaryMuscles":["obliques","glutes"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Start by lying on your side with your legs extended and stacked on top of each other.","Prop yourself up on your forearm, keeping your elbow directly below your shoulder.","Engage your core and lift your hips off the ground, creating a straight line from your head to your feet.","While maintaining the side plank position, lift your top leg towards the ceiling, keeping it straight.","Slowly lower your leg back down to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Side Push Neck Stretch","gif":"oQRJYkC.gif","primaryMuscles":["levator scapulae"],"secondaryMuscles":["trapezius","sternocleidomastoid"],"equipment":"body weight","bodyParts":["neck"],"instructions":["Stand or sit up straight with your shoulders relaxed.","Tilt your head to the right, bringing your right ear towards your right shoulder.","Place your right hand on the left side of your head and gently apply pressure to increase the stretch.","Hold the stretch for 15-30 seconds.","Repeat on the other side, tilting your head to the left and applying pressure with your left hand.","Repeat the stretch 2-3 times on each side."]},{"name":"Side Push-Up","gif":"wpbD28t.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders","chest","core"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Start by lying on your side with your legs extended and stacked on top of each other.","Place your bottom hand on the ground directly under your shoulder, fingers pointing forward.","Press through your bottom hand to lift your body off the ground, keeping your legs straight and your core engaged.","Extend your top arm straight up towards the ceiling, creating a straight line from your head to your heels.","Lower your body back down to the starting position with control.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Side Wrist Pull Stretch","gif":"UtmIqcI.gif","primaryMuscles":["forearms"],"secondaryMuscles":["wrists","hands"],"equipment":"body weight","bodyParts":["lower arms"],"instructions":["Stand with your feet shoulder-width apart and your arms extended in front of you.","Extend your right arm out to the side, parallel to the ground, with your palm facing down.","With your left hand, grab your right hand and gently pull it towards your body, feeling a stretch in your right forearm.","Hold the stretch for 15-30 seconds, then release.","Repeat on the other side."]},{"name":"Side-To-Side Chin","gif":"isAAZWA.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and your knees slightly bent.","Grasp a pull-up bar with an overhand grip, hands slightly wider than shoulder-width apart.","Hang from the bar with your arms fully extended and your body relaxed.","Pull yourself up by bending your elbows and bringing your chin towards the bar, while keeping your body straight.","Once your chin is above the bar, lower yourself back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Side-To-Side Toe Touch (Male)","gif":"WCAvOfC.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Stand with your feet shoulder-width apart and your arms extended to the sides.","Bend at the waist to the right, reaching your right hand towards your right foot while keeping your left hand extended to the side.","Return to the starting position and then bend at the waist to the left, reaching your left hand towards your left foot while keeping your right hand extended to the side.","Repeat the side-to-side bending motion for the desired number of repetitions."]},{"name":"Single Arm Push-Up","gif":"MUic5zN.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders","core"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a push-up position with your hands shoulder-width apart and one hand placed slightly wider than the other.","Engage your core and lower your body towards the ground by bending your elbows, keeping your back straight.","As you lower yourself, shift your weight to one side and lift the opposite arm off the ground, extending it straight out to the side.","Push through your chest and triceps to raise your body back up to the starting position, while simultaneously lowering your extended arm back to the ground.","Repeat the movement, alternating the arm you extend with each repetition."]},{"name":"Single Leg Bridge With Outstretched Leg","gif":"rmEukuS.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Lie on your back with your knees bent and feet flat on the ground.","Extend one leg straight out in front of you.","Engage your glutes and lift your hips off the ground, forming a straight line from your knees to your shoulders.","Hold for a moment at the top, then slowly lower your hips back down to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"Single Leg Calf Raise (On A Dumbbell)","gif":"fKZgDEO.gif","primaryMuscles":["calves"],"secondaryMuscles":["ankles","feet"],"equipment":"dumbbell","bodyParts":["lower legs"],"instructions":["Stand with your feet hip-width apart and hold a dumbbell in one hand.","Lift one foot off the ground and balance on the other foot.","Slowly raise your heel as high as possible, using your calf muscles.","Pause for a moment at the top, then slowly lower your heel back down.","Repeat for the desired number of repetitions, then switch to the other leg."]},{"name":"Single Leg Platform Slide","gif":"LNE3wfo.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","quadriceps"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Start by standing with one foot on a platform or slide board.","Bend your knee slightly and slide the foot on the platform backward, extending your leg.","Keep your core engaged and maintain a straight posture throughout the movement.","Slowly return to the starting position by sliding your foot back to the initial position.","Repeat the movement for the desired number of repetitions, then switch legs."]},{"name":"Single Leg Squat (Pistol) Male","gif":"nqs5HGV.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and arms extended in front of you.","Lift your right foot off the ground and extend it forward.","Slowly lower your body down by bending your left knee and pushing your hips back.","Keep your chest up and your back straight as you lower yourself down.","Lower until your left thigh is parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your left heel to return to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"Sissy Squat","gif":"xdYPUtE.gif","primaryMuscles":["quads"],"secondaryMuscles":["calves","glutes"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and your toes pointing slightly outward.","Hold onto a stable object for balance if needed.","Slowly lower your body by bending your knees and leaning back, keeping your torso upright.","Continue lowering until your thighs are parallel to the ground or as far as you can comfortably go.","Pause for a moment, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Sit-Up V. 2","gif":"Bn6TXyO.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on
