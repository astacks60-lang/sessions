 slightly bent.","Hold the cable handle with your arm extended in front of you, parallel to the ground.","Keep your elbow slightly bent and your shoulder blades pulled back.","Slowly rotate your arm outward, away from your body, while keeping your elbow in the same position.","Pause for a moment at the end of the movement, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Standing Twist Row (V-Bar)","gif":"JOZhu2h.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","shoulders"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a v-bar attachment to a cable machine at chest height.","Stand facing the cable machine with your feet shoulder-width apart.","Grasp the v-bar with an overhand grip, palms facing down.","Take a step back to create tension in the cable.","Keep your back straight and core engaged throughout the exercise.","Pull the v-bar towards your torso by retracting your shoulder blades and bending your elbows.","As you pull, twist your torso to one side, squeezing your shoulder blades together.","Pause for a moment at the top of the movement, feeling the contraction in your upper back.","Slowly release the tension and return to the starting position, untwisting your torso.","Repeat the movement for the desired number of repetitions, alternating the twisting direction with each rep."]},{"name":"Cable Standing Up Straight Crossovers","gif":"UKWTJWR.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Stand in the middle of a cable machine with your feet shoulder-width apart.","Hold the handles of the cables with your palms facing down and your arms extended straight out to the sides.","Keeping your arms straight, bring your hands together in front of your body, crossing them over each other.","Pause for a moment, then slowly return to the starting position, keeping your arms extended.","Repeat for the desired number of repetitions."]},{"name":"Cable Straight Arm Pulldown","gif":"x69MAlq.gif","primaryMuscles":["lats"],"secondaryMuscles":["shoulders","biceps"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a straight bar to the high pulley of a cable machine.","Stand facing the machine with your feet shoulder-width apart.","Grasp the bar with an overhand grip, keeping your arms straight and your palms facing down.","Engage your lats and pull the bar down towards your thighs, keeping your arms straight throughout the movement.","Pause for a moment at the bottom, then slowly return the bar to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Straight Arm Pulldown (With Rope)","gif":"DT14T9T.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a rope to the cable machine at the highest setting.","Stand facing the machine with your feet shoulder-width apart.","Grasp the rope with both hands, palms facing down.","Extend your arms fully in front of you, keeping your elbows slightly bent.","Engage your lats and slowly pull the rope down towards your thighs, keeping your arms straight.","Pause for a moment at the bottom, then slowly release the tension and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Straight Back Seated Row","gif":"Tq6gbK6.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms","shoulders"],"equipment":"cable","bodyParts":["back"],"instructions":["Sit on the cable row machine with your feet flat on the footrests and your knees slightly bent.","Grasp the cable handles with an overhand grip, palms facing down.","Keep your back straight and lean slightly forward from the hips.","Pull the cable handles towards your body, squeezing your shoulder blades together.","Pause for a moment at the peak of the movement, then slowly release the handles back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Supine Reverse Fly","gif":"PQcUlDi.gif","primaryMuscles":["delts"],"secondaryMuscles":["trapezius","rhomboids"],"equipment":"cable","bodyParts":["shoulders"],"instructions":["Attach a D-handle to a low pulley cable machine and lie face down on a flat bench.","Grasp the D-handle with each hand, palms facing down, and extend your arms straight out in front of you.","Keeping your arms straight, raise them out to the sides until they are parallel to the floor.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Thibaudeau Kayak Row","gif":"ZgwWBoC.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","rhomboids","rear deltoids"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a cable handle to a low pulley and sit facing the machine with your feet flat on the floor.","Grasp the handle with your right hand and extend your arm fully, keeping a slight bend in your elbow.","Lean forward from your hips, keeping your back straight and your abs engaged.","Pull the handle towards your torso by retracting your shoulder blade and bending your elbow, keeping your arm close to your body.","Squeeze your back muscles at the top of the movement, then slowly return to the starting position.","Repeat for the desired number of repetitions, then switch sides and perform with your left arm."]},{"name":"Cable Triceps Pushdown (V-Bar)","gif":"gAwDzB3.gif","primaryMuscles":["triceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a v-bar attachment to the cable machine at the highest setting.","Stand facing the cable machine with your feet shoulder-width apart.","Grasp the v-bar with an overhand grip, palms facing down, and your hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary throughout the exercise.","Engage your triceps and exhale as you push the v-bar down until your arms are fully extended.","Pause for a moment at the bottom of the movement, squeezing your triceps.","Inhale as you slowly return the v-bar to the starting position, maintaining control.","Repeat for the desired number of repetitions."]},{"name":"Cable Triceps Pushdown (V-Bar) (With Arm Blaster)","gif":"OxJk1fg.gif","primaryMuscles":["triceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a v-bar attachment to the cable machine at the highest setting.","Stand facing the cable machine with your feet shoulder-width apart.","Grasp the v-bar with an overhand grip, palms facing down, and your hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary throughout the exercise.","Engage your triceps and exhale as you push the v-bar down until your arms are fully extended.","Pause for a moment at the bottom of the movement, squeezing your triceps.","Inhale as you slowly return the v-bar to the starting position, maintaining control.","Repeat for the desired number of repetitions."]},{"name":"Cable Tuck Reverse Crunch","gif":"TXtXc84.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"cable","bodyParts":["waist"],"instructions":["Attach a cable to a low pulley and lie down on a mat facing up.","Hold the cable with both hands and extend your arms straight up above your chest.","Bend your knees and lift your legs up, bringing your knees towards your chest.","At the same time, curl your pelvis up towards your chest, lifting your hips off the ground.","Pause for a moment at the top, then slowly lower your legs and hips back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Twist","gif":"aVs3BR3.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"cable","bodyParts":["waist"],"instructions":["Stand with your feet shoulder-width apart, facing the cable machine.","Hold the cable handle with both hands in front of your chest, keeping your arms slightly bent.","Engage your core and twist your torso to the right, pulling the cable across your body.","Pause for a moment at the end of the movement, feeling the contraction in your abs and obliques.","Slowly return to the starting position, resisting the cable's pull.","Repeat the movement to the left side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Cable Twist (Up-Down)","gif":"fhZQPlV.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","lower back"],"equipment":"cable","bodyParts":["waist"],"instructions":["Stand with your feet shoulder-width apart, facing the cable machine.","Hold the cable handle with both hands in front of your chest, keeping your arms slightly bent.","Engage your core and slowly rotate your torso to one side, keeping your hips and legs stable.","Pause for a moment at the end of the rotation, then slowly return to the starting position.","Repeat the rotation to the opposite side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Cable Twisting Pull","gif":"zCgxPbV.gif","primaryMuscles":["lats"],"secondaryMuscles":["shoulders","biceps"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a cable handle to a low pulley and stand facing the machine.","Grasp the handle with your left hand and step away from the machine, extending your arm fully.","Position your feet shoulder-width apart, with your knees slightly bent.","Keep your back straight and your core engaged throughout the exercise.","Pull the handle towards your body, rotating your torso to the right as you do so.","Squeeze your back muscles at the end of the movement.","Slowly return to the starting position, keeping tension on the cable.","Repeat for the desired number of repetitions, then switch sides and perform with your right hand."]},{"name":"Cable Two Arm Curl On Incline Bench","gif":"H9y3Dkr.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Sit on an incline bench with your back against the pad and your feet flat on the ground.","Grasp the cable handles with an underhand grip, palms facing up, and your arms fully extended.","Keeping your upper arms stationary, exhale and curl the handles towards your shoulders while contracting your biceps.","Pause for a moment at the top of the movement, squeezing your biceps.","Inhale and slowly lower the handles back to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Cable Two Arm Tricep Kickback","gif":"vvNjDJS.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and knees slightly bent.","Hold the cable handle in each hand with your palms facing inwards and your arms bent at a 90-degree angle.","Keeping your upper arms stationary, extend your forearms backwards until your arms are fully extended.","Pause for a moment, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Underhand Pulldown","gif":"xBYcQHj.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Adjust the cable machine so that the pulldown bar is at a height above your head.","Sit down on the seat and grab the pulldown bar with an underhand grip, hands slightly wider than shoulder-width apart.","Keep your back straight and lean back slightly.","Pull the bar down towards your chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the bar back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Upper Chest Crossovers","gif":"j7XMAyn.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Attach the handles to the cables at chest height.","Stand in the center of the cable machine with one foot slightly in front of the other.","Grasp the handles with your palms facing down and your arms extended out to the sides.","Keep a slight bend in your elbows and engage your core.","Pull the cables together in front of your chest, crossing them over each other.","Squeeze your chest muscles at the peak of the movement.","Slowly release the cables back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Upper Row","gif":"PQStVXH.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","shoulders"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a straight bar to a cable machine at chest height.","Stand facing the machine with your feet shoulder-width apart.","Grasp the bar with an overhand grip, hands slightly wider than shoulder-width apart.","Keep your back straight and your core engaged.","Pull the bar towards your upper chest, squeezing your shoulder blades together.","Pause for a moment at the top of the movement.","Slowly release the bar back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Upright Row","gif":"cALKspW.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","biceps"],"equipment":"cable","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, knees slightly bent, and hold the cable attachment with an overhand grip.","Keep your back straight and your core engaged throughout the exercise.","Pull the cable attachment straight up towards your chin, leading with your elbows.","Pause for a moment at the top, squeezing your shoulder blades together.","Slowly lower the cable attachment back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Wide Grip Rear Pulldown Behind Neck","gif":"CmEr4pM.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","rhomboids","rear deltoids"],"equipment":"cable","bodyParts":["back"],"instructions":["Adjust the cable machine so that the pulldown bar is at a height above your head.","Sit down on the seat and grab the pulldown bar with a wide overhand grip.","Keep your back straight and your chest up as you lean back slightly.","Pull the bar down towards your upper chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the bar back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Wrist Curl","gif":"LrV4s90.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","brachialis"],"equipment":"cable","bodyParts":["lower arms"],"instructions":["Attach a straight bar to a low pulley cable machine.","Stand facing the machine with your feet shoulder-width apart.","Grasp the bar with an underhand grip, palms facing up, and your hands shoulder-width apart.","Rest your forearms on a bench or pad, with your wrists hanging off the edge.","Keeping your forearms stationary, exhale and curl your wrists upward as far as possible.","Pause for a moment at the top, then inhale and slowly lower the bar back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Calf Push Stretch With Hands Against Wall","gif":"PzNxakt.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings"],"equipment":"body weight","bodyParts":["lower legs"],"instructions":["Stand facing a wall with your feet hip-width apart.","Place your hands against the wall at shoulder height.","Step back with one foot, keeping your heel on the ground and your leg straight.","Bend your front knee slightly and lean forward, feeling a stretch in your calf.","Hold the stretch for 20-30 seconds.","Switch legs and repeat the stretch."]},{"name":"Calf Stretch With Hands Against Wall","gif":"m0tCHqc.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings"],"equipment":"body weight","bodyParts":["lower legs"],"instructions":["Stand facing a wall with your feet hip-width apart.","Place your hands against the wall at shoulder height.","Step your right foot back, keeping your heel on the ground and your leg straight.","Bend your left knee and lean forward, keeping your back leg straight and your heel on the ground.","Hold the stretch for 20-30 seconds.","Switch legs and repeat the stretch."]},{"name":"Calf Stretch With Rope","gif":"1LVFcEn.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings"],"equipment":"rope","bodyParts":["lower legs"],"instructions":["Stand facing a wall or sturdy object with your feet hip-width apart.","Hold the ends of the rope in each hand and place the middle of the rope around the ball of your right foot.","Step back with your left foot, keeping your heel on the ground and your leg straight.","Lean forward, keeping your back straight, and gently pull on the rope to stretch your calf.","Hold the stretch for 20-30 seconds, then release.","Repeat on the other leg."]},{"name":"Cambered Bar Lying Row","gif":"R5swFnc.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"barbell","bodyParts":["back"],"instructions":["Set up a barbell on the floor and lie face down on a bench with your chest just off the edge.","Reach down and grab the barbell with an overhand grip, slightly wider than shoulder-width apart.","With your legs straight and feet on the ground, lift the barbell off the floor by extending your arms.","Pull the barbell towards your chest, squeezing your shoulder blades together.","Lower the barbell back down to the starting position and repeat for the desired number of repetitions."]},{"name":"Captains Chair Straight Leg Raise","gif":"weoDEpH.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Sit on the captain's chair with your back against the backrest and your forearms resting on the arm pads.","Keep your upper body stable and your back straight.","Engage your abs and lift your legs up in front of you, keeping them straight.","Continue lifting until your legs are parallel to the ground or as high as you can comfortably go.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Chair Leg Extended Stretch","gif":"xGgAGPm.gif","primaryMuscles":["quads"],"secondaryMuscles":["hamstrings","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Sit on the edge of a chair with your back straight and feet flat on the ground.","Extend one leg straight out in front of you, keeping your heel on the ground.","Lean forward slightly, feeling a stretch in your quadriceps.","Hold this position for 20-30 seconds.","Switch legs and repeat the stretch."]},{"name":"Chest And Front Of Shoulder Stretch","gif":"Uto7l43.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Stand tall with your feet shoulder-width apart.","Extend your arms straight out in front of you at shoulder height.","Cross your arms in front of your body, with your right arm on top of your left arm.","Interlace your fingers and press your palms together.","Gently squeeze your shoulder blades together and push your hands forward, feeling a stretch in your chest and front of your shoulders.","Hold the stretch for 20-30 seconds, then release.","Repeat for the desired number of repetitions."]},{"name":"Chest Dip","gif":"9WTm7dq.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Position yourself on parallel bars with your arms fully extended and your body straight.","Lower your body by bending your elbows until your shoulders are below your elbows.","Push yourself back up to the starting position by straightening your arms.","Repeat for the desired number of repetitions."]},{"name":"Chest Dip (On Dip-Pull-Up Cage)","gif":"XgWyAiA.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Adjust the dip bars to a height that allows you to comfortably grip them.","Stand between the bars and place your hands on each bar, slightly wider than shoulder-width apart.","Jump up and straighten your arms, supporting your body weight on the bars.","Bend your knees and cross your ankles behind you.","Lower your body by bending your elbows, keeping your chest up and your shoulders down.","Continue lowering until your shoulders are below your elbows or until you feel a stretch in your chest.","Push through your palms and extend your elbows to raise your body back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Chest Dip On Straight Bar","gif":"LQFOrMn.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Grab the parallel bars with your palms facing down and your arms fully extended.","Bend your knees and cross your ankles.","Lower your body by bending your arms until your shoulders are below your elbows.","Push yourself back up to the starting position by straightening your arms.","Repeat for the desired number of repetitions."]},{"name":"Chest Stretch With Exercise Ball","gif":"ykA5tU7.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"stability ball","bodyParts":["chest"],"instructions":["Sit on the stability ball with your feet flat on the ground and your back straight.","Hold the exercise ball with both hands and extend your arms straight out in front of you.","Slowly bring the exercise ball towards your chest, feeling a stretch in your chest muscles.","Hold the stretch for a few seconds, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Chest Tap Push-Up (Male)","gif":"7E06s6d.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands slightly wider than shoulder-width apart and your body in a straight line.","Lower your body towards the ground by bending your elbows, keeping them close to your sides.","As you lower yourself, tap your chest with your right hand.","Push yourself back up to the starting position.","Repeat the movement, this time tapping your chest with your left hand.","Continue alternating sides for the desired number of repetitions."]},{"name":"Chin-Up","gif":"T2mxWqc.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Hang from a pull-up bar with your palms facing towards you and your hands shoulder-width apart.","Engage your core and pull your body up towards the bar, leading with your chest.","Continue pulling until your chin is above the bar.","Pause for a moment at the top, then slowly lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Chin-Ups (Narrow Parallel Grip)","gif":"G70mEAJ.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Hang from a pull-up bar with a narrow parallel grip, palms facing towards you.","Engage your back muscles and pull your body up towards the bar, keeping your elbows close to your body.","Continue pulling until your chin is above the bar.","Pause for a moment at the top, then slowly lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Circles Knee Stretch","gif":"X7jbxra.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","quadriceps"],"equipment":"body weight","bodyParts":["lower legs"],"instructions":["Stand with your feet shoulder-width apart and your hands on your hips.","Bend your knees slightly and lift your heels off the ground, balancing on the balls of your feet.","Keeping your knees bent, rotate your knees in a circular motion, first clockwise and then counterclockwise.","Perform the movement for the desired number of repetitions."]},{"name":"Clap Push Up","gif":"wigSg76.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands slightly wider than shoulder-width apart.","Lower your body towards the ground by bending your elbows, keeping your core engaged.","Push through your palms explosively to propel your body off the ground.","While in mid-air, clap your hands together before landing back in the starting position.","Repeat for the desired number of repetitions."]},{"name":"Clock Push-Up","gif":"CMAxnsG.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders","core"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands directly under your shoulders and your body in a straight line.","Lower your body towards the ground by bending your elbows, keeping them close to your sides.","As you lower, rotate your body to the left, extending your left arm straight out to the side.","Push back up to the starting position, while rotating your body to the center.","Repeat the push-up, this time rotating your body to the right and extending your right arm out to the side.","Continue alternating sides with each repetition."]},{"name":"Close Grip Chin-Up","gif":"VnfUNW7.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Grab the pull-up bar with your palms facing towards you and your hands shoulder-width apart.","Hang from the bar with your arms fully extended and your feet off the ground.","Engage your back muscles and pull your body up towards the bar, keeping your elbows close to your body.","Continue pulling until your chin is above the bar.","Pause for a moment at the top, then slowly lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Close-Grip Push-Up","gif":"x6KpKpq.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Start in a high plank position with your hands placed close together, directly under your shoulders.","Engage your core and lower your body towards the ground, keeping your elbows close to your sides.","Push through your palms to extend your arms and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Close-Grip Push-Up (On Knees)","gif":"v3vLFW0.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Start by getting on your hands and knees, with your hands shoulder-width apart and your knees hip-width apart.","Lower your upper body towards the ground by bending your elbows, keeping them close to your sides.","Pause for a moment when your chest is just above the ground.","Push through your palms to straighten your arms and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cocoons","gif":"SLKj2pX.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors","lower back"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Place your hands behind your head with your elbows pointing outwards.","Engaging your abs, slowly lift your upper body off the ground, curling forward until your torso is at a 45-degree angle.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Crab Twist Toe Touch","gif":"xgsGFVM.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques","hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Start by sitting on the ground with your knees bent and feet flat on the floor.","Place your hands behind you, fingers pointing towards your feet, and lift your hips off the ground.","Extend one leg straight out in front of you while simultaneously reaching your opposite hand towards your toes.","Return to the starting position and repeat on the other side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Cross Body Crunch","gif":"rbu5UUb.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Place your hands behind your head with your elbows pointing outwards.","Engaging your abs, lift your upper body off the ground and twist to bring your right elbow towards your left knee.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat on the other side, bringing your left elbow towards your right knee.","Repeat for the desired number of repetitions."]},{"name":"Crunch (Hands Overhead)","gif":"kjJ3VoQ.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Extend your arms straight above your head.","Engaging your abs, lift your upper body off the ground, curling forward towards your knees.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Crunch (On Stability Ball)","gif":"MCUhf1F.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"stability ball","bodyParts":["waist"],"instructions":["Sit on the stability ball with your feet flat on the ground and your knees bent at a 90-degree angle.","Lie back on the ball until your lower back is supported and your upper body is parallel to the floor.","Place your hands behind your head or across your chest.","Engage your abs and lift your upper body towards your knees, curling your torso forward.","Pause for a moment at the top of the movement, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Crunch (On Stability Ball, Arms Straight)","gif":"Sn8wxAI.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"stability ball","bodyParts":["waist"],"instructions":["Sit on the stability ball with your feet flat on the ground and your knees bent at a 90-degree angle.","Lie back on the ball until your lower back is supported and your upper body is parallel to the floor.","Place your hands behind your head or cross them over your chest.","Engage your abs and lift your upper body off the ball, curling your shoulders towards your hips.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Crunch Floor","gif":"TFqbd8t.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Place your hands behind your head with your elbows pointing outwards.","Engage your abs and lift your shoulders off the ground, curling forward towards your knees.","Pause for a moment at the top, then slowly lower your shoulders back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Curl-Up","gif":"g2oKspu.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Place your hands behind your head with your elbows pointing outwards.","Engaging your abs, slowly lift your upper body off the ground, curling forward until your torso is at a 45-degree angle.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Curtsey Squat","gif":"gUjqdei.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart.","Take a step diagonally behind and across your body with your right foot, crossing it behind your left leg.","Bend both knees as if you were curtsying, lowering your body towards the ground.","Keep your torso upright and your weight on your front foot.","Push through your front foot to return to the starting position.","Repeat on the other side, stepping diagonally behind and across your body with your left foot."]},{"name":"Cycle Cross Trainer","gif":"XSCHmiI.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","glutes"],"equipment":"leverage machine","bodyParts":["cardio"],"instructions":["Adjust the seat height and position yourself on the cycle cross trainer.","Place your feet on the pedals and grip the handlebars.","Start pedaling in a smooth and controlled motion.","Maintain a steady pace and increase the resistance if desired.","Continue pedaling for the desired duration of your cardio workout."]},{"name":"Dead Bug","gif":"iny3m5y.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors","lower back"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your arms extended towards the ceiling.","Bend your knees and lift your legs off the ground, creating a 90-degree angle at your hips and knees.","Engage your core and lower back to press your lower back into the ground.","Slowly lower your right arm and left leg towards the ground, keeping them straight and hovering just above the floor.","Pause for a moment, then return to the starting position.","Repeat the movement with your left arm and right leg.","Continue alternating sides for the desired number of repetitions."]},{"name":"Decline Crunch","gif":"9Ap7miY.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie on a decline bench with your feet secured and your knees bent at a 90-degree angle.","Place your hands behind your head or across your chest.","Engage your abs and lift your upper body towards your knees, curling your torso.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Decline Push-Up","gif":"i5cEhka.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Place your hands on the ground slightly wider than shoulder-width apart, with your feet elevated on a stable surface.","Keep your body in a straight line from head to toe, engaging your core muscles.","Lower your chest towards the ground by bending your elbows, keeping them close to your body.","Push through your palms to extend your arms and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Decline Sit-Up","gif":"QLL2gdc.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors","lower back"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie on a decline bench with your feet secured and your knees bent.","Place your hands behind your head or across your chest.","Engage your abs and lift your upper body off the bench, curling forward towards your knees.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Deep Push Up","gif":"vptOQ4N.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands slightly wider than shoulder-width apart and your body in a straight line.","Lower your chest towards the ground by bending your elbows, keeping them close to your body.","Push through your palms to extend your arms and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Diamond Push-Up","gif":"soIB2rj.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Start in a high plank position with your hands close together, forming a diamond shape with your thumbs and index fingers.","Keep your body in a straight line from head to toe, engaging your core and glutes.","Lower your chest towards the diamond shape formed by your hands, keeping your elbows close to your body.","Pause for a moment at the bottom, then push yourself back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Donkey Calf Raise","gif":"u5ESqzH.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"body weight","bodyParts":["lower legs"],"instructions":["Stand with your toes on an elevated surface, such as a step or block.","Place your hands on a stable support, such as a wall or railing, for balance.","Raise your heels as high as possible, lifting your body weight onto the balls of your feet.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Drop Push Up","gif":"Q497lAE.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands slightly wider than shoulder-width apart.","Lower your chest towards the ground, keeping your elbows close to your body.","Once your chest is just above the ground, quickly drop your knees to the ground.","Push yourself back up to the starting position by extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Alternate Biceps Curl","gif":"BU15nH4.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing forward and arms fully extended.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions, alternating arms."]},{"name":"Dumbbell Alternate Biceps Curl (With Arm Blaster)","gif":"CfKsRbG.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with your feet shoulder-width apart and hold a dumbbell in each hand, palms facing forward.","Place the arm blaster on your upper arms, ensuring a secure fit.","Keeping your upper arms stationary, exhale and curl one dumbbell up towards your shoulder while contracting your biceps.","Continue to raise the dumbbell until your biceps are fully contracted and the dumbbell is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly lower the dumbbell back to the starting position.","Repeat the movement with the opposite arm.","Continue alternating arms for the desired number of repetitions."]},{"name":"Dumbbell Alternate Hammer Preacher Curl","gif":"fy7Tgy4.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a preacher bench with a dumbbell in each hand, palms facing your torso and arms fully extended.","Keep your upper arms stationary and exhale as you curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."]},{"name":"Dumbbell Alternate Preacher Curl","gif":"NlfIbzq.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a preacher bench with a dumbbell in each hand, palms facing up.","Rest your upper arms on the pad of the preacher bench, allowing your arms to fully extend.","Keeping your upper arms stationary, exhale and curl the dumbbell in your right hand as you contract your biceps.","Continue to curl the dumbbell until your biceps are fully contracted and the dumbbell is at shoulder level.","Pause for a moment, then inhale and slowly lower the dumbbell back to the starting position.","Repeat the movement with your left arm.","Continue alternating arms for the desired number of repetitions."]},{"name":"Dumbbell Alternate Seated Hammer Curl","gif":"6em2Dxj.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with a dumbbell in each hand, palms facing your torso and arms extended down.","Keep your back straight and your elbows close to your torso.","Exhale and curl the dumbbell in your right hand towards your shoulder, keeping your upper arm stationary.","Continue to raise the dumbbell until your biceps are fully contracted and the dumbbell is at shoulder level.","Pause for a brief moment, then inhale and slowly lower the dumbbell back to the starting position.","Repeat the movement with your left arm.","Continue alternating arms for the desired number of repetitions."]},{"name":"Dumbbell Alternate Side Press","gif":"izMnLqz.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","core"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand at shoulder height.","Press one dumbbell overhead while keeping the other dumbbell at shoulder height.","Lower the pressed dumbbell back to shoulder height while pressing the other dumbbell overhead.","Continue alternating sides for the desired number of repetitions."]},{"name":"Dumbbell Alternating Bicep Curl With Leg Raised On Exercise Ball","gif":"Zwiw7XR.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand, palms facing forward.","Place an exercise ball behind you and position one foot on top of it, keeping your balance.","With your arms fully extended and elbows close to your sides, curl one dumbbell towards your shoulder while keeping your upper arm stationary.","Lower the dumbbell back down to the starting position and repeat with the other arm.","Continue alternating arms for the desired number of repetitions."]},{"name":"Dumbbell Alternating Seated Bicep Curl On Exercise Ball","gif":"J74XlNf.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an exercise ball with your feet flat on the ground and your back straight.","Hold a dumbbell in each hand with your palms facing forward and your arms fully extended.","Keeping your upper arms stationary, exhale and curl one dumbbell while rotating your forearm until your palm is facing your shoulder.","Inhale and slowly lower the dumbbell back to the starting position.","Repeat the curl with the other arm.","Continue alternating curls for the desired number of repetitions."]},{"name":"Dumbbell Arnold Press","gif":"Xy4jlWA.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper chest"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Sit on a bench with back support and hold a dumbbell in each hand at shoulder level, palms facing your body and elbows bent.","Press the dumbbells upward until your arms are fully extended and your palms are facing forward.","Rotate your wrists as you lift, so that your palms are facing forward at the top of the movement.","Pause for a moment at the top, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Arnold Press V. 2","gif":"eOrFCnx.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper chest"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Sit on a bench with back support and hold a dumbbell in each hand at shoulder level, palms facing your body and elbows bent.","Press the dumbbells upward until your arms are fully extended and your palms are facing forward.","Rotate your wrists as you lift, so that your palms end up facing forward at the top of the movement.","Pause for a moment at the top, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Around Pullover","gif":"vi8EhoE.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","latissimus dorsi"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Lie flat on a bench with your head at one end and your feet firmly on the ground.","Hold a dumbbell with both hands and extend your arms straight above your chest.","Keeping your arms straight, slowly lower the dumbbell behind your head in an arc motion.","Pause for a moment at the bottom, then raise the dumbbell back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Bench Press","gif":"SpYC0Kp.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Hold a dumbbell in each hand, with your palms facing forward and your arms extended above your chest.","Lower the dumbbells slowly to the sides of your chest, keeping your elbows at a 90-degree angle.","Pause for a moment, then push the dumbbells back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Bench Seated Press","gif":"3d7wHyd.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","chest"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Sit on a bench with a dumbbell in each hand, resting on your thighs.","Lean back and position the dumbbells to the sides of your chest, palms facing forward.","Press the dumbbells upward until your arms are fully extended.","Pause for a moment at the top, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Bench Squat","gif":"mnzcrIB.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Place a dumbbell on the ground in front of a bench.","Stand facing away from the bench with your feet shoulder-width apart.","Bend at the knees and hips to lower yourself down towards the bench, keeping your chest up and back straight.","Once your glutes touch the bench, push through your heels to stand back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Bent Over Row","gif":"BJ0Hz5L.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"dumbbell","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart, knees slightly bent, and hold a dumbbell in each hand with your palms facing your body.","Bend forward at the hips, keeping your back straight and your core engaged.","Let your arms hang straight down towards the floor, with your elbows slightly bent.","Pull the dumbbells up towards your chest, squeezing your shoulder blades together.","Pause for a moment at the top, then slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Bicep Curl Lunge With Bowling Motion","gif":"1VpF8db.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing forward.","Take a step forward with your right foot, bending your right knee and lowering your body into a lunge position.","As you lunge forward, curl the dumbbells up towards your shoulders, keeping your elbows close to your body.","At the bottom of the lunge, rotate your torso to the right, as if you were bowling a ball.","Reverse the motion, stepping back with your right foot and returning to the starting position while lowering the dumbbells back down.","Repeat the lunge and curl motion, this time rotating your torso to the left.","Continue alternating sides for the desired number of repetitions."]},{"name":"Dumbbell Bicep Curl On Exercise Ball With Leg Raised","gif":"2NImIAG.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an exercise ball with your feet flat on the ground and your back straight.","Hold a dumbbell in each hand with your palms facing forward and your arms fully extended.","Slowly curl the dumbbells towards your shoulders, keeping your elbows close to your sides.","Pause for a moment at the top of the movement, then slowly lower the dumbbells back to the starting position.","While performing the bicep curl, raise one leg off the ground and hold it in the air for the duration of the exercise.","Repeat for the desired number of repetitions, then switch legs and repeat."]},{"name":"Dumbbell Bicep Curl With Stork Stance","gif":"uSkDMYl.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand, palms facing forward.","Extend one leg behind you, balancing on the toes of that foot.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions, then switch legs and repeat."]},{"name":"Dumbbell Biceps Curl","gif":"NbVPDMW.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing forward and arms fully extended.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Biceps Curl (With Arm Blaster)","gif":"nlJsbkW.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing forward.","Keep your elbows close to your torso and your upper arms stationary.","Exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Biceps Curl Reverse","gif":"nFc4FyV.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing down and arms fully extended.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Biceps Curl Squat","gif":"niXESDw.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing forward.","Keeping your back straight and your elbows close to your sides, exhale and curl the dumbbells up towards your shoulders.","Pause for a moment at the top, squeezing your biceps.","Inhale and slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Biceps Curl V Sit On Bosu Ball","gif":"H1XAdpk.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bosu ball with your feet flat on the ground and your knees bent at a 90-degree angle.","Hold a dumbbell in each hand with your palms facing forward and your arms fully extended down by your sides.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Burpee","gif":"0JtKWum.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves","shoulders","triceps","core"],"equipment":"dumbbell","bodyParts":["cardio"],"instructions":["Start in a standing position with your feet shoulder-width apart and a dumbbell in each hand.","Lower your body into a squat position, placing the dumbbells on the ground in front of you.","Kick your feet back into a push-up position, keeping your body in a straight line.","Perform a push-up, bending your elbows and lowering your chest towards the ground.","Jump your feet back towards your hands, landing in a squat position.","Stand up explosively, lifting the dumbbells off the ground and bringing them to your shoulders.","Press the dumbbells overhead, fully extending your arms.","Lower the dumbbells back to your shoulders and repeat the entire sequence for the desired number of repetitions."]},{"name":"Dumbbell Clean","gif":"7Hg55JG.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with an overhand grip.","Bend your knees and lower your hips into a squat position, keeping your back straight and chest up.","Explosively extend your hips and knees, driving through your heels to jump off the ground.","As you jump, shrug your shoulders and pull the dumbbells up towards your shoulders, keeping them close to your body.","Catch the dumbbells at shoulder height, with your elbows pointing forward and your palms facing up.","Lower the dumbbells back down to the starting position by reversing the movement.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Close Grip Press","gif":"7jGOBF3.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a flat bench with a dumbbell in each hand, resting on your thighs.","Using your thighs to help raise the dumbbells, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","As you breathe in, slowly lower the dumbbells to your side until they are about level with your chest.","As you exhale, use your triceps to lift the dumbbells back to the starting position. Make sure to use only your triceps and do not use your forearms or biceps to help lift the dumbbells.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."]},{"name":"Dumbbell Close-Grip Press","gif":"RxayqAZ.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a flat bench with a dumbbell in each hand, resting on your thighs.","Using your thighs to help raise the dumbbells, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","As you breathe in, slowly lower the dumbbells to your side until they are about level with your chest.","As you exhale, use your triceps to lift the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Concentration Curl","gif":"gvsWLQw.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with your legs spread apart and a dumbbell in one hand, resting your elbow on the inside of your thigh.","Fully extend your arm and hold the dumbbell with an underhand grip.","Keeping your upper arm stationary, exhale and curl the weight up towards your shoulder while contracting your biceps.","Continue to raise the dumbbell until your biceps are fully contracted and the dumbbell is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Dumbbell Contralateral Forward Lunge","gif":"ecl28tP.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand.","Take a step forward with your right foot, keeping your back straight and core engaged.","Lower your body by bending both knees until your right thigh is parallel to the ground.","Push through your right heel to return to the starting position.","Repeat with your left leg.","Alternate legs for the desired number of repetitions."]},{
