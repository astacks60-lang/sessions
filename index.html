o the starting position, rotating your wrists back to the starting position as you do so.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Cuban Press V. 2","gif":"BqgCRif.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand at shoulder height with your palms facing down.","Keeping your core engaged and your back straight, press the dumbbells straight up overhead until your arms are fully extended.","Rotate your wrists so that your palms are facing forward.","Lower the dumbbells back down to shoulder height, rotating your wrists back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Deadlift","gif":"nUwVh7b.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, toes pointing forward.","Hold a dumbbell in each hand, palms facing your body, arms extended downwards.","Bend at your hips and knees, lowering the dumbbells towards the ground while keeping your back straight.","Push through your heels and extend your hips and knees, lifting the dumbbells back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Decline Bench Press","gif":"DwhEmmE.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Lie down on a decline bench with your feet secured and your head lower than your hips.","Hold a dumbbell in each hand and extend your arms straight up above your chest, palms facing forward.","Lower the dumbbells slowly to the sides of your chest, keeping your elbows at a 90-degree angle.","Push the dumbbells back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Decline Fly","gif":"xXm4nYq.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Lie on a decline bench with your feet secured and your head lower than your hips.","Hold a dumbbell in each hand with your palms facing each other and your arms extended above your chest.","Lower the dumbbells out to the sides in a wide arc until you feel a stretch in your chest.","Pause for a moment, then squeeze your chest muscles to bring the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Decline Hammer Press","gif":"1qrWgZ2.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Lie on a decline bench with your feet secured and your head lower than your hips.","Hold a dumbbell in each hand with your palms facing each other and your arms extended above your chest.","Lower the dumbbells to the sides of your chest, keeping your elbows slightly bent.","Press the dumbbells back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Decline One Arm Fly","gif":"NL6YBwN.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Lie down on a decline bench with a dumbbell in one hand, resting it on your thigh.","Using your thigh to help raise the dumbbell, lift it up to shoulder width with your palm facing your torso.","Rotate your wrist so that the palm of your hand is facing forward.","As you breathe in, lower the dumbbell slowly to the side until you feel a stretch in your chest.","Exhale and use your chest muscles to bring the dumbbell back up to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Dumbbell Decline One Arm Hammer Press","gif":"SHUMp5H.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Lie on a decline bench with a dumbbell in one hand, resting on your chest.","Extend your arm straight up, keeping your elbow slightly bent.","Lower the dumbbell down towards your shoulder, keeping your elbow close to your body.","Press the dumbbell back up to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Dumbbell Decline Shrug","gif":"cwsAI4G.gif","primaryMuscles":["traps"],"secondaryMuscles":["shoulders","rhomboids"],"equipment":"dumbbell","bodyParts":["back"],"instructions":["Set up a decline bench at a 45-degree angle.","Lie face down on the bench with your chest and stomach resting against it.","Hold a dumbbell in each hand with your arms fully extended towards the floor.","Keeping your arms straight, raise your shoulders towards your ears as high as possible.","Hold the contraction for a moment, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Decline Shrug V. 2","gif":"bRlbdjK.gif","primaryMuscles":["traps"],"secondaryMuscles":["shoulders","rhomboids"],"equipment":"dumbbell","bodyParts":["back"],"instructions":["Set up a decline bench at a 45-degree angle.","Lie face down on the bench with your chest and stomach resting on it.","Hold a dumbbell in each hand with your palms facing each other and your arms fully extended.","Keeping your arms straight, raise your shoulders as high as possible while squeezing your shoulder blades together.","Hold the contraction for a brief pause, then lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Decline Triceps Extension","gif":"OTgkHwR.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Lie on a decline bench with your head lower than your feet and hold a dumbbell in each hand, palms facing each other.","Extend your arms fully, keeping your elbows close to your head.","Lower the dumbbells slowly behind your head, bending your elbows.","Pause for a moment, then raise the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Decline Twist Fly","gif":"reFHapa.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Lie down on a decline bench with your head lower than your hips.","Hold a dumbbell in each hand with your palms facing each other and your arms extended straight up over your chest.","Lower the dumbbells out to the sides in a wide arc until you feel a stretch in your chest.","As you lower the dumbbells, twist your wrists so that your palms face forward at the bottom of the movement.","Reverse the motion and bring the dumbbells back up to the starting position, squeezing your chest muscles at the top.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Finger Curls","gif":"mtXengz.gif","primaryMuscles":["forearms"],"secondaryMuscles":["wrist flexors","wrist extensors"],"equipment":"dumbbell","bodyParts":["lower arms"],"instructions":["Sit on a bench or chair with your feet flat on the ground and your back straight.","Hold a dumbbell in one hand with an underhand grip, resting your forearm on your thigh, palm facing up.","Allow the dumbbell to roll down to your fingertips, then curl it back up by flexing your fingers.","Repeat for the desired number of repetitions, then switch to the other hand."]},{"name":"Dumbbell Fly","gif":"yz9nUhF.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Lie flat on a bench with a dumbbell in each hand, palms facing each other.","Extend your arms straight up over your chest, with a slight bend in your elbows.","Keeping a slight bend in your elbows, lower your arms out to the sides in a wide arc until you feel a stretch in your chest.","Pause for a moment, then reverse the movement and bring the dumbbells back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Fly On Exercise Ball","gif":"Lt3iWnf.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Sit on an exercise ball and hold a dumbbell in each hand.","Walk your feet forward and roll your body down until your head, neck, and upper back are supported by the ball.","Extend your arms straight up above your chest, palms facing each other.","Bend your elbows slightly and lower your arms out to the sides in a wide arc until you feel a stretch in your chest.","Pause for a moment, then reverse the movement and squeeze your chest muscles as you bring the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Forward Lunge Triceps Extension","gif":"XalXcvM.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders","core"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand.","Take a step forward with your right foot, lowering your body into a lunge position.","Keep your back straight and your chest up.","Extend your arms straight overhead, keeping your elbows close to your ears.","Lower the dumbbells behind your head by bending your elbows.","Pause for a moment, then straighten your arms to return to the starting position.","Repeat the movement for the desired number of repetitions, then switch legs and repeat."]},{"name":"Dumbbell Front Raise","gif":"3eGE2JC.gif","primaryMuscles":["delts"],"secondaryMuscles":["biceps","trapezius"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing your thighs.","Keeping your arms straight, exhale and lift the dumbbells in front of you until they are at shoulder level.","Pause for a moment at the top, then inhale and slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Front Raise V. 2","gif":"Rr7S3yg.gif","primaryMuscles":["delts"],"secondaryMuscles":["trapezius","biceps"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing your thighs.","Keep your back straight and engage your core.","Slowly lift the dumbbells in front of you, with your arms straight, until they are at shoulder level.","Pause for a moment at the top, then slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Full Can Lateral Raise","gif":"AQ0mC4Y.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","rotator cuff"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing your body.","Keep your back straight and engage your core.","Raise your arms out to the sides, keeping a slight bend in your elbows, until they are parallel to the ground.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Goblet Squat","gif":"yn8yg1r.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell vertically against your chest with both hands.","Keeping your chest up and core engaged, lower your body down into a squat position by pushing your hips back and bending your knees.","Continue lowering until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Hammer Curl","gif":"slDvUAU.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing your torso.","Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward.","This will be your starting position.","Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Then, inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."]},{"name":"Dumbbell Hammer Curl On Exercise Ball","gif":"fY68AyX.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an exercise ball with your feet flat on the ground and your back straight.","Hold a dumbbell in each hand with your palms facing your body and your arms fully extended.","Keeping your upper arms stationary, exhale and curl the dumbbells while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Hammer Curl V. 2","gif":"2NpxjC1.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing your torso.","Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward.","This will be your starting position.","Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Then, inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."]},{"name":"Dumbbell Hammer Curls (With Arm Blaster)","gif":"GNhAeJ0.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing your torso.","Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward.","This will be your starting position.","Now, while holding your upper arm stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Then, inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."]},{"name":"Dumbbell High Curl","gif":"qAmNMJY.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing forward.","Keep your upper arms stationary and curl the dumbbells as high as possible while contracting your biceps.","Pause for a moment at the top, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Alternate Press","gif":"TVdivgY.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Sit on an incline bench with a dumbbell in each hand, resting on your thighs.","Lean back on the bench and use your thighs to help raise the dumbbells to shoulder height, palms facing forward.","Once at shoulder height, rotate your wrists so that the palms of your hands are facing forward.","Push the dumbbells up with your chest and shoulders, extending your arms fully.","Lower the dumbbells back down to the starting position, keeping your elbows slightly bent.","Repeat for the desired number of repetitions, alternating arms."]},{"name":"Dumbbell Incline Bench Press","gif":"ns0SIbU.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Set up an incline bench at a 45-degree angle.","Sit on the bench with your feet flat on the ground and your back pressed firmly against the bench.","Hold a dumbbell in each hand, palms facing forward, and lift them to shoulder height.","Slowly lower the dumbbells to the sides of your chest, keeping your elbows at a 90-degree angle.","Push the dumbbells back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Biceps Curl","gif":"F3xgbjF.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an incline bench with a dumbbell in each hand, palms facing forward, and arms fully extended.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Breeding","gif":"B3Rxp6L.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Set up an incline bench at a 45-degree angle.","Sit on the bench with your back against the pad and feet flat on the ground.","Hold a dumbbell in each hand with an overhand grip, palms facing forward.","Start with your arms fully extended, perpendicular to the ground.","Lower the dumbbells slowly to the sides of your chest, keeping your elbows at a 90-degree angle.","Pause for a moment at the bottom, then push the dumbbells back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Curl","gif":"ae9UoXQ.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Set an incline bench to a 45-degree angle and sit on it with a dumbbell in each hand, palms facing forward.","Rest your upper arms on the incline bench and let your elbows hang down, fully extending your arms.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Curl V. 2","gif":"RaflbWD.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an incline bench with a dumbbell in each hand, palms facing forward and arms fully extended.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Fly","gif":"ESOd5Pl.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Set an incline bench to a 45-degree angle.","Sit on the bench with a dumbbell in each hand, palms facing each other.","Lie back on the bench and press the dumbbells up to the starting position, directly above your chest.","Lower the dumbbells out to the sides in a wide arc until you feel a stretch in your chest.","Pause for a moment, then squeeze your chest muscles to bring the dumbbells back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Fly On Exercise Ball","gif":"HYe1ZqR.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Set up an incline bench at a 45-degree angle.","Sit on an exercise ball and roll forward until your upper back is resting on the incline bench.","Hold a dumbbell in each hand with your palms facing each other and your arms extended above your chest.","Lower the dumbbells out to the sides in a wide arc until you feel a stretch in your chest.","Pause for a moment, then squeeze your chest muscles to bring the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Hammer Curl","gif":"ByX0WxV.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an incline bench with a dumbbell in each hand, palms facing your torso and arms fully extended.","Keep your back against the bench and your feet flat on the floor.","While keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Hammer Press","gif":"PG1kcIb.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Set an incline bench to a 45-degree angle and sit on it with a dumbbell in each hand, resting on your thighs.","Lie back on the bench and position the dumbbells at shoulder level with your palms facing each other.","Press the dumbbells up and away from your body until your arms are fully extended.","Pause for a moment at the top, then slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Hammer Press On Exercise Ball","gif":"wkgnGfb.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an exercise ball with a dumbbell in each hand, palms facing each other.","Walk your feet forward and roll your body down the ball until your head, neck, and upper back are supported on the ball.","Hold the dumbbells at shoulder level, elbows bent and pointing out to the sides.","Press the dumbbells up and slightly inward, keeping your palms facing each other.","Extend your arms fully, squeezing your triceps at the top of the movement.","Slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Inner Biceps Curl","gif":"LCtQPn8.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an incline bench with a dumbbell in each hand, palms facing each other.","Rest your upper arms on the bench, allowing your elbows to hang down and your palms to face forward.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline One Arm Fly","gif":"Gw2HFvW.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Adjust the incline bench to a 30-45 degree angle.","Sit on the bench with a dumbbell in one hand, resting it on your thigh.","Lie back on the bench, keeping your feet flat on the ground.","Hold the dumbbell with your arm extended straight up over your chest.","Lower the dumbbell out to the side in a wide arc, keeping a slight bend in your elbow.","Pause when your arm is parallel to the ground, then reverse the motion to bring the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Dumbbell Incline One Arm Fly On Exercise Ball","gif":"LLNh6q5.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Sit on an exercise ball with a dumbbell in one hand.","Walk your feet forward and roll your body down until your head, neck, and upper back are supported on the ball.","Hold the dumbbell with your arm extended straight up over your chest, palm facing inwards.","Slowly lower the dumbbell out to the side, keep he side, keeping your arm slightly bent and your palm facing down.","Continue lifting until your arm is parallel to the floor.","Pause for a moment at the top, then slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch to the other arm."]},{"name":"Dumbbell Incline One Arm Press","gif":"rDAiRf9.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Sit on an incline bench with a dumbbell in one hand, resting on your thigh.","Lie back on the bench and position the dumbbell at shoulder level, palm facing forward.","Press the dumbbell upward and slightly inward, extending your arm fully.","Pause for a moment at the top, then slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch to the other arm."]},{"name":"Dumbbell Incline One Arm Press On Exercise Ball","gif":"Bg5JKSH.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Sit on an exercise ball with a dumbbell in one hand, feet flat on the ground.","Slowly walk your feet forward, rolling the ball until your head, neck, and upper back are supported on the ball.","Hold the dumbbell at shoulder height with your palm facing forward.","Press the dumbbell upward until your arm is fully extended.","Pause for a moment at the top, then slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch to the other arm."]},{"name":"Dumbbell Incline Palm-In Press","gif":"OVLmUuL.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Set up an incline bench at a 45-degree angle.","Sit on the bench with a dumbbell in each hand, palms facing each other.","Plant your feet firmly on the ground and keep your back straight against the bench.","Start with the dumbbells at shoulder level, elbows bent and palms facing each other.","Press the dumbbells up and away from your body, extending your arms fully.","Pause for a moment at the top, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Press On Exercise Ball","gif":"bfiHMpI.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Sit on an exercise ball with a dumbbell in each hand, palms facing forward.","Slowly walk your feet forward, rolling your body down the ball until your head, neck, and upper back are supported on the ball.","Hold the dumbbells at shoulder level, elbows bent and pointing out to the sides.","Press the dumbbells upward, extending your arms fully.","Pause for a moment at the top, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Raise","gif":"nxW6BkN.gif","primaryMuscles":["delts"],"secondaryMuscles":["trapezius","triceps"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Sit on an incline bench with a dumbbell in each hand, resting on your thighs.","Lean back on the bench and raise the dumbbells to shoulder height, palms facing forward.","Keeping your back against the bench, exhale and raise the dumbbells above your head, fully extending your arms.","Pause for a moment at the top, then inhale and slowly lower the dumbbells back to shoulder height.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Rear Lateral Raise","gif":"vYk8lqw.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","rhomboids"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Set up an incline bench at a 45-degree angle.","Sit on the bench with your chest against the backrest and hold a dumbbell in each h ove your chest, with your arms extended.","Lower the dumbbells out to the sides in a wide arc until you feel a stretch in your chest.","As you lower the dumbbells, rotate your wrists so that your palms face forward at the bottom of the movement.","Reverse the motion and bring the dumbbells back up to the starting position, squeezing your chest muscles together at the top.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Two Arm Extension","gif":"U7D9Fx3.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an incline bench with a dumbbell in each hand, resting on your thighs.","Slowly lie back on the bench, keeping the dumbbells close to your chest.","Once you are fully lying down, extend your arms straight up towards the ceiling, keeping your elbows slightly bent.","Pause for a moment at the top, then slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Incline Y-Raise","gif":"PbzNu7c.gif","primaryMuscles":["upper back"],"secondaryMuscles":["shoulders","rear deltoids"],"equipment":"dumbbell","bodyParts":["back"],"instructions":["Set an incline bench to a 45-degree angle and sit on it with a dumbbell in each hand, palms facing inwards.","Lean forward slightly and let your arms hang straight down, keeping a slight bend in your elbows.","Raise your arms out to the sides and up in a Y shape until they are parallel to the ground.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Iron Cross","gif":"cALkHHX.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","chest"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand at your sides.","Raise your arms out to the sides until they are parallel to the ground, forming a T shape with your body.","Pause for a moment, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Kickback","gif":"W6PxUkg.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand.","Bend your knees slightly and hinge forward at the hips, keeping your back straight.","Bring your upper arms close to your sides, with your elbows bent at a 90-degree angle.","Extend your arms straight back, squeezing your triceps at the top of the movement.","Pause for a moment, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Kickbacks On Exercise Ball","gif":"cAvTaSg.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders","back"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an exercise ball with your feet flat on the ground and your back straight.","Hold a dumbbell in each hand with your palms facing inwards and your arms bent at a 90-degree angle.","Extend your arms straight back, squeezing your triceps at the top of the movement.","Pause for a moment, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Kneeling Bicep Curl Exercise Ball","gif":"2JCuFTU.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Kneel on the floor with an exercise ball in front of you.","Place your elbows on top of the exercise ball, holding a dumbbell in each hand with your palms facing up.","Keeping your upper arms stationary, exhale and curl the dumbbells while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Lateral Raise","gif":"DsgkuIt.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand, palms facing your body.","Keep your back straight and engage your core.","Raise your arms out to the sides until they are parallel to the floor, keeping a slight bend in your elbows.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Lateral To Front Raise","gif":"xMjBKwn.gif","primaryMuscles":["delts"],"secondaryMuscles":["trapezius","biceps"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing your body.","Keep your back straight and engage your core.","Raise your arms out to the sides until they are parallel to the ground, keeping a slight bend in your elbows.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Next, raise your arms in front of you until they are parallel to the ground, again keeping a slight bend in your elbows.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Lunge","gif":"RRWFUcw.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand.","Take a step forward with your right foot, lowering your body into a lunge position.","Keep your back straight and your chest up as you lower your body.","Push through your right heel to return to the starting position.","Repeat with your left leg.","Alternate legs for the desired number of repetitions."]},{"name":"Dumbbell Lunge With Bicep Curl","gif":"Mz6lLcW.gif","primaryMuscles":["biceps"],"secondaryMuscles":["quadriceps","hamstrings"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing forward.","Take a step forward with your right foot, lowering your body into a lunge position. Your right knee should be bent at a 90-degree angle and your left knee should be hovering just above the ground.","As you lunge forward, simultaneously curl the dumbbells towards your shoulders, keeping your elbows close to your body.","Pause for a moment at the bottom of the lunge, then push through your right heel to return to the starting position, lowering the dumbbells back down to your sides.","Repeat the lunge and bicep curl on the opposite side, stepping forward with your left foot.","Continue alternating sides for the desired number of repetitions."]},{"name":"Dumbbell Lying Alternate Extension","gif":"NfP83rA.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Lie flat on a bench with a dumbbell in each hand, palms facing each other.","Extend your arms straight up over your chest, keeping a slight bend in your elbows.","Lower one dumbbell down towards your head, bending at the elbow, while keeping the other arm extended.","Pause for a moment at the bottom, then raise the dumbbell back up to the starting position.","Repeat with the other arm, alternating sides for the desired number of repetitions."]},{"name":"Dumbbell Lying Elbow Press","gif":"eOCOwIR.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"dumbbe d, palms facing your torso and arms extended straight down.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Seated Inner Biceps Curl","gif":"KXyoEtA.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with your feet flat on the ground and hold a dumbbell in each hand, palms facing up.","Rest your upper arms on your thighs, allowing the dumbbells to hang down.","Keeping your upper arms stationary, curl the dumbbells up towards your shoulders by contracting your biceps.","Pause for a moment at the top, then slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Seated Kickback","gif":"en550rk.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with your feet flat on the ground and hold a dumbbell in each hand.","Bend your knees slightly and lean forward from your hips, keeping your back straight.","Bring your upper arms close to your sides and keep your elbows bent at a 90-degree angle.","Extend your arms straight back, squeezing your triceps at the top of the movement.","Pause for a moment, then slowly lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Seated Lateral Raise","gif":"hxyTtWj.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","upper back"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Sit on a bench with your feet flat on the ground and a dumbbell in each hand, resting on your thighs.","Keep your back straight and core engaged.","Raise the dumbbells to your sides with a slight bend in your elbows, until your arms are parallel to the ground.","Pause for a moment at the top, then slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Seated Lateral Raise V. 2","gif":"hrrS0Ed.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","triceps"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Sit on a bench with your feet flat on the ground and a dumbbell in each hand, resting on your thighs.","Keep your back straight and core engaged.","Raise the dumbbells to your sides with a slight bend in your elbows, until your arms are parallel to the ground.","Pause for a moment at the top, then slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Seated Neutral Wrist Curl","gif":"uJmK7Z1.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with your feet flat on the ground and hold a dumbbell in each hand, palms facing each other.","Rest your forearms on your thighs, allowing the dumbbells to hang down.","Keeping your wrists in a neutral position, curl the dumbbells up towards your shoulders.","Pause for a moment at the top, then slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Seated One Arm Bicep Curl On Exercise Ball With Leg Raised","gif":"84sESNy.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on an exercise ball with your feet flat on the ground and your back straight.","Hold a dumbbell in one hand with your palm facing up and your arm fully extended.","Place your other hand on your hip for stability.","Slowly curl the dumbbell towards your shoulder, keeping your upper arm stationary.","Pause for a moment at the top of the movement, squeezing your bicep.","Slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions.","Switch arms and repeat the exercise."]},{"name":"Dumbbell Seated One Arm Kickback","gif":"VQ3sNCn.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with your feet flat on the ground and hold a dumbbell in one hand.","Bend your torso forward at the waist, keeping your back straight and parallel to the ground.","Extend your arm straight back, keeping your elbow close to your body.","Pause for a moment at the top, then slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Dumbbell Seated One Arm Rotate","gif":"7f2jsqP.gif","primaryMuscles":["forearms"],"secondaryMuscles":["shoulders","biceps"],"equipment":"dumbbell","bodyParts":["lower arms"],"instructions":["Sit on a bench with your back straight and hold a dumbbell in one hand, resting it on your thigh.","Raise the dumbbell up to shoulder height, keeping your elbow close to your body.","Rotate your forearm outward, away from your body, while keeping your upper arm stationary.","Pause for a moment at the top, then slowly rotate your forearm back to the starting position.","Repeat for the desired number of repetitions, then switch to the other arm."]},{"name":"Dumbbell Seated One Leg Calf Raise","gif":"Ia7tumC.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"dumbbell","bodyParts":["lower legs"],"instructions":["Sit on a bench or chair with your feet flat on the ground and a dumbbell resting on your right thigh.","Extend your left leg straight out in front of you, keeping your foot flexed.","Place the ball of your right foot on an elevated surface, such as a step or weight plate.","Using your calf muscles, raise your right heel as high as possible.","Pause for a moment at the top, then slowly lower your heel back down to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"Dumbbell Seated One Leg Calf Raise - Hammer Grip","gif":"FxhcxUW.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"dumbbell","bodyParts":["lower legs"],"instructions":["Sit on a bench or chair with your feet flat on the ground and a dumbbell resting on your thighs.","Place one foot on a raised surface, such as a step or block, with your heel hanging off the edge.","Hold the dumbbell with a hammer grip, meaning your palms are facing each other and your fingers are wrapped around the handle.","Keeping your core engaged and your back straight, slowly raise your heel as high as possible by pushing through the ball of your foot.","Pause for a moment at the top, then slowly lower your heel back down to the starting position.","Repeat for the desired number of repetitions, then switch to the other leg."]},{"name":"Dumbbell Seated One Leg Calf Raise - Palm Up","gif":"VW88JNd.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings","glutes"],"equipment":"dumbbell","bodyParts":["lower legs"],"instructions":["Sit on a bench or chair with your back straight and your feet flat on the ground.","Hold a dumbbell in one hand and place it on top of your thigh, palm facing up.","Lift one leg off the ground and extend it in front of you, keeping your knee slightly bent.","Raise your heel as high as possible by pushing through the ball of your foot.","Pause for a moment at the top, then slowly lower your heel back down.","Repeat for the desired number of repetitions, then switch legs and repeat."]},{"name":"Dumbbell Seated Palms Up Wrist Curl","gif":"2dImyQ8.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","shoulders"],"equipment":"dumbbell","bodyParts":["lower arms"],"instructions":["Sit on a bench with your feet flat on the ground and hold a dumbbell in each hand, palms facing up.","Rest your forearms on your thighs, allowing your wrists to hang off the edge.","Slowly curl your wrists upward, squeezing your forearms at the top of the movement.","Pause for a moment, then lower your wrists back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Seated Preacher Curl","gif":"7D5bgLT.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a preacher curl bench with your feet flat on the floor.","Hold a dumbbell in one hand with an underhand grip, resting your upper arm against the preacher pad.","Keeping your upper arm stationary, exhale and curl the dumbbell up towards your shoulder.","Pause for a moment at the top, then inhale and slowly lower the dumbbell back down to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Dumbbell Seated Revers Grip Concentration Curl","gif":"lyKCLmK.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with your feet flat on the ground and hold a dumbbell in one hand, palm facing up.","Rest your elbow on the inside of your thigh, just above the knee.","Keeping your upper arm stationary, exhale and curl the dumbbell towards your shoulder.","Pause for a moment at the top, squeezing your biceps.","Inhale and slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Dumbbell Seated Reverse Grip One Arm Overhead Tricep Extension","gif":"5fKX7wi.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with your back straight and feet flat on the ground.","Hold a dumbbell with an underhand grip and extend your arm straight up overhead.","Lower the dumbbell behind your head by bending your elbow, keeping your upper arm stationary.","Pause for a moment, then extend your arm back up to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Dumbbell Seated Shoulder Press","gif":"znQUdHY.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Sit on a bench with a dumbbell in each hand, resting on your thighs.","Raise the dumbbells to shoulder height, palms facing forward.","Press the dumbbells upward until your arms are fully extended overhead.","Pause for a moment at the top, then slowly lower the dumbbells back to shoulder height.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Seated Shoulder Press (Parallel Grip)","gif":"f1jf47L.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Sit on a bench with a dumbbell in each hand, palms facing inward.","Raise the dumbbells to shoulder height, elbows bent and palms facing forward.","Press the dumbbells upward until your arms are fully extended overhead.","Pause for a moment at the top, then slowly lower the dumbbells back to shoulder height.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Seated Triceps Extension","gif":"kont8Ut.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with your back straight and feet flat on the ground.","Hold a dumbbell with both hands and extend your arms straight up overhead.","Bend your elbows and lower the dumbbell behind your head, keeping your upper arms close to your ears.","Pause for a moment, then straighten your arms and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Shrug","gif":"NJzBsGJ.gif","primaryMuscles":["traps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand with your palms facing your body.","Keep your arms straight and let the dumbbells hang by your sides.","Raise your shoulders as high as possible, as if you are trying to touch your ears with your shoulders.","Hold the contraction for a second, then slowly lower your shoulders back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Side Bend","gif":"IpONWYv.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"dumbbell","bodyParts":["waist"],"instructions":["Stand up straight with your feet shoulder-width apart and hold a dumbbell in one hand, letting it hang down by your side.","Keeping your back straight and your core engaged, slowly bend sideways at the waist towards the opposite side of the dumbbell, lowering the weight as far as you comfortably can.","Pause for a moment, then slowly return to the starting position.","Repeat for the desired number of repetitions, then switch sides and repeat."]},{"name":"Dumbbell Side Lying One Hand Raise","gif":"fTlkJop.gif","primaryMuscles":["delts"],"secondaryMuscles":["trapezius","rhomboids"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Lie on your side with your legs extended and your head supported by your arm.","Hold a dumbbell in your top hand with your palm facing down.","Keeping your arm straight, raise the dumbbell up to shoulder height.","Pause for a moment at the top, then slowly lower the dumbbell back down to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Dumbbell Side Plank With Rear Fly","gif":"X6ytgYZ.gif","primaryMuscles":["upper back"],"secondaryMuscles":["shoulders","core"],"equipment":"dumbbell","bodyParts":["back"],"instructions":["Start by lying on your side with your legs extended and stacked on top of each other.","Place your forearm on the ground directly below your shoulder, keeping your elbow bent at a 90-degree angle.","Hold a dumbbell in your top hand, with your arm extended straight down towards the ground.","Engage your core and lift your hips off the ground, creating a straight line from your head to your heels.","While maintaining the side plank position, lift the dumbbell up towards the ceiling, squeezing your shoulder blades together.","Lower the dumbbell back down to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Dumbbell Single Arm Overhead Carry","gif":"mWBtgmb.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","core"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand tall with your feet shoulder-width apart, holding a dumbbell in one hand.","Raise the dumbbell overhead, fully extending your arm.","Engage your core and keep your back straight as you walk forward, maintaining the dumbbell overhead.","Continue walking for the desired distance or time.","Switch hands and repeat the exercise."]},{"name":"Dumbbell Single Leg Calf Raise","gif":"1kB3Wmk.gif","primaryMuscles":["calves"],"secondaryMuscles":["ankles"],"equipment":"dumbbell","bodyParts":["lower legs"],"instructions":["Stand on the edge of a step or platform with your heels hanging off and your toes on the step.","Hold a dumbbell in one hand and place your other hand on a wall or railing for support.","Raise your heel as high as possible, lifting your body up onto your toes.","Pause for a moment at the top, then slowly lower your heel back down below the step.","Repeat for the desired number of repetitions, then switch to the other leg."]},{"name":"Dumbbell Single Leg Deadlift","gif":"gKozT8X.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet hip-width apart, holding a dumbbell in your right hand.","Shift your weight onto your left leg and lift your right foot slightly off the ground.","Keeping your back straight, hinge forward at the hips and lower the dumbbell towards the ground.","At the same time, extend your right leg straight behind you, maintaining a slight bend in your left knee.","Lower the dumbbell until your torso and right leg are parallel to the ground.","Pause for a moment, then engage your glutes and hamstrings to return to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Dumbbell Single Leg Deadlift With Stepbox Support","gif":"daBmy1Y.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet hip-width apart, holding a dumbbell in your right hand.","Place your left foot on a stepbox or elevated surface behind you.","Keeping your back straight and core engaged, hinge forward at the hips, lowering the dumbbell towards the ground.","As you lower the dumbbell, simultaneously lift your left leg behind you, maintaining a straight line from head to heel.","Lower the dumbbell until you feel a stretch in your right hamstring, then return to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Dumbbell Single Leg Split Squat","gif":"qx4fgX7.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand.","Take a step forward with one foot and position your feet so that your front foot is flat on the ground and your back foot is elevated on a bench or step.","Lower your body by bending your front knee and hip, keeping your back knee slightly bent and your back heel off the ground.","Continue lowering until your front thigh is parallel to the ground, then push through your front heel to return to the starting position.","Repeat for the desired number of repetitions, then switch legs and repeat."]},{"name":"Dumbbell Single Leg Squat","gif":"H6ybluc.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand.","Extend one leg forward and keep it off the ground throughout the exercise.","Bend your standing leg and lower your body down as if sitting back into a chair.","Keep your chest up and your back straight.","Pause for a moment at the bottom, then push through your heel to return to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"Dumbbell Squat","gif":"HsvHqgf.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand at your sides.","Keeping your chest up and core engaged, lower your body down by bending at the knees and hips, as if sitting back into a chair.","Continue lowering until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Standing Alternate Hammer Curl And Press","gif":"LeaZOIz.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing your body.","Keep your elbows close to your torso and your back straight.","Exhale and curl the dumbbell in your right hand towards your shoulder, keeping your upper arm stationary.","Continue to raise the dumbbell until your biceps are fully contracted and the dumbbell is at shoulder level.","Inhale and slowly lower the dumbbell back to the starting position.","Repeat the curl with your left hand.","After completing the curl with your left hand, exhale and press the dumbbell in your right hand overhead.","Extend your arm fully and hold for a moment at the top.","Inhale and slowly lower the dumbbell back to the starting position.","Repeat the press with your left hand.","Continue alternating between curls and presses for the desired number of repetitions."]},{"name":"Dumbbell Standing Alternate Overhead Press","gif":"bBi35y3.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","core"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand at shoulder level with your palms facing forward.","Press one dumbbell overhead, fully extending your arm.","Lower the dumbbell back to shoulder level.","Repeat with the other arm.","Continue alternating arms for the desired number of repetitions."]},{"name":"Dumbbell Standing Alternate Raise","gif":"SxHteRW.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","forearms"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with your palms facing your body.","Keep your back straight and your core engaged.","Raise one dumbbell to the side, keeping your arm straight and your palm facing down.","Continue lifting until your arm is parallel to the ground.","Pause for a moment at the top, then slowly lower the dumbbell back to the starting position.","Repeat with the other arm.","Alternate between arms for the desired number of repetitions."]},{"name":"Dumbbell Standing Alternating Tricep Kickback","gif":"Gi2BXfK.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand.","Bend your knees slightly and hinge forward at the hips, keeping your back straight.","Extend your arms straight back, keeping your elbows close to your body.","Pause for a moment at the top, then slowly lower the dumbbells back to the starting position.","Repeat with the other arm, alternating sides with each repetition."]},{"name":"Dumbbell Standing Around World","gif":"RSOsp5d.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","forearms"],"equipment":"dumbbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand.","Extend your arms straight out to the sides at shoulder height, palms facing down.","Keeping your arms straight, slowly rotate your arms in a circular motion, bringing the dumbbells in front of your body and then overhead.","Continue the circular motion, bringing the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Standing Bent Over One Arm Triceps Extension","gif":"CJwa0vD.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders","back"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in one hand.","Bend forward at the waist, keeping your back straight and parallel to the ground.","Extend your arm straight back, keeping your elbow close to your body.","Slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Dumbbell Standing Bent Over Two Arm Triceps Extension","gif":"3T12T87.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders","back"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand.","Bend forward at the waist, keeping your back straight and your knees slightly bent.","Extend your arms straight back, keeping your elbows close to your body.","Slowly lower the dumbbells back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Standing Biceps Curl","gif":"3s4NnTh.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing forward and arms fully extended.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the dumbbells until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Standing Calf Raise","gif":"dPmaUaU.gif","primaryMuscles":["calves"],"secondaryMuscles":["ankles"],"equipment":"dumbbell","bodyParts":["lower legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand.","Raise your heels off the ground as high as possible, using your calves.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Standing Concentration Curl","gif":"7inpWch.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in one hand, with your arm fully extended and palm facing inwards.","Place your opposite hand on your thigh for support.","Keeping your upper arm stationary, exhale and curl the dumbbell towards your shoulder by contracting your biceps.","Continue to raise the dumbbell un to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Standing Reverse Curl","gif":"0IgNjSM.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with your feet shoulder-width apart and hold a dumbbell in each hand, palms facing your body.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps. Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Standing Triceps Extension","gif":"PdmaD0N.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in one hand.","Raise the dumbbell overhead, keeping your arm straight.","Bend your elbow and lower the dumbbell behind your head, keeping your upper arm stationary.","Extend your arm back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Standing Zottman Preacher Curl","gif":"P2nRiUa.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand up straight with a dumbbell in each hand, palms facing forward.","Place your upper arms against the preacher bench and keep your elbows slightly bent.","Curl the dumbbells up towards your shoulders while keeping your upper arms stationary.","At the top of the movement, rotate your wrists so that your palms are facing downward.","Slowly lower the dumbbells back to the starting position, rotating your wrists back to the starting position as well.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Step Up Single Leg Balance With Bicep Curl","gif":"76vfTdU.gif","primaryMuscles":["biceps"],"secondaryMuscles":["quadriceps","glutes","hamstrings"],"equipment":"dumbbell","bodyParts":["upper arms"],"instructions":["Stand in front of a step or platform with a dumbbell in each hand, palms facing your body.","Place your right foot on the step, ensuring your entire foot is in contact with the surface.","Engage your core and push through your right heel to lift your body up onto the step, bringing your left knee up towards your chest.","At the top of the movement, perform a bicep curl by bending your elbows and bringing the dumbbells towards your shoulders.","Lower the dumbbells back down and simultaneously lower your left foot back to the ground.","Repeat the movement on the opposite side, stepping up with your left foot and curling the dumbbells.","Continue alternating sides for the desired number of repetitions."]},{"name":"Dumbbell Step-Up","gif":"aXtJhlg.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand in front of a bench or step with a dumbbell in each hand, palms facing your body.","Place your right foot on the bench or step, ensuring your entire foot is in contact with the surface.","Push through your right heel and lift your body up onto the bench or step, straightening your right leg.","Bring your left foot up onto the bench or step, standing fully upright.","Step back down with your left foot, followed by your right foot, returning to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"Dumbbell Step-Up Lunge","gif":"gFyFj9z.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand in front of a step or platform with a dumbbell in each hand, palms facing your sides.","Place your right foot on the step, ensuring your entire foot is on the surface.","Push through your right heel and lift your body up onto the step, bringing your left foot up as well.","Once both feet are on the step, lower your left foot back down to the starting position, keeping your right foot on the step.","Repeat the movement, alternating which foot you step up with each time.","Continue for the desired number of repetitions."]},{"name":"Dumbbell Step-Up Split Squat","gif":"QjE2DcA.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand in front of a bench or step with a dumbbell in each hand, palms facing your body.","Place your right foot on the bench or step, ensuring your entire foot is in contact with the surface.","Step up onto the bench or step with your right foot, pushing through your heel to lift your body up.","As you step up, simultaneously lift your left knee towards your chest.","Pause at the top of the movement, then slowly lower your left foot back to the ground while keeping your right foot on the bench or step.","Repeat the movement with your left foot on the bench or step.","Continue alternating between your right and left foot for the desired number of repetitions."]},{"name":"Dumbbell Stiff Leg Deadlift","gif":"5eLRITT.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with an overhand grip.","Keeping your back straight and your core engaged, hinge at the hips and lower the dumbbells towards the ground, allowing a slight bend in your knees.","Lower the dumbbells until you feel a stretch in your hamstrings, then squeeze your glutes and push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Straight Arm Pullover","gif":"i8BdLTK.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["latissimus dorsi","triceps"],"equipment":"dumbbell","bodyParts":["chest"],"instructions":["Lie flat on a bench with your head at one end and your feet planted firmly on the ground.","Hold a dumbbell with both hands and extend your arms straight above your chest.","Keeping your arms straight, slowly lower the dumbbell behind your head in an arc-like motion.","Pause for a moment, then raise the dumbbell back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Straight Leg Deadlift","gif":"oom75KC.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with an overhand grip.","Keeping your back straight and your core engaged, hinge at the hips and lower the dumbbells towards the ground, allowing your torso to lean forward.","Continue lowering the dumbbells until you feel a stretch in your hamstrings, keeping your knees slightly bent.","Pause for a moment at the bottom, then engage your glutes and hamstrings to lift your torso back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dumbbell Sumo Pull Through","gif":"BmrwWzo.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps","core"],"equipment":"dumbbell","bodyParts":["upper legs"],"instructions":["Stand with your feet wider than shoulder-width apart, toes pointed outwards.","Hold a dumbbell with both hands in front of your body, arms extended.","Bend your knees and lower your hips down into a squat position, keeping your back straight.","Lower the dumbbell down between your legs, keeping your arms straight.","Drive through your heels and extend your hips forward, pulling the dumbbell up and in front of your body.","Squeeze your glutes at t se to your ears.","Extend your arms and raise the dumbbell back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Dynamic Chest Stretch (Male)","gif":"3uj0Ozg.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Stand tall with your feet shoulder-width apart.","Extend your arms straight out to the sides, parallel to the ground.","Slowly bring your arms forward, crossing them in front of your body.","Feel the stretch in your chest muscles.","Hold the stretch for 10-30 seconds.","Return to the starting position and repeat for the desired number of repetitions."]},{"name":"Elbow Dips","gif":"LkoAWAE.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Sit on the edge of a bench or chair with your hands gripping the edge next to your hips.","Slide your hips forward off the bench and straighten your legs, keeping your heels on the ground.","Bend your elbows and lower your body towards the ground, keeping your back close to the bench.","Pause for a moment at the bottom, then push through your hands to straighten your arms and lift your body back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Elbow Lift - Reverse Push-Up","gif":"wbUYILZ.gif","primaryMuscles":["upper back"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["back"],"instructions":["Start by lying face down on the ground with your legs extended and your hands placed directly under your shoulders.","Engage your core and press through your palms to lift your upper body off the ground, keeping your elbows close to your sides.","Pause at the top for a moment, squeezing your upper back muscles.","Slowly lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Elbow-To-Knee y.","Position your hands behind your head or crossed over your chest.","Engage your core and slowly lift your upper body off the ball, extending your back until your body forms a straight line from your head to your heels.","Pause for a moment at the top, then slowly lower your upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Exercise Ball Back Extension With Rotation","gif":"WVD66ff.gif","primaryMuscles":["spine"],"secondaryMuscles":["glutes","hamstrings"],"equipment":"stability ball","bodyParts":["back"],"instructions":["Start by lying face down on the stability ball with your hips resting on the ball and your feet firmly planted on the ground.","Place your hands behind your head or cross them over your chest.","Engage your core and slowly lift your upper body off the ball, extending your back until your body forms a straight line from your head to your heels.","Pause for a moment at the top, then slowly rotate your torso to one side, keeping your hips and legs stable.","Return to the center and repeat the rotation to the other side.","Lower your upper body back down to the starting position and repeat for the desired number of repetitions."]},{"name":"Exercise Ball Dip","gif":"kprile3.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"stability ball","bodyParts":["upper arms"],"instructions":["Sit on the stability ball with your feet flat on the ground and your knees bent at a 90-degree angle.","Place your hands on the ball beside your hips, fingers pointing forward.","Engage your triceps and push through your hands to lift your body off the ball, straightening your arms.","Lower your body back down by bending your elbows, keeping them close to your sides.","Repeat for the desired number of repetitions."]},{"name":"Exercise Ball Hip Flexor Stretch","gif":"2LQkNPW.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings"],"equipment":"stability ball" rms stationary, slowly lower the barbell behind your head by bending your elbows.","Pause for a moment, then extend your arms back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Ez Bar Reverse Grip Bent Over Row","gif":"G8dXpNG.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"ez barbell","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and knees slightly bent.","Hold the ez barbell with an underhand grip, palms facing up, and hands shoulder-width apart.","Bend forward at the hips, keeping your back straight and chest up, until your torso is almost parallel to the floor.","Pull the ez barbell towards your lower chest, squeezing your shoulder blades together.","Pause for a moment at the top, then slowly lower the ez barbell back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Ez Bar Seated Close Grip Concentration Curl","gif":"Dsfz0Id.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"ez barbell","bodyParts":["upper arms"],"instructions":["Sit on a bench with your feet flat on the ground and hold an EZ barbell with an underhand grip.","Rest your elbow on the inside of your thigh, just above the knee.","Curl the barbell up towards your shoulder while keeping your upper arm stationary.","Squeeze your biceps at the top of the movement, then slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Lever Seated Reverse Fly","gif":"myfUsKf.gif","primaryMuscles":["delts"],"secondaryMuscles":["trapezius","rhomboids"],"equipment":"leverage machine","bodyParts":["shoulders"],"instructions":["Adjust the seat height and position yourself on the machine with your chest against the pad and your feet flat on the floor.","Grasp the handles with an overhand grip and keep your arms slightly bent.","Exhale and squeeze your shoulder blades together
