.","Push through your heels to stand back up, squeezing your glutes at the top.","Repeat for the desired number of repetitions."]},{"name":"Weighted Standing Curl","gif":"M5Y7GPg.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"weighted","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand, palms facing forward.","Keep your elbows close to your torso and exhale as you curl the weights up to shoulder level.","Pause for a moment at the top, then inhale as you slowly lower the weights back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Standing Hand Squeeze","gif":"bjqbauy.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","triceps"],"equipment":"weighted","bodyParts":["lower arms"],"instructions":["Stand with your feet shoulder-width apart and hold a weight in each hand.","Extend your arms straight in front of you, palms facing each other.","Squeeze your hands together as hard as you can, engaging your forearms.","Hold the squeeze for a few seconds, then release.","Repeat for the desired number of repetitions."]},{"name":"Weighted Straight Bar Dip","gif":"Ff18ItA.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"weighted","bodyParts":["chest"],"instructions":["Position yourself between parallel bars with your arms fully extended and your body straight.","Lower your body by bending your elbows until your upper arms are parallel to the ground.","Pause for a moment, then push yourself back up to the starting position by straightening your arms.","Repeat for the desired number of repetitions."]},{"name":"Weighted Stretch Lunge","gif":"13VW2VO.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"weighted","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart.","Take a step forward with your right foot, keeping your back straight.","Lower your body by bending your knees until your right thigh is parallel to the ground.","Push through your right heel to return to the starting position.","Repeat with your left leg.","Continue alternating legs for the desired number of repetitions."]},{"name":"Weighted Svend Press","gif":"I1OBLnn.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"weighted","bodyParts":["chest"],"instructions":["Stand with your feet shoulder-width apart and hold a weight plate in front of your chest with both hands.","Keep your elbows slightly bent and your palms facing each other.","Press the weight plate straight out in front of you, fully extending your arms.","Pause for a moment at the end of the movement, then slowly bring the weight plate back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Three Bench Dips","gif":"gtO1ErP.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"weighted","bodyParts":["upper arms"],"instructions":["Sit on the edge of a bench with your hands gripping the edge, fingers pointing forward.","Walk your feet forward, sliding your butt off the bench and supporting your weight with your arms.","Lower your body by bending your elbows, keeping your back close to the bench.","Pause for a moment at the bottom, then push yourself back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Weighted Tricep Dips","gif":"bZq4bwK.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"weighted","bodyParts":["upper arms"],"instructions":["Sit on the edge of a bench or chair with your hands gripping the edge next to your hips.","Slide your butt off the front of the bench with your legs extended in front of you.","Keep your back close to the bench and your elbows slightly bent.","Lower your body by bending your elbows until your upper arms are parallel to the floor.","Push yourself back up to the starting position by straightening your arms.","Repeat for the desired number of repetitions."]},{"name":"Weighted Triceps Dip On High Parallel Bars","gif":"K1vlode.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"weighted","bodyParts":["upper arms"],"instructions":["Position yourself between two parallel bars with your hands gripping the bars and your arms fully extended.","Bend your elbows and lower your body until your upper arms are parallel to the ground.","Pause for a moment, then push through your palms to straighten your arms and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Wheel Rollerout","gif":"NAgVB3t.gif","primaryMuscles":["abs"],"secondaryMuscles":["lower back"],"equipment":"wheel roller","bodyParts":["waist"],"instructions":["Kneel on the floor and place the wheel roller in front of you.","Place your hands on the handles of the wheel roller and extend your arms straight out in front of you.","Engage your core muscles and slowly roll the wheel forward, keeping your back straight and your abs tight.","Continue rolling forward until your body is fully extended and your arms are overhead.","Pause for a moment, then slowly roll the wheel back towards your knees, maintaining control and keeping your abs engaged.","Repeat for the desired number of repetitions."]},{"name":"Wheel Run","gif":"km2Ljzj.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Start in a plank position with your hands on the wheel and your body straight.","Engage your core and start rolling the wheel forward by extending your arms.","Continue rolling until your body is fully extended and your arms are overhead.","Reverse the movement by pulling the wheel back towards your body, using your core and arms.","Repeat for the desired number of repetitions."]},{"name":"Wide Grip Pull-Up","gif":"Qqi7bko.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Hang from a pull-up bar with your palms facing away from you and your hands wider than shoulder-width apart.","Engage your core and squeeze your shoulder blades together.","Pull your body up towards the bar until your chin is above the bar.","Lower your body back down to the starting position with control.","Repeat for the desired number of repetitions."]},{"name":"Wide Grip Rear Pull-Up","gif":"OYFhXVD.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Grab the pull-up bar with a wide overhand grip, hands slightly wider than shoulder-width apart.","Hang from the bar with your arms fully extended and your body straight.","Engage your back muscles and pull your body up towards the bar, leading with your chest.","Continue pulling until your chin is above the bar.","Pause for a moment at the top, then slowly lower your body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Wide Hand Push Up","gif":"JmMVpR3.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Start in a high plank position with your hands wider than shoulder-width apart.","Keep your body in a straight line from head to toe.","Lower your chest towards the ground by bending your elbows, keeping them close to your sides.","Push through your palms to extend your arms and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Wide-Grip Chest Dip On High Parallel Bars","gif":"O2K9Vb5.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"body weight","bodyParts":["chest"],"instructions":["Position yourself on the parallel bars with your arms fully extended and your body suspended in the air.","Lean forward slightly and lower your body by bending your elbows until your chest is just above the bars.","Pause for a moment, then push yourself back up to the starting position by straightening your arms.","Repeat for the desired number of repetitions."]},{"name":"Wind Sprints","gif":"Qoujh3Q.gif","primaryMuscles":["abs"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Find an open space or a track to perform the exercise.","Start by standing with your feet shoulder-width apart.","Begin running as fast as you can, pumping your arms and driving your knees up.","Continue sprinting for a specific distance or time period.","Rest and repeat for the desired number of repetitions."]},{"name":"World Greatest Stretch","gif":"DFGXwZr.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","quadriceps","calves"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Start in a lunge position with your right foot forward and your left foot back.","Place your hands on the ground on either side of your right foot.","Lower your left knee to the ground and extend your right leg, keeping your right foot flat on the ground.","Rotate your torso to the right, reaching your right arm up towards the ceiling.","Hold this position for a few seconds, then return to the starting position.","Switch sides and repeat the stretch with your left foot forward."]},{"name":"Wrist Circles","gif":"2zNKRUB.gif","primaryMuscles":["forearms"],"secondaryMuscles":["hands","wrists"],"equipment":"body weight","bodyParts":["lower arms"],"instructions":["Extend your arms straight out in front of you.","Make a fist with both hands.","Rotate your wrists in a circular motion, keeping your arms still.","Continue the wrist circles for the desired number of repetitions."]},{"name":"Wrist Rollerer","gif":"bd5b860.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","triceps"],"equipment":"weighted","bodyParts":["lower arms"],"instructions":["Attach a weight to one end of a rope or bar.","Hold the other end of the rope or bar with both hands, palms facing down.","Stand with your feet shoulder-width apart and your arms fully extended in front of you.","Slowly roll the weight up towards your hands by flexing your wrists.","Pause for a moment at the top, then slowly lower the weight back down to the starting position.","Repeat for the desired number of repetitions."]}]</script>
<script>
/* =========================================================
   SESSION — workout log (Gravitus-style)
   ========================================================= */
const KEY = 'session_app_v2', OLD_KEY = 'session_workouts_v1';
const GIF_BASE = 'https://raw.githubusercontent.com/mohamedatef90/exercise-library/main/gifs/';

/* ---------- utils ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const titleCase = s => (s || '').replace(/\b\w/g, c => c.toUpperCase());
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const epley = (w, r) => (w > 0 && r > 0) ? (r === 1 ? w : Math.round(w * (1 + r / 30))) : 0;
const clone = o => JSON.parse(JSON.stringify(o));
const fmtNum = n => (Math.round(n * 10) / 10).toLocaleString();
const fmtVol = v => v >= 10000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : Math.round(v).toLocaleString();
function fmtDate(ts, opt) { return new Date(ts).toLocaleDateString(undefined, opt || { weekday: 'short', month: 'short', day: 'numeric' }); }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
function fmtDur(ms) { const m = Math.max(0, Math.round(ms / 60000)); const h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; }
function clock(ms) { let s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60); s %= 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }
function mmss(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function autoName(ts) { const h = new Date(ts).getHours(); return (h < 5 ? 'Night' : h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : h < 21 ? 'Evening' : 'Night') + ' Workout'; }
function weekStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return +d; }
function toast(msg) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ---------- exercise database ---------- */
let EXDB = [], EXMAP = {};
try { EXDB = JSON.parse(document.getElementById('exdb-data').textContent) || []; } catch { EXDB = []; }
EXDB.forEach(e => EXMAP[e.name.toLowerCase()] = e);

const GROUPS = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Forearms', 'Core', 'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Cardio', 'Other'];
const MUSCLE_GROUP = { pectorals: 'Chest', 'serratus anterior': 'Chest', lats: 'Back', 'upper back': 'Back', traps: 'Back', spine: 'Back', 'levator scapulae': 'Back',
  delts: 'Shoulders', shoulders: 'Shoulders', biceps: 'Biceps', triceps: 'Triceps', forearms: 'Forearms', abs: 'Core', quads: 'Quads', hamstrings: 'Hamstrings',
  glutes: 'Glutes', adductors: 'Glutes', abductors: 'Glutes', calves: 'Calves', 'cardiovascular system': 'Cardio' };
const EQUIPMENT = ['Barbell', 'Dumbbell', 'Cable', 'Machine', 'Smith Machine', 'Body Weight', 'Band', 'Kettlebell', 'EZ Bar', 'Trap Bar', 'Other'];

/* ---------- state ---------- */
const defaults = () => ({ v: 2, settings: { unit: 'lb', rest: 90, autoRest: true, sound: true }, custom: [], routines: [], workouts: [], active: null });
let S = loadState();

function loadState() {
  let st = null;
  try { const raw = localStorage.getItem(KEY); if (raw) st = JSON.parse(raw); } catch {}
  if (st && st.v === 2) {
    const d = defaults();
    st = Object.assign(d, st); st.settings = Object.assign(defaults().settings, st.settings || {});
    ['custom', 'routines', 'workouts'].forEach(k => { if (!Array.isArray(st[k])) st[k] = []; });
    if (!st.migratedV1) migrateV1(st);
    return st;
  }
  st = defaults(); migrateV1(st); return st;
}
function migrateV1(st) {
  st.migratedV1 = true;
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY)) || [];
    old.forEach(w => {
      const start = w.started || +new Date((w.date || new Date().toISOString().slice(0, 10)) + 'T12:00:00');
      const obj = { id: w.id || uid(), name: autoName(start), start, end: start + (w.durationSec || 0) * 1000, notes: '',
        exercises: (w.exercises || []).map(e => ({ id: uid(), name: e.name, notes: '', rest: null, ss: null,
          sets: (e.sets || []).map(s => ({ id: uid(), type: 'n', weight: s.weight ?? '', reps: s.reps ?? '', done: w.status === 'done' && !!(s.weight || s.reps) })) })) };
      if (st.workouts.some(x => x.id === obj.id)) return;
      if (w.status === 'draft') { if (!st.active) st.active = obj; } else st.workouts.push(obj);
    });
  } catch {}
}
// make sure every exercise name you've ever logged exists in your library (fixes "custom exercises disappear")
function reconcileCustom() {
  const known = n => EXMAP[n.toLowerCase()] || S.custom.some(c => c.name.toLowerCase() === n.toLowerCase());
  const names = new Set();
  [...S.workouts, ...(S.active ? [S.active] : [])].forEach(w => w.exercises.forEach(e => names.add(e.name)));
  S.routines.forEach(r => r.exercises.forEach(e => names.add(e.name)));
  names.forEach(n => { if (n && !known(n)) S.custom.push({ id: uid(), name: n, group: 'Other', equipment: 'Other', created: Date.now() }); });
}
reconcileCustom();

let saveFailed = false;

/* ---------- exercise helpers ---------- */
function findEx(name) {
  if (!name) return null;
  const c = S.custom.find(c => c.name.toLowerCase() === name.toLowerCase());
  if (c) return { name: c.name, custom: true, id: c.id, group: c.group, equipment: c.equipment, primaryMuscles: [], secondaryMuscles: [], instructions: [], notes: c.notes || '' };
  return EXMAP[name.toLowerCase()] || null;
}
function groupOf(e) { if (!e) return 'Other'; if (e.group) return e.group; return MUSCLE_GROUP[(e.primaryMuscles || [])[0]] || 'Other'; }
function equipOf(e) { return e ? titleCase(e.equipment || '') : ''; }
function allExercises() {
  const arr = EXDB.map(e => ({ name: e.name, group: groupOf(e), equip: equipOf(e), custom: false }));
  S.custom.forEach(c => arr.push({ name: c.name, group: c.group || 'Other', equip: c.equipment || '', custom: true }));
  return arr.sort((a, b) => a.name.localeCompare(b.name));
}
const unit = () => S.settings.unit;
const isDone = s => s.done;
function setVol(s) { return num(s.weight) * num(s.reps); }
function exVol(ex, onlyDone = true) { return ex.sets.filter(s => !onlyDone || s.done).reduce((n, s) => n + setVol(s), 0); }
function wVol(w, onlyDone = true) { return w.exercises.reduce((n, e) => n + exVol(e, onlyDone), 0); }
function wSets(w) { return w.exercises.reduce((n, e) => n + e.sets.filter(isDone).length, 0); }
const finished = () => S.workouts.slice().sort((a, b) => b.start - a.start);

/* history for one exercise: [{w, ex}] newest first */
function exHistory(name, excludeId) {
  const out = []; const n = name.toLowerCase();
  finished().forEach(w => { if (w.id === excludeId) return; w.exercises.forEach(ex => { if (ex.name.toLowerCase() === n && ex.sets.some(isDone)) out.push({ w, ex }); }); });
  return out;
}
function bestE1(name, beforeTs, excludeId) {
  let best = 0; const n = name.toLowerCase();
  S.workouts.forEach(w => { if (w.id === excludeId) return; if (beforeTs != null && w.start >= beforeTs) return;
    w.exercises.forEach(ex => { if (ex.name.toLowerCase() !== n) return; ex.sets.forEach(s => { if (s.done && s.type !== 'w') best = Math.max(best, epley(num(s.weight), num(s.reps))); }); }); });
  return best;
}
/* PR count per finished workout (only beats of an existing record count) */
function prMap() {
  const best = {}, map = {};
  S.workouts.slice().sort((a, b) => a.start - b.start).forEach(w => {
    let prs = 0; const setPr = {};
    w.exercises.forEach(ex => { const k = ex.name.toLowerCase(); let top = 0, topId = null;
      ex.sets.forEach(s => { if (!s.done || s.type === 'w') return; const v = epley(num(s.weight), num(s.reps)); if (v > top) { top = v; topId = s.id; } });
      if (top > 0 && best[k] && top > best[k]) { prs++; setPr[topId] = true; }
      if (top > (best[k] || 0)) best[k] = top; });
    map[w.id] = { prs, setPr };
  });
  return map;
}

/* ---------- HOME (feed) ---------- */
function viewHome() {
  const all = finished();
  const now = Date.now(), ws = weekStart(now);
  const thisWeek = all.filter(w => w.start >= ws);
  let streak = 0; for (let k = 0; ; k++) { const a = ws - k * 7 * 864e5, b = a + 7 * 864e5; if (all.some(w => w.start >= a && w.start < b)) streak++; else if (k > 0) break; else continue; if (k > 520) break; }
  const prs = prMap();
  let html = `<div class="hdr"><h1>Home</h1></div>
  <div class="tiles">
    <div class="tile"><div class="v">${thisWeek.length}</div><div class="l">This week</div></div>
    <div class="tile"><div class="v">${fmtVol(thisWeek.reduce((n, w) => n + wVol(w), 0))}</div><div class="l">Week vol (${unit()})</div></div>
    <div class="tile"><div class="v">${streak}</div><div class="l">Week streak</div></div>
  </div>`;
  if (!S.active) html += `<button class="btn btn-primary" style="margin-top:14px" data-a="startEmpty">Start workout</button>`;
  html += `<div class="sec">Recent workouts${all.length ? `<span class="faint" style="text-transform:none;letter-spacing:0">${all.length} total</span>` : ''}</div>`;
  if (!all.length) return html + `<div class="empty"><div class="big">🏋️</div><div class="h">No workouts yet</div><div class="p">Finished workouts show up here with volume, duration, and PRs.</div></div>`;
  all.slice(0, 40).forEach(w => html += workoutCard(w, prs[w.id]));
  return html;
}
function workoutCard(w, pr) {
  const exs = w.exercises.filter(e => e.sets.some(isDone));
  let h = `<div class="card tapcard" data-a="openWorkout" data-id="${w.id}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div><div class="wk-title">${esc(w.name)}</div><div class="wk-date">${fmtDate(w.start, { weekday: 'long', month: 'short', day: 'numeric' })} · ${fmtTime(w.start)}</div></div>
      ${pr && pr.prs ? `<span class="prb">🏆 ${pr.prs} PR${pr.prs > 1 ? 's' : ''}</span>` : ''}</div>
    <div class="wk-stats"><div>Time<b>${fmtDur(w.end - w.start)}</b></div><div>Volume<b>${fmtVol(wVol(w))} ${unit()}</b></div><div>Sets<b>${wSets(w)}</b></div></div>`;
  exs.slice(0, 5).forEach(e => { const d = e.sets.filter(isDone); const best = d.reduce((m, s) => epley(num(s.weight), num(s.reps)) > epley(num(m.weight), num(m.reps)) ? s : m, d[0]);
    h += `<div class="wk-line"><span class="n">${d.length} × ${esc(e.name)}</span><span class="b">${best ? setLabel(best) : ''}</span></div>`; });
  if (exs.length > 5) h += `<div class="wk-line"><span class="n muted">+${exs.length - 5} more exercises</span></div>`;
  return h + `</div>`;
}
function setLabel(s) { const w = num(s.weight), r = num(s.reps); return w ? `${fmtNum(w)} ${unit()} × ${r}` : `${r} reps`; }

function viewExercises() {

    <div id="exList"></div>`;
}
function filterEx(q, g) {
  q = (q || '').trim().toLowerCase(); const words = q.split(/\s+/).filter(Boolean);
  const list = allExercises().filter(e => (g === 'All' || (g === 'Custom' ? e.custom : e.group === g)) && words.every(wd => e.name.toLowerCase().includes(wd)));
  if (!q) return list;
  const EQ = ['barbell', 'dumbbell', 'cable', 'leverage machine', 'machine', 'smith machine', 'body weight', 'ez barbell'];
  const score = e => { const n = e.name.toLowerCase(); let sc = 0;
    if (n === q) sc -= 1000; if (n.startsWith(q)) sc -= 300; if (n.includes(q)) sc -= 150; if (e.custom) sc -= 100;
    const eq = EQ.indexOf(e.equip.toLowerCase()); sc += eq < 0 ? 60 : eq * 6; return sc + n.length; };
  return list.map(e => [score(e), e]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
}
function exRow(e, sel) {
  return `<div class="exi ${sel ? 'on' : ''}" data-a="${sel === undefined ? 'openEx' : 'pickToggle'}" data-name="${esc(e.name)}">
    <div class="av">${esc(e.name[0] || '?')}</div><div style="min-width:0"><div class="nm">${esc(e.name)}${e.custom ? '<span class="cbadge">CUSTOM</span>' : ''}</div>

}
function renderExList() {

  } else if (seg === 'Charts') {
    const pts = hist.slice().reverse().map(({ w, ex }) => { const d = ex.sets.filter(s => s.done && s.type !== 'w');
      return { x: w.start, e1: Math.max(0, ...d.map(s => epley(num(s.weight), num(s.reps)))), mx: Math.max(0, ...d.map(s => num(s.weight))), vol: exVol(ex), reps: Math.max(0, ...d.map(s => num(s.reps))) }; });
    if (!pts.length) h += `<div class="empty" style="padding:30px">Log this exercise to see charts.</div>`;
    else {
      h += chartCard('Estimated 1RM', pts.map(p => ({ x: p.x, y: p.e1 })), unit());

      h += chartCard('Session volume', pts.map(p => ({ x: p.x, y: p.vol })), unit());

    else {
      const maxBy = f => sets.reduce((m, x) => f(x) > f(m) ? x : m, sets[0]);

function customForm(mode, existing, prefill) {
  const e = existing || { name: prefill || '', group: picker && picker.g && GROUPS.includes(picker.g) ? picker.g : 'Chest', equipment: 'Barbell' };
  const bd = sheet(`<div class="sh-h"><button class="lnk" data-a="closeSheet">Cancel</button><h3>${existing ? 'Edit exercise' : 'New exercise'}</h3><button class="lnk" data-a="saveCustom"><b>Save</b></button></div>
    <div class="fld" style="margin-top:10px"><label>Name</label><input class="txt" id="cName" value="${esc(e.name)}" placeholder="e.g. Cable Y-Raise" autocomplete="off"></div>
    <div class="fld"><label>Muscle group</label><select id="cGroup">${GROUPS.map(g => `<option ${g === e.group ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
    <div class="fld"><label>Equipment</label><select id="cEquip">${EQUIPMENT.map(g => `<option ${g === e.equipment ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
    <button class="btn btn-primary" data-a="saveCustom">${existing ? 'Save changes' : 'Save to my exercises'}</button>`);
  bd.dataset.mode = mode; bd.dataset.orig = existing ? existing.name : '';
  setTimeout(() => { const i = bd.querySelector('#cName'); i && !existing && i.focus(); }, 250);
}
function saveCustom(bd) {
  const name = bd.querySelector('#cName').value.trim().replace(/\s+/g, ' ');
  const group = bd.querySelector('#cGroup').value, equipment = bd.querySelector('#cEquip').value;
  const orig = bd.dataset.orig, mode = bd.dataset.mode;
  if (!name) { toast('Give it a name'); return; }
  const clash = (EXMAP[name.toLowerCase()] || S.custom.find(c => c.name.toLowerCase() === name.toLowerCase())) && name.toLowerCase() !== (orig || '').toLowerCase();
  if (clash && !orig) { // already exists — just use it
    bd.remove(); if (mode === 'pick' && picker && !picker.sel.includes(findEx(name).name)) { picker.sel.push(findEx(name).name); renderPicker(); }
    toast('That exercise already exists — selected it'); return;
  }
  if (clash) { toast('Another exercise already has that name'); return; }
  if (orig) {
    const c = S.custom.find(c => c.name === orig); Object.assign(c, { name, group, equipment });
    if (name !== orig) { // rename everywhere
      [...S.workouts, ...(S.active ? [S.active] : [])].forEach(w => w.exercises.forEach(e => { if (e.name === orig) e.name = name; }));
      S.routines.forEach(r => r.exercises.forEach(e => { if (e.name === orig) e.name = name; }));
      Object.values(stacks).forEach(st => st.forEach(p => { if (p.p === 'exercise' && p.name === orig) p.name = name; }));
    }
  } else S.custom.push({ id: uid(), name, group, equipment, created: Date.now() });
  save(); bd.remove(); toast(orig ? 'Exercise updated' : '✓ Saved to your exercises');
  if (mode === 'pick' && picker) { picker.sel.push(name); picker.q = ''; const q = document.querySelector('[data-in="pickq"]'); if (q) q.value = ''; renderPicker(); }
  else { closeAllSheets(); render(); }
}

/* ---------- exercise info sheet ---------- */
let infoSeg = { name: null, seg: 'About' };
function openInfo(name) {
  infoSeg = { name, seg: 'About' };
  const bd = sheet(`<div class="sh-h"><h3>${esc(name)}</h3><button class="lnk" data-a="closeSheet">Done</button></div><div id="infoBody">${exerciseDetailBody(name, 'About')}</div>`);
  bd.dataset.info = '1';
}

/* ---------- plate calculator ---------- */
function plateCalc(weight) {
  const lb = unit() === 'lb'; const bar = lb ? 45 : 20; const plates = lb ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25];
  const colors = { 45: '#ef4444', 25: '#3b82f6', 35: '#eab308', 10: '#22c55e', 5: '#e5e7eb', 2.5: '#9ca3af', 20: '#3b82f6', 15: '#eab308', 1.25: '#9ca3af' };
  const bd = sheet(`<div class="sh-h"><h3>Plate calculator</h3><button class="lnk" data-a="closeSheet">Done</button></div>
    <input class="txt" id="plW" inputmode="decimal" value="${weight || ''}" placeholder="Target weight (${unit()})" style="margin-top:8px;text-align:center;font-size:22px">
    <div class="muted" style="text-align:center;font-size:13px;margin-top:8px">${bar} ${unit()} bar · plates per side</div><div id="plOut"></div>`);
  const inp = bd.querySelector('#plW'), out = bd.querySelector('#plOut');
  const calc = () => {
    let side = (num(inp.value) - bar) / 2; const used = [];
    if (side < 0) { out.innerHTML = `<div class="empty" style="padding:20px">Less than the bar.</div>`; return; }
    plates.forEach(p => { while (side >= p - 1e-9) { used.push(p); side -= p; } });
    out.innerHTML = `<div class="plates"><div class="bar"></div>${used.map(p => `<div class="pl" style="background:${colors[p]};height:${40 + p / plates[0] * 70}px;width:${p >= 10 ? 22 : 16}px">${p}</div>`).join('')}</div>
      <div style="text-align:center;font-weight:800;font-size:16px">${used.length ? used.join(' + ') : 'Just the bar'}</div>
      ${side > 0.01 ? `<div class="muted" style="text-align:center;font-size:13px;margin-top:6px">${fmtNum(side * 2)} ${unit()} can't be loaded exactly</div>` : ''}`;
  };
  inp.addEventListener('input', calc); calc();
}

/* ---------- rest duration picker ---------- */
const REST_OPTS = [0, 30, 45, 60, 75, 90, 120, 150, 180, 240, 300];
function restPicker(title, current, action, extra = {}) {
  menu(title, REST_OPTS.map(s => [`${s ? mmss(s) : 'Off'}${s === current ? '  ✓' : ''}`, action, Object.assign({ s }, extra)]));
}

/* =========================================================
   ACTIONS (event delegation)
   ========================================================= */
const A = {
  back: () => { if (curPage() && curPage().p === 'routine') routineDraft = null; pop(); },
  closeSheet: () => { closeSheet(); if (!document.querySelector('[data-picker]')) picker = null; },
  resume: () => { showActive = true; render(); window.scrollTo(0, 0); },
  minimize: () => { showActive = false; render(); },
  startEmpty: () => beginWorkout(newWorkout()),
  startRoutine: d => { const r = S.routines.find(x => x.id === d.id); if (!r) return;
    const w = newWorkout(r.name, r.exercises.map(e => ({ id: uid(), name: e.name, notes: '', rest: e.rest ?? null, ss: e.ss || null, sets: e.sets.map(s => ({ id: uid(), type: s.type || 'n', weight: '', reps: '', done: false })) })));
    w.routineId = r.id; if (r.notes) w.notes = r.notes; beginWorkout(w); },
  repeatWorkout: d => { const o = S.workouts.find(x => x.id === d.id); if (!o) return;
    beginWorkout(newWorkout(o.name, o.exercises.map(e => ({ id: uid(), name: e.name, notes: '', rest: e.rest ?? null, ss: e.ss || null, sets: e.sets.map(s => ({ id: uid(), type: s.type || 'n', weight: '', reps: '', done: false })) })))); },
  openWorkout: d => push({ p: 'workout', id: d.id }),
  workoutMenu: d => menu('Workout', [['Edit workout', 'editWorkout', { id: d.id }, '', '✎'], ['Repeat workout', 'repeatWorkout', { id: d.id }, '', '↻'], ['Save as routine', 'saveAsRoutine', { id: d.id }, '', '＋'], ['Delete workout', 'deleteWorkout', { id: d.id }, 'dang', '🗑']]),
  editWorkout: d => { closeAllSheets(); if (S.active) { toast('Finish your current workout first'); return; }
    const o = S.workouts.find(x => x.id === d.id); const w = clone(o); w.editOf = o.id; w.id = uid(); w.rest = null; beginWorkout(w); },
  deleteWorkout: d => { closeAllSheets(); if (!confirm('Delete this workout? This can’t be undone.')) return; S.workouts = S.workouts.filter(w => w.id !== d.id); save(); stacks[tab] = stacks[tab].filter(p => p.id !== d.id); render(); toast('Workout deleted'); },
  saveAsRoutine: d => { const o = S.workouts.find(x => x.id === d.id); if (!o) return; closeAllSheets();
    const name = prompt('Routine name', o.name); if (name === null) return;
    S.routines.push({ id: uid(), name: name.trim() || o.name, notes: '', exercises: o.exercises.map(e => ({ name: e.name, rest: e.rest ?? null, ss: e.ss || null, sets: e.sets.map(s => ({ type: s.type || 'n', weight: s.weight, reps: s.reps })) })) });
    if (!o.routineId) o.routineId = S.routines[S.routines.length - 1].id;
    save(); toast('✓ Routine saved'); render(); },
  discard: () => { const w = S.active; if (!w) return;
    if (!w.editOf && w.exercises.some(e => e.sets.some(isDone)) && !confirm('Discard this workout? All logged sets will be lost.')) return;
    S.active = null; showActive = false; save(); render(); },
  finish: () => finishWorkout(),
  finishOpt: d => { closeSheet(); commitFinish(d.o); },

  /* exercises in workout */
  exInfo: d => openInfo(d.name),
  exSeg: (d, el) => { const bd = el.closest('.backdrop');
    if (bd && bd.dataset.info) { infoSeg.seg = d.seg; bd.querySelector('#infoBody').innerHTML = exerciseDetailBody(infoSeg.name, d.seg); }
    else { const p = curPage(); if (p) { p.seg = d.seg; render(); } } },
  exMenu: d => { const ex = exById(d.id); const w = S.active; const i = w.exercises.indexOf(ex);
    const items = [[ex.notes || ex.showNote ? 'Edit note' : 'Add note', 'exNote', { id: d.id }, '', '✎'], ['Rest timer', 'exRest', { id: d.id }, '', '⏱'], ['Replace exercise', 'exReplace', { id: d.id }, '', '⇄']];
    if (ex.ss) items.push(['Remove from superset', 'exUnSS', { id: d.id }, '', '⛓']); else if (i < w.exercises.length - 1) items.push(['Superset with next', 'exSS', { id: d.id }, '', '⛓']);
    if (i > 0) items.push(['Move up', 'exMove', { id: d.id, d: -1 }, '', '↑']);
    if (i < w.exercises.length - 1) items.push(['Move down', 'exMove', { id: d.id, d: 1 }, '', '↓']);
    items.push(['Plate calculator', 'plates', { id: d.id }, '', '◎'], ['Exercise info & history', 'exInfoFromMenu', { name: ex.name }, '', 'i'], ['Remove exercise', 'exRemove', { id: d.id }, 'dang', '✕']);
    menu(esc(ex.name), items); },
  exInfoFromMenu: d => { closeSheet(); openInfo(d.name); },
  exNote: d => { closeSheet(); const ex = exById(d.id); ex.showNote = true; render(); const t = document.querySelector(`[data-in="exnote"][data-id="${d.id}"]`); t && t.focus(); },
  exRest: d => { closeSheet(); const ex = exById(d.id); restPicker('Rest timer · ' + esc(ex.name), ex.rest ?? S.settings.rest, 'exRestSet', { id: d.id }); },
  exRestSet: d => { closeSheet(); const ex = exById(d.id); ex.rest = +d.s; save(); render(); },
  exReplace: d => { closeSheet(); openPicker('replace', d.id); },
  exSS: d => { closeSheet(); const w = S.active; const i = w.exercises.findIndex(e => e.id === d.id); const a = w.exercises[i], b = w.exercises[i + 1]; const id = b.ss || uid(); a.ss = id; b.ss = id; save(); render(); },
  exUnSS: d => { closeSheet(); const ex = exById(d.id); const id = ex.ss; ex.ss = null; const rest = S.active.exercises.filter(e => e.ss === id); if (rest.length === 1) rest[0].ss = null; save(); render(); },
  exMove: d => { closeSheet(); const w = S.active; const i = w.exercises.findIndex(e => e.id === d.id), j = i + +d.d; [w.exercises[i], w.exercises[j]] = [w.exercises[j], w.exercises[i]]; save(); render(); },
  exRemove: d => { closeSheet(); const ex = exById(d.id); if (ex.sets.some(isDone) && !confirm(`Remove ${ex.name} and its logged sets?`)) return; S.active.exercises = S.active.exercises.filter(e => e.id !== d.id); save(); render(); },
  plates: d => { closeSheet(); const ex = exById(d.id); const s = ex && [...ex.sets].reverse().find(s => num(s.weight)); plateCalc(s ? num(s.weight) : ''); },

  /* sets */
  addSet: d => { const ex = exById(d.id); ex.sets.push(newSet()); save(); render(); },
  setType: d => { menu('Set type', [['Warm-up set', 'setTypeSet', { id: d.id, i: d.i, t: 'w' }, '', '<span style="color:var(--warm)">W</span>'], ['Normal set', 'setTypeSet', { id: d.id, i: d.i, t: 'n' }, '', '1'],
      ['Drop set', 'setTypeSet', { id: d.id, i: d.i, t: 'd' }, '', '<span style="color:var(--drop)">D</span>'], ['Failure set', 'setTypeSet', { id: d.id, i: d.i, t: 'f' }, '', '<span style="color:var(--danger)">F</span>'],
      ['Delete set', 'setDelete', { id: d.id, i: d.i }, 'dang', '✕']]); },
  setTypeSet: d => { closeSheet(); exById(d.id).sets[+d.i].type = d.t; save(); render(); },
  setDelete: d => { closeSheet(); const ex = exById(d.id); ex.sets.splice(+d.i, 1); save(); render(); },
  usePrev: d => { const ex = exById(d.id); const p = previousSets(ex.name)[+d.i]; if (!p) return; const s = ex.sets[+d.i]; s.weight = p.weight; s.reps = p.reps; save(); render(); },
  toggleDone: d => { const ex = exById(d.id); const s = ex.sets[+d.i];
    if (!s.done) {
      const row = document.querySelector(`[data-in="w"][data-id="${d.id}"][data-i="${d.i}"]`), rrow = document.querySelector(`[data-in="r"][data-id="${d.id}"][data-i="${d.i}"]`);
      if (s.weight === '' && row && row.placeholder) s.weight = row.placeholder;
      if (s.reps === '' && rrow && rrow.placeholder) s.reps = rrow.placeholder;
      if (!num(s.reps)) { toast('Enter reps first'); rrow && rrow.focus(); save(); return; }
      s.done = true;
      const w = S.active; const xi = w.exercises.indexOf(ex); const nextInSS = ex.ss && w.exercises[xi + 1] && w.exercises[xi + 1].ss === ex.ss;
      if (S.settings.autoRest && !nextInSS) { const sec = ex.rest ?? S.settings.rest; if (sec) { save(); startRest(sec); return; } }
    } else s.done = false;
    save(); render(); },
  restAdj: d => { const r = S.active.rest; if (!r) return; r.end += +d.d * 1000; r.total = Math.max(r.total + (+d.d), 1); if (r.end <= Date.now()) S.active.rest = null; save(); render(); },
  restSkip: () => { S.active.rest = null; save(); render(); },

  /* picker */
  pickFor: d => openPicker(d.mode),
  pickToggle: d => { if (!picker) { return; }
    if (picker.mode === 'replace') { const ex = exById(picker.target); ex.name = d.name; ex.showNote = false; closeSheet(); picker = null; save(); render(); return; }
    const i = picker.sel.indexOf(d.name); if (i >= 0) picker.sel.splice(i, 1); else picker.sel.push(d.name); renderPicker(); },
  pickGroup: d => { picker.g = d.g; renderPicker(); document.getElementById('pickList').scrollTop = 0; },
  pickConfirm: d => pickConfirm(!!d.ss),
  newCustom: d => customForm(d.mode, null, d.prefill || (d.mode === 'pick' && picker ? picker.q : '')),
  saveCustom: (d, el) => saveCustom(el.closest('.backdrop')),
  editCustom: d => { const c = S.custom.find(c => c.name === d.name); if (c) customForm('lib', c); },
  deleteCustom: d => { const used = S.workouts.some(w => w.exercises.some(e => e.name === d.name)) || S.routines.some(r => r.exercises.some(e => e.name === d.name));
    if (!confirm(used ? `“${d.name}” is used in your workouts/routines. Delete it from your library anyway? (Logged history is kept.)` : `Delete “${d.name}”?`)) return;
    S.custom = S.custom.filter(c => c.name !== d.name); save(); closeAllSheets(); if (curPage() && curPage().p === 'exercise') stacks[tab].pop(); render(); toast('Exercise deleted');
    if (used) setTimeout(() => { reconcileCustom(); save(); }, 0); },

  /* exercises tab */
  exGroup: d => { exFilter.g = d.g; render(); },
  openEx: d => push({ p: 'exercise', name: d.name, seg: 'About' }),

  /* routines */
  newRoutine: () => { routineDraft = { id: uid(), name: '', notes: '', exercises: [], isNew: true }; tab = 'workouts'; push({ p: 'routine' }); },
  routineMenu: d => menu(esc(S.routines.find(r => r.id === d.id).name), [['Edit routine', 'editRoutine', { id: d.id }, '', '✎'], ['Duplicate', 'dupRoutine', { id: d.id }, '', '⧉'], ['Delete routine', 'deleteRoutine', { id: d.id }, 'dang', '🗑']]),
  editRoutine: d => { closeSheet(); routineDraft = clone(S.routines.find(r => r.id === d.id)); push({ p: 'routine' }); },
  dupRoutine: d => { closeSheet(); const r = clone(S.routines.find(r => r.id === d.id)); r.id = uid(); r.name += ' (copy)'; S.routines.push(r); save(); render(); },
  deleteRoutine: d => { closeAllSheets(); if (!confirm('Delete this routine?')) return; S.routines = S.routines.filter(r => r.id !== d.id); save(); if (curPage() && curPage().p === 'routine') { routineDraft = null; stacks[tab].pop(); } render(); },
  saveRoutine: () => { const r = routineDraft; if (!r.name.trim()) { toast('Name your routine'); document.querySelector('[data-in="rname"]').focus(); return; }
    const isNew = r.isNew; delete r.isNew; r.name = r.name.trim();
    if (isNew) S.routines.push(r); else S.routines = S.routines.map(x => x.id === r.id ? r : x);
    routineDraft = null; save(); stacks[tab].pop(); render(); toast('✓ Routine saved'); },
  rSets: d => { const e = routineDraft.exercises[+d.i]; if (+d.d > 0) e.sets.push({ type: 'n', weight: '', reps: '' }); else if (e.sets.length > 1) e.sets.pop(); render(); },
  rExMenu: d => { const i = +d.i, n = routineDraft.exercises.length; const items = [];
    items.push(['Rest timer', 'rRest', { i }, '', '⏱']);
    if (i > 0) items.push(['Move up', 'rMove', { i, d: -1 }, '', '↑']); if (i < n - 1) items.push(['Move down', 'rMove', { i, d: 1 }, '', '↓']);
    items.push(['Remove', 'rRemove', { i }, 'dang', '✕']); menu(esc(routineDraft.exercises[i].name), items); },
  rRest: d => { closeSheet(); const e = routineDraft.exercises[+d.i]; restPicker('Rest timer', e.rest ?? S.settings.rest, 'rRestSet', { i: d.i }); },
  rRestSet: d => { closeSheet(); routineDraft.exercises[+d.i].rest = +d.s; render(); },
  rMove: d => { closeSheet(); const a = routineDraft.exercises, i = +d.i, j = i + +d.d; [a[i], a[j]] = [a[j], a[i]]; render(); },
  rRemove: d => { closeSheet(); routineDraft.exercises.splice(+d.i, 1); render(); },

  /* profile */
  toggleUnit: () => { S.settings.unit = unit() === 'lb' ? 'kg' : 'lb'; save(); render(); },
  defaultRest: () => restPicker('Default rest timer', S.settings.rest, 'defaultRestSet'),
  defaultRestSet: d => { closeSheet(); S.settings.rest = +d.s; save(); render(); },
  toggleSetting: d => { S.settings[d.k] = !S.settings[d.k]; save(); render(); },
  exportData: () => { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `session-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); },
  importData: () => { const f = document.getElementById('importFile'); f.value = ''; f.onchange = () => { const file = f.files[0]; if (!file) return; const rd = new FileReader();
      rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || d.v !== 2 || !Array.isArray(d.workouts)) throw 0;
          if (!confirm(`Import ${d.workouts.length} workouts, ${(d.routines || []).length} routines, ${(d.custom || []).length} custom exercises? This replaces what's on this device.`)) return;
          S = Object.assign(defaults(), d); S.settings = Object.assign(defaults().settings, d.settings || {}); reconcileCustom(); save(); render(); toast('✓ Backup imported'); } catch { toast('That file isn’t a Session backup'); } };
      rd.readAsText(file); }; f.click(); },
  resetAll: () => { if (!confirm('Delete ALL workouts, routines, and custom exercises on this device?')) return; if (!confirm('Really? Export a backup first if unsure.')) return;
    S = defaults(); save(); showActive = false; render(); toast('All data deleted'); }
};

document.addEventListener('click', e => {
  unlockAudio();
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fn = A[t.dataset.a]; if (fn) { e.preventDefault(); fn(t.dataset, t, e); }
});
document.addEventListener('input', e => {
  const t = e.target; const k = t.dataset && t.dataset.in; if (!k) return;
  const v = t.value;
  if (k === 'w' || k === 'r') { const ex = exById(t.dataset.id); if (!ex) return; ex.sets[+t.dataset.i][k === 'w' ? 'weight' : 'reps'] = v.replace(/[^\d.,]/g, ''); save(); }
  else if (k === 'wname') { S.active.name = v; save(); }
  else if (k === 'wnotes') { S.active.notes = v; autoGrow(t); save(); }
  else if (k === 'exnote') { exById(t.dataset.id).notes = v; autoGrow(t); save(); }
  else if (k === 'rname') routineDraft.name = v;
  else if (k === 'rnotes') routineDraft.notes = v;
  else if (k === 'exq') { exFilter.q = v; renderExList(); }
  else if (k === 'pickq') { picker.q = v; renderPicker(); }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.in; if (k === 'w' || k === 'r') { const sum = document.querySelector('.aw-sum'); if (sum && S.active) sum.firstElementChild.innerHTML = `<b>${fmtVol(wVol(S.active))}</b> ${unit()}`; } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('sin')) { e.target.blur(); } });
function autoGrow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  if (tab === b.dataset.tab && !showActive) { stacks[tab] = []; if (curPage() == null) routineDraft = null; }
  tab = b.dataset.tab; showActive = false; render(); window.scrollTo(0, 0);
});
render();
</script>
