p the rope with an overhand grip, palms facing each other.","Keep your back straight and lean slightly back.","Pull the rope down towards your sides, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement.","Slowly release the tension and allow the rope to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Lateral Pulldown With V-Bar","gif":"4c9BhzB.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Sit down on the cable pulldown machine and grab the v-bar attachment with an overhand grip.","Adjust the knee pad so that your thighs are secured under it.","Keep your back straight and lean back slightly.","Pull the v-bar down towards your upper chest while keeping your elbows close to your body.","Squeeze your back muscles at the bottom of the movement.","Slowly return the v-bar to the starting position and repeat for the desired number of repetitions."]},{"name":"Cable Lateral Raise","gif":"goJ6ezq.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","triceps"],"equipment":"cable","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and grasp the cable handles with an overhand grip.","Keep your arms straight and your core engaged.","Raise your arms out to the sides until they are parallel to the floor.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Low Fly","gif":"FVmZVhk.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Attach the handles to the low pulleys of a cable machine and select an appropriate weight.","Stand in the middle of the machine with your feet shoulder-width apart and a slight bend in your knees.","Grasp the handles with an overhand grip and extend your arms out to the sides, keeping a slight bend in your elbows.","Maintaining control, slowly bring your arms forward in a sweeping motion, crossing them in front of your body.","Pause for a moment at the peak of the movement, feeling the stretch in your chest muscles.","Reverse the motion and slowly return your arms to the starting position, keeping tension on your chest muscles throughout.","Repeat for the desired number of repetitions."]},{"name":"Cable Low Seated Row","gif":"hvV79Si.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Sit on the machine with your feet flat on the footrests and your knees slightly bent.","Grasp the handles with an overhand grip, palms facing down.","Keep your back straight and lean slightly forward, maintaining a slight bend in your elbows.","Pull the handles towards your body, squeezing your shoulder blades together.","Pause for a moment at the peak of the movement, then slowly release the handles back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Lying Bicep Curl","gif":"otqIxU4.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a straight bar to a low pulley cable machine.","Lie face up on a flat bench with your feet flat on the ground.","Grasp the bar with an underhand grip, hands shoulder-width apart.","Extend your arms fully, keeping your elbows close to your sides.","Keeping your upper arms stationary, exhale and curl the bar up towards your shoulders.","Pause for a moment at the top, squeezing your biceps.","Inhale and slowly lower the bar back to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Cable Lying Close-Grip Curl","gif":"61GrD55.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"ins oulders"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a rope handle to a low pulley cable machine.","Lie down on a flat bench facing up, with your head towards the cable machine.","Grasp the rope handle with both hands, palms facing each other, and extend your arms straight up over your chest.","Keeping your upper arms stationary, slowly lower the rope handle towards your forehead by bending your elbows.","Pause for a moment at the bottom, then extend your arms back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Middle Fly","gif":"xLYSdtg.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Attach cables to both sides of a cable machine at chest height.","Stand in the center of the machine with one foot slightly in front of the other.","Grasp the handles with an overhand grip and extend your arms out to the sides.","Keep a slight bend in your elbows and maintain a slight forward lean.","Engage your chest muscles and bring your arms forward in a sweeping motion.","Pause for a moment at the center, then slowly return your arms back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable One Arm Bent Over Row","gif":"EIsE3u8.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Stand facing a cable machine with your feet shoulder-width apart.","Bend your knees slightly and hinge forward at the hips, keeping your back straight.","Grasp the cable handle with one hand, palm facing inward, and extend your arm fully.","Pull the cable handle towards your body, keeping your elbow close to your side, until your hand reaches your lower chest.","Pause for a moment, then slowly extend your arm back to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Cable rm Incline Fly On Exercise Ball","gif":"P14Dz9D.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Sit on an exercise ball with your feet flat on the ground and your back against an incline bench.","Hold a cable handle in one hand with your arm extended and palm facing inward.","Keeping a slight bend in your elbow, slowly lower your arm out to the side until your hand is in line with your shoulder.","Pause for a moment, then squeeze your chest muscles to bring your arm back to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Cable One Arm Incline Press","gif":"GKEH6jj.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Adjust the cable machine to a low pulley position.","Sit on an incline bench facing away from the cable machine.","Grasp the handle with one hand and bring it up to shoulder height.","Position your feet firmly on the ground and maintain a stable position.","Press the handle forward and upward, extending your arm fully.","Pause for a moment at the top, then slowly lower the handle back to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Cable One Arm Incline Press On Exercise Ball","gif":"6t00BsF.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Sit on an exercise ball with your feet flat on the ground and your back resting against an incline bench.","Hold a cable handle in one hand and position your arm at a 90-degree angle with your elbow bent.","Press the cable handle forward and upward, extending your arm fully.","Pause for a moment at the top, then slowly lower the cable handle back to the starting position.","Repeat for the desired number of repetitions, then switch to the other arm."]},{"name":"Cable One Arm Lateral Bent-Over","gif":"dB07vDu.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","trapezius"],"equipment":"cable","bodyParts":["chest"],"instructions":["Stand with your feet shoulder-width apart, facing a cable machine.","Grasp the handle with one hand and step back to create tension on the cable.","Bend forward at the waist, keeping your back straight and your core engaged.","Extend your arm out to the side, parallel to the ground, with a slight bend in your elbow.","Slowly bring your arm back to the starting position, maintaining control throughout the movement.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Cable One Arm Lateral Raise","gif":"wEulIzp.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","triceps"],"equipment":"cable","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, facing the cable machine.","Hold the cable handle with one hand, palm facing down, and stand far enough away from the machine so that there is tension on the cable.","Keep your arm straight and slowly raise it out to the side until it is parallel to the ground.","Pause for a moment at the top, then slowly lower your arm back down to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Cable One Arm Preacher Curl","gif":"eHBlPsa.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Adjust the cable machine so that the preacher curl pad is at chest height.","Stand facing the cable machine with your feet shoulder-width apart.","Grasp the cable handle with an underhand grip and position your upper arm against the preacher curl pad.","Keep your back straight and your core engaged.","Slowly curl the cable handle towards your shoulder, keeping your upper arm against the pad.","Pause for a moment at the top of the movement, squeezing your biceps.","Slowly lower the cable handle back to the starting position.","Repeat for the desired number of repetitions.","Switch arms and repeat the exercise."]},{"name":"Cable One Arm Press On Exercise Ball","gif":"MKIelrR.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Sit on an exercise ball with your feet flat on the ground and your back straight.","Hold a cable handle in one hand and position your arm at chest height, elbow bent.","Place your other hand on your hip for stability.","Press the cable handle forward, extending your arm fully.","Pause for a moment, then slowly return to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Cable One Arm Pulldown","gif":"U5INZY6.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a single handle to a high pulley cable machine.","Stand facing the machine with your feet shoulder-width apart.","Grasp the handle with an overhand grip and extend your arm fully.","Keep your back straight and your core engaged.","Pull the handle down towards your side while keeping your elbow close to your body.","Pause for a moment at the bottom of the movement, squeezing your lat muscle.","Slowly release the handle back to the starting position.","Repeat for the desired number of repetitions.","Switch sides and repeat the exercise with the other arm."]},{"name":"Cable One Arm Reverse Preacher Curl","gif":"ZXnjcOQ.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Adjust the cable machine so that the pulley is at the lowest position.","Stand facing the cable machine with your feet shoulder-width apart.","Grasp the cable handle with an underhand grip and position your upper arm against the preacher bench pad.","Keep your back straight and your core engaged throughout the exercise.","Slowly curl your forearm towards your bicep, keeping your upper arm stationary against the pad.","Pause for a moment at the top of the movement, squeezing your bicep.","Slowly lower the cable handle back to the starting position.","Repeat for the desired number of repetitions.","Switch arms and repeat the exercise."]},{"name":"Cable One Arm Straight Back High Row (Kneeling)","gif":"WrYPP2g.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","shoulders"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a handle to a cable machine at waist height.","Kneel down facing the cable machine and grab the handle with one hand.","Keep your back straight and your core engaged.","Pull the handle towards your chest, squeezing your shoulder blades together.","Pause for a moment at the top of the movement.","Slowly release the handle back to the starting position.","Repeat for the desired number of repetitions.","Switch sides and repeat the exercise with the other arm."]},{"name":"Cable One Arm Tricep Pushdown","gif":"qRZ5S1N.gif","primaryMuscles":["triceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Stand facing a cable machine with a straight bar attachment at chest height.","Grasp the bar with an overhand grip and step back to create tension in the cable.","Position your feet shoulder-width apart and slightly bend your knees.","Keep your back straight and core engaged throughout the exercise.","Start with your arm fully extended and perpendicular to the floor.","Keeping your upper arm stationary, exhale and push the bar down until your arm is fully extended.","Pause for a moment, then inhale and slowly return to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Cable Overhead Curl","gif":"wDUqY2u.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a straight bar to a high pulley cable machine.","Stand facing the machine with your feet shoulder-width apart.","Grasp the bar with an underhand grip, hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary.","Exhale and curl the bar down towards your forehead, keeping your upper arms stationary.","Pause for a moment at the bottom of the movement, squeezing your biceps.","Inhale and slowly return the bar to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Cable Overhead Curl On Exercise Ball","gif":"ioTf098.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Sit on an exercise ball and hold the cable handle with an underhand grip.","Extend your arms fully overhead, keeping your elbows close to your ears.","Slowly curl the cable down towards your forehead, keeping your upper arms stationary.","Pause for a moment at the bottom of the movement, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Overhead Triceps Extension (Rope Attachment)","gif":"2IxROQ1.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a rope to a cable machine at a high position.","Stand facing away from the machine with your feet shoulder-width apart.","Grasp the rope with both hands, palms facing each other, and bring your hands above your head.","Keep your upper arms close to your head and your elbows pointing forward.","Slowly lower the rope behind your head by bending your elbows.","Pause for a moment, then extend your arms back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Palm Rotational Row","gif":"OmQ8w0p.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a handle to a cable machine at waist height.","Stand facing the machine with your feet shoulder-width apart.","Grasp the handle with an overhand grip, palms facing down.","Step back to create tension on the cable, keeping your back straight and knees slightly bent.","Pull the handle towards your body, rotating your palms to face upwards as you do so.","Squeeze your shoulder blades together at the end of the movement.","Slowly release the handle back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Preacher Curl","gif":"P2lNrGL.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Adjust the cable machine so that the preacher curl pad is at chest height.","Sit on the preacher curl bench and place your upper arms on the pad, gripping the cable attachment with an underhand grip.","Keep your back straight and your elbows tucked in at your sides.","Slowly curl the cable attachment up towards your shoulders, squeezing your biceps at the top of the movement.","Pause for a moment, then slowly lower the cable attachment back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Press On Exercise Ball","gif":"vAwm6rK.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Sit on an exercise ball with your feet flat on the ground and your knees at a 90-degree angle.","Hold the cable handles at chest height with your palms facing down and your elbows bent.","Engage your core and press the cable handles forward until your arms are fully extended.","Pause for a moment, then slowly release the tension and bring the cable handles back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Pull Through (With Rope)","gif":"OM46QHm.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"equipment":"cable","bodyParts":["upper legs"],"instructions":["Stand facing away from the cable machine with your feet shoulder-width apart.","Grab the rope attachment with both hands and step forward, creating tension in the cable.","Bend at the hips and lower your upper body until it is parallel to the ground, keeping your back straight.","Engage your glutes and hamstrings to pull your body back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Pulldown","gif":"RVwzP10.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Adjust the cable pulldown machine so that the seat is at a comfortable height and the knee pad is secured.","Sit on the seat with your back straight and your feet flat on the ground.","Grasp the cable bar with an overhand grip, slightly wider than shoulder-width apart.","Lean back slightly and engage your core.","Pull the cable bar down towards your chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the bar back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Pulldown (Pro Lat Bar)","gif":"qdRxqCj.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Adjust the seat height so that your thighs are parallel to the ground and your feet are flat on the floor.","Grasp the lat bar with an overhand grip, slightly wider than shoulder-width apart.","Sit down and lean back slightly, keeping your chest up and your back straight.","Pull the bar down towards your chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the bar back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Pulldown Bicep Curl","gif":"QTXKWPh.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a straight bar to the cable machine at the highest setting.","Stand facing the machine with your feet shoulder-width apart.","Grasp the bar with an underhand grip, hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary.","Exhale and slowly curl the bar down towards your thighs, keeping your wrists straight.","Pause for a moment at the bottom of the movement, squeezing your biceps.","Inhale and slowly return the bar to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Cable Pushdown","gif":"3ZflifB.gif","primaryMuscles":["triceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a straight bar to a high pulley cable machine.","Stand facing the machine with your feet shoulder-width apart and a slight bend in your knees.","Grasp the bar with an overhand grip, hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary.","Exhale and push the bar down until your elbows are fully extended.","Pause for a moment, then inhale and slowly return the bar to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Pushdown (Straight Arm) V. 2","gif":"PskORrA.gif","primaryMuscles":["lats"],"secondaryMuscles":["triceps","shoulders"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a straight bar to a high pulley cable machine.","Stand facing the machine with your feet shoulder-width apart and a slight bend in your knees.","Grasp the bar with an overhand grip, keeping your arms straight and your palms facing down.","Engage your core and keep your back straight as you exhale and push the bar down towards your thighs.","Pause for a moment at the bottom, then slowly return the bar to the star ","bodyParts":["waist"],"instructions":["Attach a cable to a low pulley and lie down facing up on a mat.","Hold the cable with both hands and extend your arms straight up towards the ceiling.","Bend your knees and lift your legs up, bringing your thighs towards your chest.","While keeping your upper body stable, curl your pelvis up towards your chest, lifting your hips off the mat.","Pause for a moment at the top, then slowly lower your hips back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Reverse Curl","gif":"eOG0r6v.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a straight bar to a low pulley cable machine.","Stand facing the machine with your feet shoulder-width apart and your knees slightly bent.","Grasp the bar with an underhand grip, hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary throughout the exercise.","Exhale and curl the bar up towards your shoulders, contracting your biceps.","Pause for a moment at the top, squeezing your biceps.","Inhale and slowly lower the bar back to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Cable Reverse Grip Triceps Pushdown (Sz-Bar) (With Arm Blaster)","gif":"ThKP69G.gif","primaryMuscles":["triceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a straight bar to the cable machine at the highest setting.","Stand facing the cable machine with your feet shoulder-width apart.","Grasp the bar with an underhand grip, palms facing up, and your hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary throughout the exercise.","Engage your triceps and slowly push the bar down until your arms are fully extended.","Pause for a moment at the bottom, then slowly return the bar to the starti t, squeezing your shoulder blades together.","Pause for a moment at the peak of the movement, then slowly release the tension and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Rope Elevated Seated Row","gif":"c8oybX6.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"cable","bodyParts":["back"],"instructions":["Sit on the elevated seat facing the cable machine.","Grab the cable rope handles with an overhand grip, palms facing each other.","Keep your back straight and lean slightly back, maintaining a slight bend in your knees.","Pull the cable towards your body by retracting your shoulder blades and squeezing your back muscles.","Pause for a moment at the fully contracted position.","Slowly release the tension and extend your arms back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Rope Extension Incline Bench Row","gif":"MgKwAAo.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","shoulders"],"equipment":"cable","bodyParts":["back"],"instructions":["Set up an incline bench at a 45-degree angle and attach a cable machine to the low pulley.","Attach a rope handle to the cable machine and sit on the incline bench facing the machine.","Grab the rope handle with an overhand grip and lean forward, keeping your back straight.","Extend your arms fully, pulling the rope towards your upper chest while keeping your elbows close to your body.","Squeeze your shoulder blades together at the end of the movement.","Slowly release the tension and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Rope Hammer Preacher Curl","gif":"PcPe0P5.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a rope attachment to a low pulley cable machine.","Stand facing the machine with your feet shoulder-width apart.","G
