<title>Session</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700&display=swap');
  :root{
    --bg:#0e0f13; --bg2:#14161c; --surface:#191c24; --surface2:#1f2330; --line:#262a36;
    --text:#f4f5f8; --muted:#8b909e; --faint:#565c6b;
    --accent:#c6f24e; --accent2:#14b866; --pr:#ffcf4d; --danger:#ff5d6c; --warm:#f7a53b; --drop:#7aa2ff;
    --radius:16px; --navh:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior-y:none;background:var(--bg)}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 12px)}
  body.no-nav{padding-bottom:0}
  body.has-mini{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 90px)}
  button{font-family:inherit;color:inherit}
  input,select,textarea{font-family:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}

  /* header */
  .hdr{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:14px;gap:10px}
  .hdr h1{font-size:30px;font-weight:900;letter-spacing:-.8px}
  .hdr .lnk{background:none;border:none;color:var(--accent);font-weight:700;font-size:15px;cursor:pointer;padding:8px 0}
  .hdr .back{display:flex;align-items:center;gap:2px}
  .hdr.small h1{font-size:18px;letter-spacing:-.3px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr.small .lnk{min-width:64px}
  .hdr.small .lnk.r{text-align:right}
  .sec{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center}
  .sec .lnk{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;text-transform:none;letter-spacing:0;cursor:pointer}

  /* buttons */
  .btn{border:none;border-radius:13px;cursor:pointer;font-weight:700;font-size:15px;padding:14px 16px;letter-spacing:-.2px;transition:transform .08s,filter .15s}
  .btn:active{transform:scale(.975)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1400;width:100%;box-shadow:0 6px 20px rgba(198,242,78,.2)}
  .btn-ghost{background:var(--surface2);color:var(--text)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}

  /* bottom nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(14,15,19,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);

  /* mini active-workout bar */

    background:linear-gradient(135deg,rgba(198,242,78,.16),rgba(20,184,102,.12)),var(--surface);border:1px solid rgba(198,242,78,.35);

  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;animation:blink 1.4s infinite;vertical-align:middle}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ACTIVE WORKOUT */
  .aw-top{position:sticky;top:0;z-index:30;background:rgba(14,15,19,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    margin:calc(-12px - env(safe-area-inset-top)) -16px 12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
  .aw-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .aw-bar .ic{background:var(--surface2);border:none;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
  .aw-bar .tm{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .aw-bar .fin{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1400;border:none;border-radius:10px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer}
  .aw-name{width:100%;background:transparent;border:none;color:var(--text);font-size:24px;font-weight:900;letter-spacing:-.6px;padding:6px 0 2px}
  .aw-name:focus{outline:none}
  .aw-sum{display:flex;gap:16px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}

  .aw-notes,.ex-note{width:100%;background:transparent;border:none;color:var(--muted);font-size:14px;resize:none;padding:4px 0}
  .aw-notes:focus,.ex-note:focus{outline:none;color:var(--text)}

  .ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px;margin-bottom:12px;position:relative}
  .ex.ss{border-left:3px solid var(--accent)}

  .ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .ex-t{font-size:16px;font-weight:800;color:var(--accent);letter-spacing:-.2px;cursor:pointer;line-height:1.25}
  .ex-m{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}

  .sg{display:grid;grid-template-columns:34px 1fr 64px 64px 40px;gap:6px;align-items:center}

  .sg.h span{font-size:10px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.7px;text-align:center}
  .srow{padding:3px 0;border-radius:10px;transition:background .15s}

  .prev{text-align:center;font-size:13px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sin{width:100%;height:34px;background:var(--surface2);border:1px solid transparent;color:var(--text);border-radius:9px;font-size:16px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;padding:0 4px}
  .sin:focus{outline:none;border-color:var(--accent)}
  .sin::placeholder{color:var(--faint)}
  .srow.done .sin{background:transparent}
  .chk{height:34px;border-radius:9px;border:none;background:var(--surface2);display:grid;place-items:center;cursor:pointer;color:var(--faint)}
  .srow.done .chk{background:var(--accent2);color:#04150b}
  .chk svg{width:18px;height:18px}
  .spr{grid-column:2/-1;font-size:11px;font-weight:800;color:var(--pr);padding:0 0 2px 4px}
  .addset{width:100%;background:var(--surface2);border:none;color:var(--text);border-radius:10px;padding:9px;font-weight:700;font-size:13px;cursor:pointer;margin-top:8px}

  /* rest bar */
  .restbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
  .restbar .in{max-width:760px;margin:0 auto}
  .restbar .prog{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:10px}
  .restbar .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s linear}
  .restbar .ctl{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .restbar .tm{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;min-width:80px;text-align:center}
  .restbar .lab{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center}
  body.resting .wrap{padding-bottom:110px}

  /* sheets */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--bg2);width:100%;max-width:760px;max-height:90vh;border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));
    overflow-y:auto;border:1px solid var(--line);border-bottom:none;animation:slideup .24s cubic-bezier(.2,.8,.2,1)}
  .sheet.full{height:90vh;display:flex;flex-direction:column;overflow:hidden}
  .sheet.full .scroll{flex:1;overflow-y:auto;margin:0 -16px;padding:0 16px}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 12px}
  .sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
  .sh-h h3{font-size:19px;font-weight:800;letter-spacing:-.3px}
  .sh-h .lnk{background:none;border:none;color:var(--accent);font-weight:700;font-size:15px;cursor:pointer}
  .menu button{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:none;border-bottom:1px solid var(--line);padding:15px 14px;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
  .menu button:first-child{border-radius:13px 13px 0 0}
  .menu button:last-child{border-radius:0 0 13px 13px;border-bottom:none}
  .menu button:only-child{border-radius:13px}
  .menu button.dang{color:var(--danger)}
  .menu button .k{width:22px;text-align:center;font-weight:900}
  .menu{margin-bottom:10px}

  .search{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px}
  .search:focus{outline:none;border-color:var(--accent)}
  .fld{margin-bottom:14px}

  .chipbar{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .chipbar::-webkit-scrollbar{display:none}
  .fchip{flex-shrink:0;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:700;padding:7px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
  .fchip.on{background:var(--accent);color:#0b1400;border-color:var(--accent)}

  .grp{font-size:12px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:16px 2px 6px}
  .exi{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}

  .exi .av{width:42px;height:42px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-weight:900;color:var(--accent);font-size:15px;flex-shrink:0}

  .exi .tg{font-size:12px;color:var(--faint);margin-top:2px}

  .stepper span{min-width:48px;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
  .txt{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font-size:16px;font-weight:700}
  .txt:focus{outline:none;border-color:var(--accent)}

  .set-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}

  .set-item .val{color:var(--muted);font-weight:600}
  .set-item.dang{color:var(--danger)}
  .tog{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
  .tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
  .tog.on{background:var(--accent2)} .tog.on::after{left:21px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:14px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
  .bars .b i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px}
  .bars .b i.z{background:var(--line)}
  .bars .b span{font-size:9px;color:var(--faint);font-weight:700}
  .mbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;font-weight:600}
  .mbar .nm{width:92px;color:var(--muted)}
  .mbar .tr{flex:1;height:8px;background:var(--surface2);border-radius:5px;overflow:hidden}
  .mbar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
  .mbar .ct{width:28px;text-align:right;font-variant-numeric:tabular-nums}
  .plates{display:flex;align-items:center;justify-content:center;gap:3px;margin:18px 0;min-height:110px}
  .plates .bar{width:40px;height:10px;background:#9aa0ad;border-radius:2px}
  .plates .pl{border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:900;color:#0e0f13;writing-mode:vertical-rl}
  .toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 84px);white-space:nowrap;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);color:var(--text);
    padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:100;animation:fade .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
</style>

":"Band Bench Press","gif":"khlHMqs.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"band","bodyParts":["chest"],"instructions":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Grasp the band handles with an overhand grip, slightly wider than shoulder-width apart.","Extend your arms fully, pushing the bands away from your chest.","Slowly lower the bands back down to your chest, keeping your elbows at a 90-degree angle.","Repeat for the desired number of repetitions."]},{"name":"Band Bent-Over Hip Extension","gif":"wSScovH.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"equipment":"band","bodyParts":["upper legs"],"instructions":["Attach the band to a sturdy anchor point at ankle height.","Stand facing away from the anchor point with your feet shoulder-width apart.","Step back to create tension in the band, keeping your knees slightly bent.","Hinge at the hips and lean forward, maintaining a neutral spine.","Extend your right leg straight back, squeezing your glutes at the top.","Lower your right leg back down and repeat with the left leg.","Continue alternating legs for the desired number of repetitions."]},{"name":"Band Bicycle Crunch","gif":"tZkGYZ9.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors","obliques"],"equipment":"band","bodyParts":["waist"],"instructions":["Lie flat on your back with your hands behind your head and your knees bent.","Lift your feet off the ground and bring your right knee towards your chest while simultaneously twisting your torso to bring your left elbow towards your right knee.","Straighten your right leg while bringing your left knee towards your chest and twisting your torso to bring your right elbow towards your left knee.","Continue alternating the twisting motion, as if you are pedaling a bicycle, while keeping your core engaged throughout the movement.","Repeat for the desired number of repetitions."]},{"name":"Band Close-Grip Pulldown","gif":"DptumMx.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"band","bodyParts":["back"],"instructions":["Attach the band to a high anchor point, such as a pull-up bar or sturdy beam.","Stand facing the anchor point and grab the band with an underhand grip, hands shoulder-width apart.","Step back to create tension in the band, keeping your feet hip-width apart.","Engage your core and keep your back straight as you pull the band down towards your chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the band back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Band Close-Grip Push-Up","gif":"ufaxB52.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"band","bodyParts":["upper arms"],"instructions":["Place a band around your upper arms, just above the elbows.","Assume a push-up position with your hands directly under your shoulders and your body in a straight line from head to heels.","Bend your elbows and lower your chest towards the ground, keeping your elbows close to your sides.","Push through your palms to extend your arms and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Band Concentration Curl","gif":"kmVVAfu.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"band","bodyParts":["upper arms"],"instructions":["Sit on a bench or chair with your legs spread apart and your feet flat on the ground.","Hold one end of the band in your hand and step on the other end with your foot on the same side.","Lean forward slightly and rest your elbow on the inside of your thigh, just above the knee.","With your palm facing up, slowly curl your hand towards your shoulder, keeping your upper arm stationary.","Pause for a moment at the top, then slowly lower your hand back down to the star aight out in front of you, pushing the band away from your body.","Hold the extended position for a few seconds, focusing on maintaining tension in your core.","Slowly bring your hands back to your chest, resisting the pull of the band.","Repeat for the desired number of repetitions."]},{"name":"Band Jack Knife Sit-Up","gif":"KCBKjma.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"band","bodyParts":["waist"],"instructions":["Lie flat on your back with your legs straight and your arms extended overhead, holding the band.","Engage your abs and lift your legs and upper body simultaneously, bringing your hands towards your feet.","Pause for a moment at the top, then slowly lower your legs and upper body back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Band Kneeling One Arm Pulldown","gif":"pmnrOp0.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","rhomboids"],"equipment":"band","bodyParts":["back"],"instructions":["Attach the band to a sturdy anchor point above your head.","Kneel down and hold the band with one hand, palm facing down.","Extend your arm fully overhead, keeping your elbow slightly bent.","Engage your lat muscles and pull the band down towards your side, bringing your elbow towards your ribcage.","Pause for a moment at the bottom, then slowly release the tension and return to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Band Kneeling Twisting Crunch","gif":"225x2Vd.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"band","bodyParts":["waist"],"instructions":["Attach the band to a sturdy anchor point at waist height.","Kneel down facing away from the anchor point and hold the band with both hands, keeping your elbows bent and close to your sides.","Engage your abs and slowly twist your torso to one side, bringing your hands towards your opposite hip.","Pause for a moment, then slowly return t ch the band to a sturdy anchor point at waist height.","Stand facing away from the anchor point with your feet shoulder-width apart.","Hold the band with both hands and bring it up to your chest, keeping your elbows bent and close to your body.","Engage your abs and slowly crunch forward, bringing your chest towards your knees.","Pause for a moment at the top of the crunch, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Band Standing Rear Delt Row","gif":"tc5dYrf.gif","primaryMuscles":["delts"],"secondaryMuscles":["trapezius","rhomboids","biceps"],"equipment":"band","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and place the band under your feet.","Hold the band handles with your palms facing each other and your arms extended in front of you.","Bend your knees slightly and hinge forward at the hips, keeping your back straight.","Pull the band towards your chest, squeezing your shoulder blades together.","Pause for a moment at the top, then slowly release the tension and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Band Standing Twisting Crunch","gif":"euq4pwp.gif","primaryMuscles":["abs"],"secondaryMuscles":["obliques"],"equipment":"band","bodyParts":["waist"],"instructions":["Stand with your feet shoulder-width apart and place the band around your upper back, crossing it in front of your chest.","Hold the ends of the band with your hands, keeping your elbows bent and close to your sides.","Engage your abs and twist your torso to one side, bringing your elbow towards the opposite knee.","Pause for a moment, then return to the starting position.","Repeat on the other side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Band Step-Up","gif":"d5bTEPV.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"band","bodyParts":["upper legs"],"instruction  number of repetitions."]},{"name":"Band Wrist Curl","gif":"vUTfFHw.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","triceps"],"equipment":"band","bodyParts":["lower arms"],"instructions":["Sit on a bench or chair with your feet flat on the ground.","Hold the band with both hands, palms facing up, and rest your forearms on your thighs.","Slowly curl your wrists upward, squeezing your forearms.","Pause for a moment at the top, then slowly lower your wrists back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Band Y-Raise","gif":"aHDy5O5.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","rhomboids"],"equipment":"band","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and hold the band in front of your thighs with your palms facing inwards.","Keep your arms straight and lift them up and out to the sides, forming a 'Y' shape with your body.","Squeeze your shoulder blades together at the top of the movement.","Slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Alternate Biceps Curl","gif":"Yza7XrQ.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Stand up straight with your feet shoulder-width apart and hold a barbell in each hand, palms facing forward.","Keep your upper arms stationary and exhale as you curl the weights while contracting your biceps.","Continue to raise the barbells until your biceps are fully contracted and the barbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale as you slowly begin to lower the barbells back to the starting position.","Repeat for the desired number of repetitions, alternating arms."]},{"name":"Barbell Bench Front Squat","gif":"Y7YcmIJ.gif","primaryMuscles":["quads"],"secondaryMuscles":["hamstrings","glutes","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Start by standing with your feet shoulder-width apart and the barbell resting on your upper chest, just below your collarbone.","Hold the barbell with an overhand grip, keeping your elbows up and your upper arms parallel to the ground.","Lower your body down into a squat position by bending at the knees and hips, keeping your back straight and your chest up.","Pause for a moment at the bottom of the squat, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Bench Press","gif":"EIeI8Vf.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"barbell","bodyParts":["chest"],"instructions":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Grasp the barbell with an overhand grip slightly wider than shoulder-width apart.","Lift the barbell off the rack and hold it directly above your chest with your arms fully extended.","Lower the barbell slowly towards your chest, keeping your elbows tucked in.","Pause for a moment when the barbell touches your chest.","Push the barbell back up to the starting position by extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Barbell Bench Squat","gif":"W9pFVv1.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Set up a barbell on a squat rack at chest height.","Stand facing away from the rack, with your feet shoulder-width apart.","Bend your knees and lower your body down into a squat position, keeping your back straight and chest up.","Grasp the barbell with an overhand grip, slightly wider than shoulder-width apart.","Lift the barbell off the rack and step back, ensuring your feet are still shoulder-width apart.","Lower your body down into a squat, keeping your knees in line with your toes.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Bent Arm Pullover","gif":"cA9FuWG.gif","primaryMuscles":["lats"],"secondaryMuscles":["triceps","chest"],"equipment":"barbell","bodyParts":["back"],"instructions":["Lie flat on a bench with your head at one end and your feet on the floor.","Hold a barbell with a shoulder-width grip and extend your arms straight above your chest.","Lower the barbell behind your head while keeping your arms slightly bent.","Pause for a moment, then raise the barbell back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Bent Over Row","gif":"eZyBC3j.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"barbell","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and knees slightly bent.","Bend forward at the hips while keeping your back straight and chest up.","Grasp the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Pull the barbell towards your lower chest by retracting your shoulder blades and squeezing your back muscles.","Pause for a moment at the top, then slowly lower the barbell back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Biceps Curl (With Arm Blaster)","gif":"aee2Fcj.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Stand up straight with your feet shoulder-width apart and hold a barbell with an underhand grip, palms facing up.","Place your upper arms against the arm blaster, keeping your elbows close to your torso.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the barbell until your biceps are fully contracted and the bar is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the barbell back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Clean And Press","gif":"SGY8Zui.gif","primaryMuscles":["quads"],"secondaryMuscles":["hamstrings","glutes","shoulders","triceps"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and the barbell on the floor in front of you.","Bend your knees and hinge at the hips to lower down and grip the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Drive through your heels and extend your hips and knees to lift the barbell off the floor, keeping it close to your body.","As the barbell reaches your thighs, explosively extend your hips, shrug your shoulders, and pull the barbell up towards your chest.","As the barbell reaches chest height, quickly drop under it and catch it at shoulder level, with your elbows pointing forward and your palms facing up.","From the catch position, press the barbell overhead by extending your arms and pushing the barbell straight up.","Lower the barbell back down to the starting position and repeat for the desired number of repetitions."]},{"name":"Barbell Clean-Grip Front Squat","gif":"qi996YS.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Start by standing with your feet shoulder-width apart and the barbell resting on your upper chest, with your elbows pointing forward.","Lower your body by bending your knees and pushing your hips back, as if you are sitting back into a chair.","Keep your chest up and your back straight as you lower down, making sure your knees do not go past your toes.","Continue lowering until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to stand back up, extending your hips and knees.","Repeat for the desired number of repetitions."]},{"name":"Barbell Close-Grip Bench Press","gif":"J6Dx1Mu.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Grasp the barbell with a close grip, slightly narrower than shoulder-width apart.","Unrack the barbell and lower it slowly towards your chest, keeping your elbows close to your body.","Pause for a moment when the barbell touches your chest.","Push the barbell back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Barbell Curl","gif":"25GPyDY.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Stand up straight with your feet shoulder-width apart and hold a barbell with an underhand grip, palms facing forward.","Keep your elbows close to your torso and exhale as you curl the weights while contracting your biceps.","Continue to raise the bar until your biceps are fully contracted and the bar is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale as you slowly begin to lower the bar back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Deadlift","gif":"ila4NZS.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and the barbell on the ground in front of you.","Bend your knees and hinge at the hips to lower your torso and grip the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Keep your back straight and chest lifted as you drive through your heels to lift the barbell off the ground, extending your hips and knees.","As you stand up straight, squeeze your glutes and keep your core engaged.","Lower the barbell back down to the ground by bending at the hips and knees, keeping your back straight.","Repeat for the desired number of repetitions."]},{"name":"Barbell Decline Bench Press","gif":"GrO65fd.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"barbell","bodyParts":["chest"],"instructions":["Lie on a decline bench with your feet secured and your head lower than your hips.","Grasp the barbell with an overhand grip slightly wider than shoulder-width apart.","Unrack the barbell and lower it slowly towards your chest, keeping your elbows tucked in.","Pause for a moment at the bottom, then push the barbell back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Decline Bent Arm Pullover","gif":"hMEptv0.gif","primaryMuscles":["lats"],"secondaryMuscles":["triceps","chest"],"equipment":"barbell","bodyParts":["back"],"instructions":["Lie down on a decline bench with your head lower than your hips and your feet secured.","Hold a barbell with a pronated grip (palms facing away from you) and extend your arms straight above your chest.","Lower the barbell behind your head in a controlled manner, keeping your arms slightly bent.","Pause for a moment, then raise the barbell back to the starting position by contracting your lats.","Repeat for the desired number of repetitions."]},{"name":"Barbell Decline Close Grip To Skull Press","gif":"LMGXZn8.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Lie on a decline bench with your head lower than your feet and hold a barbell with a close grip.","Lower the barbell towards your forehead by bending your elbows, keeping your upper arms stationary.","Pause for a moment, then extend your arms to press the barbell back up to the eps"],"secondaryMuscles":["forearms"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Stand with your feet shoulder-width apart and hold a barbell with an underhand grip, palms facing up.","Let the barbell hang at arm's length in front of your thighs.","Keeping your upper arms stationary, curl the barbell up towards your chest by contracting your biceps.","Pause for a moment at the top, then slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Floor Calf Raise","gif":"2IHEa2T.gif","primaryMuscles":["calves"],"secondaryMuscles":["hamstrings"],"equipment":"barbell","bodyParts":["lower legs"],"instructions":["Place a barbell on the floor in front of you.","Stand with the balls of your feet on the edge of the barbell, with your heels hanging off.","Hold onto a stable object for balance if needed.","Raise your heels as high as possible, using your calves to lift your body.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Front Chest Squat","gif":"IeTIEqg.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Start by standing with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell in front of your chest with your hands shoulder-width apart, elbows pointing forward.","Engage your core and keep your chest up as you lower your body down into a squat position, pushing your hips back and bending your knees.","Lower until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Front Raise","gif":"b2Uoz54.gif","primaryMuscles":["delts"],"secondaryMuscles":["biceps","triceps"],"equipment":"barbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and hold a barbell in front of your thighs with an overhand grip.","Keep your arms straight and lift the barbell forward and upward until it reaches shoulder level.","Pause for a moment at the top, then slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Front Raise And Pullover","gif":"33AzZeV.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","triceps"],"equipment":"barbell","bodyParts":["chest"],"instructions":["Stand with your feet shoulder-width apart and hold a barbell with an overhand grip, palms facing down.","Keep your arms straight and raise the barbell in front of you until it reaches shoulder height.","Pause for a moment at the top, then slowly lower the barbell back down to the starting position.","Next, lower the barbell behind your head, keeping your arms straight.","Pause for a moment at the bottom, then raise the barbell back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Front Squat","gif":"zG0zs85.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Start by standing with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell in front of your shoulders, resting it on your collarbone and shoulders.","Engage your core and keep your chest up as you lower your body down into a squat position, pushing your hips back and bending your knees.","Lower until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Full Squat","gif":"qXTaZnJ.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell across your upper back, resting it on your traps or rear delts.","Engage your core and keep your chest up as you begin to lower your body down.","Bend at the knees and hips, pushing your hips back and down as if sitting into a chair.","Lower yourself until your thighs are parallel to the ground or slightly below.","Keep your knees in line with your toes and your weight in your heels.","Drive through your heels to stand back up, extending your hips and knees.","Repeat for the desired number of repetitions."]},{"name":"Barbell Full Squat (Back Pov)","gif":"DhMl549.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell across your upper back, resting it on your traps or rear delts.","Engage your core and keep your chest up as you begin to lower your body down.","Bend at the knees and hips, pushing your hips back and down as if sitting into a chair.","Lower your body until your thighs are parallel to the ground or slightly below.","Keep your knees in line with your toes and your weight in your heels.","Drive through your heels to stand back up, extending your hips and knees.","Repeat for the desired number of repetitions."]},{"name":"Barbell Full Squat (Side Pov)","gif":"iYzB0Cz.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell across your upper back, resting it on your traps or rear delts.","Engage your core and keep your chest up as you begin to lower your body down."," nt":"barbell","bodyParts":["upper legs"],"instructions":["Start by sitting on the edge of a bench with your upper back resting against it and your feet flat on the ground, hip-width apart.","Place a barbell across your hips, holding it securely with both hands.","Engage your glutes and core muscles, then press through your heels to lift your hips off the bench, creating a straight line from your knees to your shoulders.","Pause for a moment at the top, squeezing your glutes.","Slowly lower your hips back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Good Morning","gif":"XlZ4lAC.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["lower back"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Start by standing with your feet shoulder-width apart and the barbell resting on your upper back.","Keeping your back straight and your core engaged, hinge forward at the hips, pushing your buttocks back as if you were trying to touch the wall behind you with your glutes.","Lower your torso until it is parallel to the ground, feeling a stretch in your hamstrings.","Pause for a moment, then return to the starting position by squeezing your glutes and pushing your hips forward.","Repeat for the desired number of repetitions."]},{"name":"Barbell Guillotine Bench Press","gif":"GXoaSgn.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"barbell","bodyParts":["chest"],"instructions":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Grasp the barbell with an overhand grip, slightly wider than shoulder-width apart.","Lower the barbell slowly towards your neck, keeping your elbows pointed outwards.","Pause for a moment when the barbell is just above your neck.","Push the barbell back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Barbell Hack Squat","gif":"5VCj6iH.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Start by standing with your feet shoulder-width apart and your toes slightly turned out.","Hold the barbell behind your legs, resting it on your upper thighs.","Lower your body by bending at the knees and hips, keeping your back straight and your chest up.","Continue lowering until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell High Bar Squat","gif":"Gnfo4FM.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, toes slightly turned out.","Place the barbell on your upper back, resting it on your traps.","Engage your core and keep your chest up as you begin to squat down, pushing your hips back and bending your knees.","Lower yourself until your thighs are parallel to the ground, or as low as you can comfortably go.","Drive through your heels to stand back up, extending your hips and knees.","Repeat for the desired number of repetitions."]},{"name":"Barbell Incline Bench Press","gif":"3TZduzM.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"barbell","bodyParts":["chest"],"instructions":["Set up an incline bench at a 45-degree angle.","Lie down on the bench with your feet flat on the ground.","Grasp the barbell with an overhand grip, slightly wider than shoulder-width apart.","Unrack the barbell and lower it slowly towards your chest, keeping your elbows at a 45-degree angle.","Pause for a moment at the bottom, then push the barbell back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Incline f","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Start by standing with your feet shoulder-width apart, holding a barbell across your upper back.","Lower your body into a squat position by bending your knees and pushing your hips back.","Once you reach the bottom of the squat, explode upwards by jumping off the ground.","As you jump, extend your hips, knees, and ankles, pushing through your toes.","Land softly back into the squat position and immediately repeat the movement for the desired number of repetitions."]},{"name":"Barbell Lateral Lunge","gif":"py1HSzx.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a barbell across your upper back.","Take a big step to the side with your right foot, keeping your left foot planted.","Bend your right knee and lower your body down into a lunge position, keeping your left leg straight.","Push off with your right foot and return to the starting position.","Repeat on the other side, stepping with your left foot."]},{"name":"Barbell Low Bar Squat","gif":"bTpEUcm.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and the barbell resting on your upper back.","Keeping your chest up and core engaged, slowly lower your body by bending your knees and pushing your hips back.","Continue lowering until your thighs are parallel to the ground or slightly below.","Pause for a moment, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Lunge","gif":"t8iSghb.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves"],"equipment":"barbe ","bodyParts":["upper arms"],"instructions":["Lie flat on a bench with your feet flat on the ground and your head at the end of the bench.","Grasp the barbell with a close grip, hands shoulder-width apart, palms facing up.","Extend your arms fully, lifting the barbell above your chest.","Keeping your upper arms stationary, slowly lower the barbell towards your forehead by bending your elbows.","Pause for a moment at the bottom, then extend your arms back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Lying Extension","gif":"EMpUwRI.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Lie flat on a bench with your feet flat on the ground and your head at the end of the bench.","Hold the barbell with an overhand grip, hands shoulder-width apart, and extend your arms straight up over your chest.","Keeping your upper arms stationary, slowly lower the barbell towards your forehead by bending your elbows.","Pause for a moment, then extend your arms back up to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Lying Lifting (On Hip)","gif":"SNFfUff.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Lie flat on your back on a bench with your feet flat on the ground and your knees bent.","Hold the barbell with an overhand grip and position it on your hips.","Engaging your glutes, lift your hips off the bench until your body forms a straight line from your knees to your shoulders.","Pause for a moment at the top, then slowly lower your hips back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Lying Preacher Curl","gif":"SYJ4Bkt.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Sit on a pre ","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and toes pointing slightly outward.","Hold the barbell across your upper back, resting it on your traps or rear delts.","Engage your core and keep your chest up as you slowly lower your body by bending your knees and pushing your hips back.","Continue lowering until your thighs are parallel to the ground or slightly below.","Pause for a moment, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell One Arm Bent Over Row","gif":"Jsgsc27.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"barbell","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart, knees slightly bent, and hold a barbell with one hand using an overhand grip.","Bend forward at the hips, keeping your back straight and your head in a neutral position.","Pull the barbell up towards your chest, keeping your elbow close to your body and squeezing your shoulder blades together.","Lower the barbell back down to the starting position in a controlled manner.","Repeat for the desired number of repetitions, then switch to the other arm."]},{"name":"Barbell One Arm Floor Press","gif":"vtusOWT.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Lie flat on your back on the floor with your knees bent and feet flat on the ground.","Hold the barbell with one hand, palm facing up, and extend your arm straight up over your chest.","Slowly lower the barbell towards your chest, keeping your elbow close to your body.","Pause for a moment at the bottom, then push the barbell back up to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Barbell One Arm Side Deadlift","gif":"2DxtqHL.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps","lower back"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a barbell in one hand with an overhand grip.","Keep your back straight and your core engaged.","Bend at the hips and lower the barbell towards the outside of your leg, keeping your arm straight and your chest up.","Lower the barbell as far as you can while maintaining good form.","Pause for a moment, then slowly return to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Barbell One Arm Snatch","gif":"xHKN2s8.gif","primaryMuscles":["delts"],"secondaryMuscles":["traps","forearms","core"],"equipment":"barbell","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart, toes pointing slightly outwards.","Hold the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Bend your knees and lower your hips into a squat position, keeping your back straight and chest up.","Explosively extend your hips, knees, and ankles, driving the barbell upwards.","As the barbell reaches chest level, pull it upwards with your arm, keeping it close to your body.","Rotate your elbow under the barbell and extend your arm fully overhead, locking out your elbow.","Lower the barbell back down to the starting position in a controlled manner.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Barbell One Leg Squat","gif":"uKyN64F.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and hold a barbell across your upper back.","Lift one foot off the ground and extend it forward, keeping it parallel to the ground.","Bend your standing leg and lower your body down as if sitting back into a chair, keeping your chest up and your back straight.","Lower yourself until your thigh is parallel to the ground, then push through your heel to return to the starting position.","Repeat for the desired number of repetitions, then switch legs and repeat."]},{"name":"Barbell Overhead Squat","gif":"gfk9kD4.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and toes slightly turned out.","Hold the barbell with a wide grip, positioning it overhead with your arms fully extended.","Engage your core and lower your body down into a squat position, keeping your chest up and knees tracking over your toes.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Palms Down Wrist Curl Over A Bench","gif":"yzYH9pI.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","brachialis"],"equipment":"barbell","bodyParts":["lower arms"],"instructions":["Sit on a bench with your feet flat on the ground and your forearms resting on your thighs, palms facing down.","Hold a barbell with an overhand grip, hands shoulder-width apart.","Lower the barbell towards the ground by flexing your wrists, keeping your forearms stationary.","Pause for a moment at the bottom, then slowly raise the barbell back up by extending your wrists.","Repeat for the desired number of repetitions."]},{"name":"Barbell Palms Up Wrist Curl Over A Bench","gif":"SJAA2IQ.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","shoulders"],"equipment":"barbell","bodyParts":["lower arms"],"instructions":["Sit on a bench with your feet flat on the ground and hold a barbell with an underhand grip, palms facing up.","Rest your forearms on the bench, allowing your wrists to hang off the edge.","Keeping your forearms stationary, exhale and curl your wrists upwards as far as possible.","Hold the contracted position for a brief pause, then inhale and slowly lower the barbell back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Pendlay Row","gif":"r0z6xzQ.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"barbell","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and your knees slightly bent.","Bend forward at the hips, keeping your back straight and your chest up.","Grasp the barbell with an overhand grip, slightly wider than shoulder-width apart.","Pull the barbell towards your upper abdomen, squeezing your shoulder blades together.","Lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Pin Presses","gif":"bndCa3Q.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Set up a barbell on a power rack at chest height.","Stand facing the barbell and position yourself underneath it, with your feet shoulder-width apart.","Grip the barbell with an overhand grip, slightly wider than shoulder-width apart.","Lift the barbell off the rack and hold it directly above your chest, with your arms fully extended.","Lower the barbell down towards your chest, keeping your elbows tucked in close to your body.","Pause for a moment when the barbell touches your chest.","Push the barbell back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."]},{"name":"Barbell Preacher Curl","gif":"qOgPVf6.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"barbell","bodyParts":["upper arms"],"instructions":["Sit on a preacher bench with your upper arms resting on the pad and your chest against the support.","Grasp the barbell with an underhand grip, slightly wider than shoulder-width apart.","Keeping your upper arms stationary, exhale and curl the barbell up towards your shoulders.","Paus e.","Continue alternating sides for the desired number of repetitions."]},{"name":"Barbell Side Split Squat","gif":"W31mMjd.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet wider than shoulder-width apart, toes pointing slightly outward.","Hold a barbell across your upper back, resting it on your traps.","Engage your core and keep your chest up as you lower your body down into a squat position, bending at the knees and hips.","As you lower, push your knees out to the sides and keep your weight on your heels.","Lower until your thighs are parallel to the ground, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Side Split Squat V. 2","gif":"HUEqZ1y.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet wider than shoulder-width apart, toes pointing slightly outwards.","Hold a barbell across your upper back, resting it on your shoulders.","Take a big step to the side with your right foot, keeping your left foot planted.","Bend your right knee and lower your body down into a squat position, keeping your chest up and your back straight.","Push through your right heel to return to the starting position.","Repeat on the other side, stepping out with your left foot.","Continue alternating sides for the desired number of repetitions."]},{"name":"Barbell Single Leg Deadlift","gif":"gEyURal.gif","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet hip-width apart, holding a barbell in front of your thighs with an overhand grip.","Shift your weight onto your left foot and lift your right foot slightly off the ground.","Hinge forward at the hips, keeping your back straight and your right leg extended behind you for balance.","Lower the barbell towards the ground, keeping it close to your body and your left leg slightly bent.","Pause for a moment at the bottom, then engage your glutes and hamstrings to lift your torso back up to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Barbell Single Leg Split Squat","gif":"gGNQmVt.gif","primaryMuscles":["quads"],"secondaryMuscles":["glutes","hamstrings","calves"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart, holding a barbell across your upper back.","Take a large step forward with one leg, keeping your torso upright.","Lower your body by bending your front knee and hip, while keeping your back leg straight.","Continue lowering until your front thigh is parallel to the ground.","Pause for a moment, then push through your front heel to return to the starting position.","Repeat for the desired number of repetitions, then switch legs."]},{"name":"Barbell Sitted Alternate Leg Raise","gif":"G7xoEzr.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors"],"equipment":"barbell","bodyParts":["waist"],"instructions":["Sit on a bench with your back straight and hold a barbell across your thighs.","Keeping your legs straight, lift one leg up as high as possible while keeping the other leg on the ground.","Lower the raised leg back down and repeat with the other leg.","Continue alternating legs for the desired number of repetitions."]},{"name":"Barbell Sitted Alternate Leg Raise (Female)","gif":"BCs0G2F.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors","quadriceps"],"equipment":"barbell","bodyParts":["waist"],"instructions":["Sit on a bench with your back straight and hold a barbell across your thighs.","Place your hands on the sides of the bench for support.","Keeping your legs straight, lift one leg up as high as possible while keeping it parallel to ulder-width apart.","Let the barbell hang in front of your thighs, arms fully extended.","Keeping your back straight, exhale and lift the barbell straight up towards your chin, leading with your elbows.","Pause for a moment at the top, then inhale and slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Wrist Curl","gif":"82LxxkW.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","brachialis"],"equipment":"barbell","bodyParts":["lower arms"],"instructions":["Sit on a bench with your feet flat on the ground and your forearms resting on your thighs, holding a barbell with an underhand grip.","Allow the barbell to roll down to your fingertips, keeping your wrists straight.","Slowly curl the barbell up towards your forearms by flexing your wrists.","Pause for a moment at the top, then slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Wrist Curl V. 2","gif":"6kSxYnw.gif","primaryMuscles":["forearms"],"secondaryMuscles":["biceps","brachialis"],"equipment":"barbell","bodyParts":["lower arms"],"instructions":["Sit on a bench with your feet flat on the ground and your knees bent.","Hold a barbell with an underhand grip, palms facing up, and your hands shoulder-width apart.","Rest your forearms on your thighs, allowing your wrists to hang off the edge.","Slowly curl your wrists upward, bringing the barbell towards your forearms.","Pause for a moment at the top, then slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Barbell Zercher Squat","gif":"LSTChY9.gif","primaryMuscles":["glutes"],"secondaryMuscles":["quadriceps","hamstrings","calves","core"],"equipment":"barbell","bodyParts":["upper legs"],"instructions":["Stand with your feet shoulder-width apart and toes slightly turned out.","Hold the barbell in the crooks of your elbows, with your h body weight","bodyParts":["upper legs"],"instructions":["Sit on a bench with your back against the bench and your feet flat on the ground.","Place your hands on the bench for support.","Engage your glutes and hamstrings, then lift your hips off the bench until your body forms a straight line from your knees to your shoulders.","Pause for a moment at the top, then slowly lower your hips back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Bench Pull-Ups","gif":"mExgrF9.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Position yourself under a bar or a sturdy horizontal surface that is at chest height.","Grab the bar or surface with an overhand grip, slightly wider than shoulder-width apart.","Hang with your arms fully extended and your body straight.","Pull your chest towards the bar or surface by squeezing your shoulder blades together and bending your elbows.","Continue pulling until your chin is above the bar or surface.","Lower yourself back down to the starting position with control.","Repeat for the desired number of repetitions."]},{"name":"Bent Knee Lying Twist (Male)","gif":"6sYyrRX.gif","primaryMuscles":["glutes"],"secondaryMuscles":["obliques","hip flexors"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Extend your arms out to the sides, perpendicular to your body.","Keeping your knees together, slowly lower them to one side, aiming to touch the ground with your knees.","Pause for a moment, then engage your core and slowly lift your knees back to the starting position.","Repeat the movement to the other side.","Continue alternating sides for the desired number of repetitions."]},{"name":"Biceps Leg Concentration Curl","gif":"sJFIDIp.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Sit on a bench with your legs spread apart and your feet flat on the ground.","Hold a dumbbell in one hand and place your elbow on the inside of your thigh, just above the knee.","With your palm facing up, curl the dumbbell towards your shoulder while keeping your upper arm stationary.","Squeeze your biceps at the top of the movement, then slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Biceps Narrow Pull-Ups","gif":"50BETrz.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Hang from a pull-up bar with your palms facing towards you and your hands shoulder-width apart.","Engage your core and pull yourself up towards the bar, focusing on using your biceps to lift your body.","Pause for a moment at the top, then slowly lower yourself back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Biceps Pull-Up","gif":"guT8YnS.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Hang from a pull-up bar with your palms facing away from you and your hands shoulder-width apart.","Engage your core and pull yourself up by bending your elbows, bringing your chest towards the bar.","Pause at the top of the movement, then slowly lower yourself back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Body-Up","gif":"U6G2gk9.gif","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"equipment":"body weight","bodyParts":["upper arms"],"instructions":["Start by placing your hands on a raised surface, such as a bench or parallel bars, with your palms facing down and fingers pointing forward.","Extend your legs out in front of you, keeping your heels on the ground and your body straight."," es together.","Pause for a moment at the top of the movement, then slowly release and return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Bodyweight Standing One Arm Row","gif":"xbkPfaw.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart, knees slightly bent, and hold a dumbbell in one hand.","Bend forward at the hips, keeping your back straight and your core engaged.","Let the dumbbell hang straight down in front of you, with your arm fully extended.","Pull the dumbbell up towards your chest, keeping your elbow close to your body.","Squeeze your shoulder blades together at the top of the movement.","Lower the dumbbell back down to the starting position.","Repeat for the desired number of repetitions, then switch sides."]},{"name":"Bodyweight Standing One Arm Row (With Towel)","gif":"O4oIqQD.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","forearms"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart, knees slightly bent, and hold a towel with one hand.","Bend forward at the hips, keeping your back straight and your core engaged.","Pull the towel towards your chest, squeezing your shoulder blades together.","Pause for a moment at the top, then slowly lower the towel back to the starting position.","Repeat for the desired number of repetitions, then switch to the other arm."]},{"name":"Bodyweight Standing Row","gif":"wd4ds3s.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","shoulders"],"equipment":"body weight","bodyParts":["back"],"instructions":["Stand with your feet shoulder-width apart and knees slightly bent.","Grasp a bar or handles with an overhand grip, palms facing down.","Keep your back straight and core engaged.","Pull the bar or handles towards your body, squeezing your shoulder blades together.", e foot that is on the box, returning to the starting position.","Repeat the exercise with the other leg."]},{"name":"Bridge - Mountain Climber (Cross Body)","gif":"9c6T1YX.gif","primaryMuscles":["abs"],"secondaryMuscles":["glutes","quadriceps","hamstrings","shoulders","triceps"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Start in a high plank position with your hands directly under your shoulders and your body in a straight line.","Engage your core and lift your right foot off the ground, bringing your right knee towards your left elbow.","Return your right foot to the starting position and repeat the movement with your left foot towards your right elbow.","Continue alternating sides, moving at a controlled pace.","Keep your hips level and avoid lifting your hips too high or sagging them too low.","Maintain a steady breathing pattern throughout the exercise.","Repeat for the desired number of repetitions."]},{"name":"Burpee","gif":"dK9394r.gif","primaryMuscles":["cardiovascular system"],"secondaryMuscles":["quadriceps","hamstrings","calves","shoulders","chest"],"equipment":"body weight","bodyParts":["cardio"],"instructions":["Start in a standing position with your feet shoulder-width apart.","Lower your body into a squat position by bending your knees and placing your hands on the floor in front of you.","Kick your feet back into a push-up position.","Perform a push-up, keeping your body in a straight line.","Jump your feet back into the squat position.","Jump up explosively, reaching your arms overhead.","Land softly and immediately lower back into a squat position to begin the next repetition."]},{"name":"Butterfly Yoga Pose","gif":"bWlZvXh.gif","primaryMuscles":["adductors"],"secondaryMuscles":["hamstrings","groin"],"equipment":"body weight","bodyParts":["upper legs"],"instructions":["Sit on the floor with your legs extended in front of you.","Bend your knees and bring the soles of your feet together, allowing your knees to fall out to the sides.","Hold onto your ankles or feet with your hands.","Sit up tall and lengthen your spine.","Gently press your knees down towards the floor, feeling a stretch in your inner thighs.","Hold this position for a few breaths.","To release, slowly bring your knees back up and extend your legs."]},{"name":"Butt-Ups","gif":"qcNN2FN.gif","primaryMuscles":["abs"],"secondaryMuscles":["hip flexors","lower back"],"equipment":"body weight","bodyParts":["waist"],"instructions":["Lie flat on your back with your knees bent and feet flat on the ground.","Place your hands by your sides, palms facing down.","Engaging your abs, lift your legs off the ground, bringing your knees towards your chest.","At the top of the movement, squeeze your abs and pause for a moment.","Slowly lower your legs back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Alternate Shoulder Press","gif":"KHPZL0b.gif","primaryMuscles":["delts"],"secondaryMuscles":["triceps","upper back"],"equipment":"cable","bodyParts":["shoulders"],"instructions":["Stand with your feet shoulder-width apart and grasp the handles of the cable machine with an overhand grip.","Position your hands at shoulder height, with your palms facing forward.","Keep your core engaged and your back straight.","Press one handle up and forward until your arm is fully extended.","Pause for a moment at the top, then slowly lower the handle back to the starting position.","Repeat with the other arm.","Alternate between arms for the desired number of repetitions."]},{"name":"Cable Alternate Triceps Extension","gif":"Gchi5Tr.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Stand facing the cable machine with your feet shoulder-width apart.","Hold the cable handle with your right hand and bring your arm up so that your upper arm is parallel to the ground and your elbow is bent at a 90-degree angle.","Keep your upper arm stationary and extend your forearm backward, fully straightening your arm.","Pause for a moment, then slowly return to the starting position.","Repeat with your left arm.","Continue alternating arms for the desired number of repetitions."]},{"name":"Cable Assisted Inverse Leg Curl","gif":"zHEpuuc.gif","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","calves"],"equipment":"cable","bodyParts":["upper legs"],"instructions":["Adjust the cable machine so that the ankle attachment is at the lowest setting.","Lie face down on the bench with your legs straight and the ankle attachment secured to your ankles.","Hold onto the handles of the bench for stability.","Keeping your upper body stationary, exhale and curl your legs up towards your glutes by flexing your knees.","Pause for a moment at the top of the movement, squeezing your hamstrings.","Inhale and slowly lower your legs back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Bar Lateral Pulldown","gif":"eYnzaCm.gif","primaryMuscles":["lats"],"secondaryMuscles":["biceps","rhomboids","rear deltoids"],"equipment":"cable","bodyParts":["back"],"instructions":["Adjust the cable pulley to a high position and attach a straight bar.","Sit facing the cable machine with your feet flat on the ground and your knees slightly bent.","Grasp the bar with an overhand grip, slightly wider than shoulder-width apart.","Lean back slightly and keep your chest up, maintaining a slight arch in your lower back.","Pull the bar down towards your chest, leading with your elbows and squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly return the bar to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Bench Press","gif":"7xI5MXA.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"cable","bodyParts":["chest"],"instructions":["Adjust the cable machine to chest height and s with an overhand grip, keeping your arms straight and your shoulders back.","Engage your glutes and hamstrings to lift the cable handles, extending your hips and standing up straight.","Pause for a moment at the top, then slowly lower the cable handles back down to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Decline Fly","gif":"7saC5zz.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["shoulders","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Adjust the cable machine to a decline position.","Stand facing away from the machine with your feet shoulder-width apart.","Hold the handles with your palms facing forward and your arms extended straight out in front of you.","Keeping a slight bend in your elbows, open your arms out to the sides in a controlled motion.","Pause for a moment at the fully extended position, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Decline One Arm Press","gif":"KHGNa16.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"cable","bodyParts":["chest"],"instructions":["Adjust the cable machine to a decline position.","Stand facing away from the machine and grab the handle with one hand.","Position yourself with your back against the decline bench and your arm extended straight in front of you.","Bend your elbow and lower the handle towards your chest while keeping your upper arm stationary.","Pause for a moment at the bottom, then push the handle back up to the starting position.","Repeat for the desired number of repetitions, then switch arms."]},{"name":"Cable Decline Press","gif":"2Pya1cP.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["triceps","shoulders"],"equipment":"cable","bodyParts":["chest"],"instructions":["Adjust the cable machine to a decline position.","Sit on the decline bench facing the cable machine.","Grasp the handles with an overhand grip an  back straight and your core engaged.","Raise the cable handle in front of you, keeping your arms straight and your palms facing down.","Continue lifting until your arms are parallel to the floor.","Pause for a moment at the top, then slowly lower the cable handle back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Hammer Curl (With Rope)","gif":"HPlPoQA.gif","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Stand upright with your feet shoulder-width apart and a slight bend in your knees.","Hold the cable rope attachment with an underhand grip, palms facing each other, and your arms fully extended.","Keeping your upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the cable rope attachment until your biceps are fully contracted and the rope is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale and slowly begin to lower the cable rope attachment back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable High Pulley Overhead Tricep Extension","gif":"1xHyxys.gif","primaryMuscles":["triceps"],"secondaryMuscles":["shoulders"],"equipment":"cable","bodyParts":["upper arms"],"instructions":["Attach a rope to a high pulley and stand facing away from the machine.","Grasp the rope with both hands and extend your arms overhead.","Keep your elbows close to your head and your upper arms stationary.","Slowly lower the rope behind your head by bending your elbows.","Pause for a moment, then extend your arms back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable High Row (Kneeling)","gif":"ZSJNetl.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","shoulders"],"equipment":"cable","bodyParts":["back"],"instructions":["Attach a straight bar to a cable machine at chest height.","Kneel down in front of the cable machine and grab the bar with an overhand grip, hands shoulder-width apart.","Sit back on your heels, keeping your back straight and your core engaged.","Pull the bar towards your upper abdomen, squeezing your shoulder blades together.","Pause for a moment at the top of the movement, then slowly release the bar back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Hip Adduction","gif":"hBGWILP.gif","primaryMuscles":["adductors"],"secondaryMuscles":["glutes","quadriceps"],"equipment":"cable","bodyParts":["upper legs"],"instructions":["Attach the ankle cuff to your ankle and stand facing the cable machine.","Position yourself far enough away from the machine so that there is tension on the cable.","Place your hands on the machine for support.","Keeping your leg straight, slowly move your leg across your body towards the midline.","Pause for a moment at the end of the movement, then slowly return to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Incline Bench Press","gif":"Vh0GsK4.gif","primaryMuscles":["pectorals"],"secondaryMuscles":["deltoids","triceps"],"equipment":"cable","bodyParts":["chest"],"instructions":["Adjust the bench to a 45-degree incline.","Attach the cable handles to the high pulleys.","Sit on the bench facing the cable machine with your feet flat on the ground.","Grasp the handles with an overhand grip and bring them to shoulder height.","Push the handles forward and upward until your arms are fully extended.","Pause for a moment, then slowly lower the handles back to the starting position.","Repeat for the desired number of repetitions."]},{"name":"Cable Incline Bench Row","gif":"yaMIo4D.gif","primaryMuscles":["upper back"],"secondaryMuscles":["biceps","rear deltoids"],"equipment":"cable","bodyParts":["back"],"instructions":["Set up an incline bench at a 45-degree angle and attach a cable handle to the low pulley.","Sit on the
